[project]
name = "skill-atlas"
version = "0.1.0"
description = "Browse, toggle, update, and clean up your Claude Code skills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF003", "SIM105"]

[tool.mypy]
python_version = "3.10"
files = ["*.py"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
