<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skill Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2362aee6'/%3E%3Cpath d='M19.5 7 12.5 25' stroke='%23101820' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: oklch(.165 .008 250); --surface-1: oklch(.195 .009 250); --surface-2: oklch(.235 .011 250); --surface-3: oklch(.275 .012 250);
    --border: oklch(.27 .01 250); --border-strong: oklch(.34 .012 250);
    --text: oklch(.95 .004 250); --text-2: oklch(.80 .01 250); --text-3: oklch(.66 .012 250); --text-disabled: oklch(.48 .01 250);
    --accent: oklch(.76 .11 240); --on-accent: oklch(.17 .02 240);
    --on: oklch(.76 .15 155); --warn: oklch(.82 .12 75); --danger: oklch(.76 .14 25);
    --knob: oklch(.98 0 0);
    --focus: oklch(.95 0 0 / .85);
    --tint-accent: color-mix(in oklch, var(--accent) 14%, var(--surface-1));
    --tint-on: color-mix(in oklch, var(--on) 12%, var(--surface-1));
    --tint-warn: color-mix(in oklch, var(--warn) 12%, var(--surface-1));
    --tint-danger: color-mix(in oklch, var(--danger) 14%, var(--surface-1));
    --row-hover: var(--surface-1); --row-selected: var(--surface-2);
    --shadow-pop: 0 0 0 1px var(--border-strong), 0 2px 4px oklch(0 0 0 / .3), 0 12px 32px oklch(0 0 0 / .45);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --r-sm: 4px; --r-md: 6px; --r-lg: 10px; --r-pill: 999px;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --ease-out-quart: cubic-bezier(.165, .84, .44, 1);
    --ease-in-out-cubic: cubic-bezier(.645, .045, .355, 1);
    --ease-in-cubic: cubic-bezier(.55, .055, .675, .19);
    --ease-swap: cubic-bezier(.25, .1, 0, 1);
    --ease-drawer: cubic-bezier(.32, .72, 0, 1);
    --z-sticky: 10; --z-header: 20; --z-drawer: 30; --z-menu: 40; --z-toast: 50; --z-help: 60;
    --head-h: 85px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: oklch(.985 .003 250); --surface-1: oklch(1 0 0); --surface-2: oklch(.955 .005 250); --surface-3: oklch(.925 .006 250);
      --border: oklch(0 0 0 / .09); --border-strong: oklch(0 0 0 / .16);
      --text: oklch(.23 .012 250); --text-2: oklch(.43 .014 250); --text-3: oklch(.52 .014 250); --text-disabled: oklch(.68 .01 250);
      --accent: oklch(.50 .115 245); --on-accent: oklch(1 0 0);
      --on: oklch(.50 .115 155); --warn: oklch(.52 .11 65); --danger: oklch(.52 .17 25);
      --focus: oklch(.25 0 0 / .8);
      --shadow-pop: 0 0 0 1px var(--border), 0 2px 4px oklch(0 0 0 / .06), 0 12px 32px oklch(0 0 0 / .12);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  mark { background: color-mix(in oklch, var(--accent) 28%, transparent); color: inherit; border-radius: 2px; }
  a { color: var(--text-2); text-decoration-color: var(--border-strong); text-underline-offset: 2px; }
  a:hover { color: var(--text); }
  kbd {
    display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
    font: 500 11px/1 var(--mono); color: var(--text-3);
    border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: var(--r-sm);
  }
  .tnum { font-variant-numeric: tabular-nums; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- buttons ---------- */
  .btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 28px; padding: 0 10px; border-radius: var(--r-md); border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer;
    transition: color 120ms ease, background-color 120ms ease, border-color 120ms ease, scale 150ms var(--ease-out);
  }
  .btn::before { content: ""; position: absolute; inset: -6px -2px; }
  .btn:hover { color: var(--text); }
  .btn:active { scale: .96; }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .btn.primary:hover { background: color-mix(in oklch, var(--accent) 88%, var(--text)); color: var(--on-accent); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.accent { background: transparent; border-color: transparent; color: var(--accent); }
  .btn.accent:hover { background: var(--tint-accent); }
  .btn.danger { color: var(--danger); }
  .btn.danger.confirm { background: var(--danger); border-color: transparent; color: var(--on-accent); }
  .btn.warn { color: var(--warn); }
  .btn.warn.confirm { background: var(--warn); border-color: transparent; color: oklch(.2 .02 75); }
  .btn.icon { width: 28px; padding: 0; }
  .btn[disabled] { color: var(--text-disabled); cursor: default; }
  .btn svg { width: 14px; height: 14px; flex: none; }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: var(--z-header); background: var(--bg); border-bottom: 1px solid var(--border); }
  .bar1, .bar2 { max-width: 1440px; margin: 0 auto; padding: 0 var(--s5); display: flex; align-items: center; gap: var(--s3); }
  .bar1 { height: 48px; }
  .bar2 { height: 36px; gap: var(--s4); }
  .brand { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .brand svg { width: 18px; height: 18px; }
  .search { position: relative; flex: 1; max-width: 520px; }
  .search input {
    width: 100%; height: 32px; padding: 0 40px 0 32px; border-radius: var(--r-md);
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text); font-size: 13px;
    transition: border-color 120ms ease, background-color 120ms ease;
  }
  .search input::placeholder { color: var(--text-3); }
  .search input:focus-visible { outline: none; border-color: var(--border-strong); background: var(--surface-2); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .glass { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 14px; height: 14px; color: var(--text-3); pointer-events: none; }
  .search kbd { position: absolute; right: 8px; top: 50%; translate: 0 -50%; pointer-events: none; }
  .search .k-esc { display: none; }
  .search input:focus ~ .k-slash, .search input:not(:placeholder-shown) ~ .k-slash { display: none; }
  .search input:focus:not(:placeholder-shown) ~ .k-esc { display: inline-grid; }
  .cluster { margin-left: auto; display: flex; align-items: center; gap: var(--s2); font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .cluster b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .cluster .warn { color: var(--warn); }
  .meta { margin-left: auto; display: flex; gap: var(--s3); font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
  .meta b { color: var(--text-2); font-weight: 500; font-variant-numeric: tabular-nums; }
  .meta code { font: 11.5px var(--mono); color: var(--text-2); }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
  .check input { accent-color: var(--accent); margin: 0; }

  .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-md); background: var(--surface-1); border: 1px solid var(--border); }
  .seg[hidden] { display: none; }
  .seg button {
    height: 22px; padding: 0 8px; border: 0; border-radius: var(--r-sm); background: none; color: var(--text-3);
    font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: color 120ms ease, background-color 120ms ease;
  }
  .seg button[hidden] { display: none; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
  .seg .n { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"] .n { color: var(--text-2); }

  #bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; pointer-events: none; opacity: 0; transition: opacity 180ms ease-in; }
  #bar.on { opacity: 1; transition: none; }
  #bar i { display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 280ms var(--ease-out-quart); }

  .band {
    height: 28px; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--tint-warn); color: var(--warn); font-size: 12px; border-top: 1px solid var(--border);
  }
  .band[hidden] { display: none; }
  .band code { font: 11.5px var(--mono); color: var(--text); }

  /* ---------- layout ---------- */
  main { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 420px; align-items: start; }
  #list { min-width: 0; padding: 0 var(--s3) 96px var(--s5); }

  .sec { margin-top: var(--s3); }
  .sec-head {
    position: sticky; top: var(--head-h); z-index: var(--z-sticky); height: 32px; background: var(--bg);
    display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2) 0 6px;
  }
  .sec-head .fold { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .sec-head .fold .n { font-weight: 500; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .sec-head .tools { margin-left: auto; }

  .fold {
    position: relative; display: inline-flex; align-items: center; gap: 6px; min-width: 0;
    background: none; border: 0; padding: 0; cursor: pointer; color: inherit; border-radius: var(--r-sm);
  }
  .fold::before { content: ""; position: absolute; inset: -10px -4px; }
  .chev { width: 12px; height: 12px; flex: none; color: var(--text-3); transition: transform 150ms var(--ease-out-quart); }
  .fold[aria-expanded="false"] .chev { transform: rotate(-90deg); }

  .group-head {
    position: sticky; top: calc(var(--head-h) + 32px); z-index: calc(var(--z-sticky) - 1);
    height: 38px; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2) 0 6px;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .group + .group { margin-top: 4px; }
  .gname { font: 600 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gsub { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .gsub .tnum { color: var(--text-2); }
  .gctl { display: flex; align-items: center; gap: var(--s2); flex: none; }
  .group.collapsed .group-head { border-bottom-color: transparent; }

  /* ---------- rows ---------- */
  .row {
    position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: var(--s3);
    min-height: 44px; padding: 4px var(--s2) 4px 15px; border-radius: var(--r-md);
    scroll-margin-top: calc(var(--head-h) + 76px); scroll-margin-bottom: 24px;
  }
  .row::before {
    content: ""; position: absolute; left: 4px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px;
    background: transparent; transition: background-color 200ms ease;
  }
  .row[data-st="on"]::before, .row[data-st="done"]::before { background: var(--on); }
  .row[data-st="outdated"]::before, .row[data-st="busy"]::before { background: var(--accent); }
  .row[data-st="edited"]::before { background: var(--warn); }
  .row[data-st="project"]::before { background: var(--border-strong); }
  .row[data-st="busy"]::before { animation: rail 1.2s ease-in-out infinite alternate; }
  @keyframes rail { to { opacity: .35; } }
  @media (hover: hover) and (pointer: fine) { .row:hover { background: var(--row-hover); } }
  .row[aria-current="true"] { background: var(--row-selected); }
  .row[aria-current="true"]::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px var(--border-strong);
  }
  .row:has(.open:focus-visible)::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 2px var(--focus);
  }
  .row.enter { transition: opacity 240ms var(--ease-out-quart), transform 240ms var(--ease-out-quart); }
  @starting-style { .row.enter { opacity: 0; transform: translateY(4px); } }
  .row.restored { animation: restored 700ms ease-out; }
  @keyframes restored { from { background: color-mix(in oklch, var(--accent) 14%, transparent); } }
  .open { all: unset; cursor: pointer; min-width: 0; display: grid; gap: 1px; padding: 2px 0; }
  .nm { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
  .nmt { font: 500 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .slash { color: var(--text-3); }
  .desc { color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row[data-off] .nmt { color: var(--text-3); }
  .row[data-off] .desc { color: var(--text-disabled); }
  .kh { display: none; gap: 4px; }
  .row:has(.open:focus-visible) .kh { display: inline-flex; }

  body.compact .row { min-height: 30px; padding-top: 1px; padding-bottom: 1px; }
  body.compact .row::before { top: 7px; bottom: 7px; }
  body.compact .open { display: flex; align-items: center; gap: var(--s3); }
  body.compact .nm { flex: none; max-width: 48%; }
  body.compact .desc { color: var(--text-3); flex: 1; min-width: 0; }

  .tags { display: inline-flex; gap: 4px; flex: none; }
  .tag {
    display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--r-sm);
    border: 1px solid var(--border); font: 500 11px var(--sans); color: var(--text-3); white-space: nowrap;
  }
  .tag.edited { color: var(--warn); background: var(--tint-warn); border-color: transparent; }
  .tag.gone { border-style: dashed; }
  .tag.update { color: var(--accent); background: var(--tint-accent); border-color: transparent; }

  .uslot { display: flex; justify-content: flex-end; min-width: 84px; }
  .uslot:empty { min-width: 0; }
  .ustate { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; transition: opacity 150ms var(--ease-in-cubic); }
  .ustate.is-busy { color: var(--accent); }
  .ustate.is-done { color: var(--on); }
  .ustate.is-leaving { opacity: 0; }
  .uicon { display: inline-grid; width: 12px; height: 12px; }
  .uicon > * { grid-area: 1 / 1; transition: opacity 300ms var(--ease-swap), transform 300ms var(--ease-swap), filter 300ms var(--ease-swap); }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; border-top-color: transparent; }
  .spin, .tick { opacity: 0; transform: scale(.3); filter: blur(3px); }
  .is-busy .spin { opacity: 1; transform: none; filter: none; animation: spin 700ms linear infinite; }
  .is-done .tick { opacity: 1; transform: none; filter: none; }
  .tick { width: 12px; height: 12px; }
  .is-queued .uicon { display: none; }
  @keyframes spin { to { rotate: 360deg; } }

  /* ---------- switch ---------- */
  .switch {
    position: relative; flex: none; width: 32px; height: 18px; padding: 0; border: 0; border-radius: var(--r-pill);
    background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--border-strong); cursor: pointer;
    transition: background-color 150ms ease, box-shadow 150ms ease; transition-delay: var(--d, 0ms);
  }
  .switch::before { content: ""; position: absolute; inset: -7px -6px; }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--text-2); box-shadow: 0 1px 2px oklch(0 0 0 / .35);
    transition: transform 150ms var(--ease-out-quart), background-color 150ms ease, scale 150ms var(--ease-out); transition-delay: var(--d, 0ms);
  }
  .switch[aria-checked="true"] { background: var(--on); box-shadow: none; }
  .switch[aria-checked="true"]::after { transform: translateX(14px); background-color: var(--knob); }
  .switch[aria-checked="mixed"] { background: var(--tint-on); box-shadow: inset 0 0 0 1px var(--on); }
  .switch[aria-checked="mixed"]::after {
    transform: translateX(7px); background: var(--knob) linear-gradient(var(--on), var(--on)) center / 6px 1.5px no-repeat;
  }
  .switch:active::after { scale: .96; }
  .switch[aria-disabled="true"] { cursor: default; background: var(--surface-2); }
  body.ro .switch { display: none; }
  .switch[aria-disabled="true"]::after { background: var(--text-disabled); }

  /* ---------- menu ---------- */
  .menu-wrap { position: relative; display: inline-flex; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: var(--z-menu); min-width: 210px; padding: 4px;
    background: var(--surface-2); border-radius: var(--r-lg); box-shadow: var(--shadow-pop);
    transform-origin: top right; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out);
  }
  @starting-style { .menu { opacity: 0; transform: scale(.97); } }
  .menu [role="menuitem"] {
    display: flex; align-items: center; width: 100%; height: 30px; padding: 0 10px; border: 0; border-radius: var(--r-md);
    background: none; color: var(--text); font-size: 12.5px; text-align: left; cursor: pointer; white-space: nowrap;
  }
  .menu [role="menuitem"]:hover, .menu [role="menuitem"]:focus-visible { background: var(--surface-3); outline: none; }
  .menu [role="menuitem"].danger { color: var(--danger); }
  .menu [role="menuitem"].danger.confirm { background: var(--danger); color: var(--on-accent); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }

  /* ---------- link form ---------- */
  .linkform {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px var(--s2); align-items: end;
    padding: var(--s3); background: var(--surface-1); border-bottom: 1px solid var(--border);
    transition: opacity 180ms var(--ease-out-quart), transform 180ms var(--ease-out-quart);
  }
  @starting-style { .linkform { opacity: 0; transform: translateY(-4px); } }
  .linkform label { grid-column: 1 / -1; font-size: 11.5px; color: var(--text-3); }
  .linkform input {
    height: 28px; padding: 0 8px; border-radius: var(--r-md); border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: 12.5px var(--mono); min-width: 0;
  }
  .linkform input:focus-visible { outline-offset: 0; }
  .linkform .err { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; color: var(--danger); font-size: 12px; }
  .linkform .err svg { width: 14px; height: 14px; flex: none; }
  .card .linkform { padding: 0; background: none; border: 0; margin-top: var(--s2); grid-template-columns: minmax(0, 1fr) auto; }

  /* ---------- empty ---------- */
  .empty { padding: 72px var(--s5); text-align: center; color: var(--text-2); }
  .empty h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--text); text-wrap: balance; }
  .empty p { margin: 0 0 var(--s4); }
  .empty .acts { display: inline-flex; gap: var(--s2); }

  /* ---------- detail ---------- */
  #detail {
    position: sticky; top: var(--head-h); height: calc(100dvh - var(--head-h)); overflow: auto; overscroll-behavior: contain;
    background: var(--surface-1); border-left: 1px solid var(--border); padding: 20px var(--s5) 64px;
  }
  .d-top { display: flex; align-items: flex-start; gap: 4px; }
  .d-title { flex: 1; min-width: 0; margin: 0; padding-top: 2px; font: 600 18px/1.3 var(--mono); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .d-title .slash { font-weight: 500; }
  .d-sub { margin: 4px 0 0; font-size: 12px; color: var(--text-3); overflow-wrap: anywhere; }
  .d-desc { margin: var(--s4) 0 0; color: var(--text-2); max-width: 65ch; }
  .d-desc.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .d-more { margin-top: 6px; }
  .linkbtn { position: relative; background: none; border: 0; padding: 0; color: var(--text-2); font-size: 12px; cursor: pointer; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 2px; }
  .linkbtn::before { content: ""; position: absolute; inset: -12px -6px; }
  .linkbtn:hover { color: var(--text); }
  .d-sec { margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--border); display: grid; gap: var(--s3); }
  .card { display: flex; align-items: center; gap: var(--s3); padding: var(--s3); border-radius: var(--r-lg); background: var(--surface-2); }
  .card.accent { background: var(--tint-accent); }
  .card > div { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-2); }
  .card strong { display: block; color: var(--text); font-weight: 600; font-size: 13px; }
  .card code { font: 11.5px var(--mono); color: var(--text-3); overflow-wrap: anywhere; }
  .card .uslot { min-width: 0; }
  .note { font-size: 12px; color: var(--text-3); margin: 4px 0 0; }
  .note.warn { color: var(--warn); }
  dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px var(--s3); margin: 0; font-size: 12.5px; }
  dt { color: var(--text-3); }
  dd { margin: 0; color: var(--text-2); overflow-wrap: anywhere; }
  dd.mono { font: 12px var(--mono); }
  details summary { cursor: pointer; font-size: 12.5px; color: var(--text-2); width: fit-content; }
  details summary:hover { color: var(--text); }
  pre.body {
    margin: var(--s2) 0 0; padding: var(--s3); max-height: 360px; overflow: auto; border-radius: var(--r-md);
    background: var(--bg); border: 1px solid var(--border); font: 11.5px/1.55 var(--mono); color: var(--text-2); white-space: pre-wrap;
  }
  pre.body::-webkit-scrollbar { width: 8px; }
  pre.body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .danger-zone { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
  .danger-zone .note { flex-basis: 100%; }
  .danger-zone .btn.danger { margin-left: auto; }
  .d-close { display: none; }

  .inv h3 { margin: 0 0 var(--s3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
  .stat { padding: 10px var(--s3); border-radius: var(--r-lg); background: var(--surface-2); }
  .stat b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .stat span { font-size: 12px; color: var(--text-3); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px var(--s3); align-items: center; font-size: 12.5px; color: var(--text-2); }
  .keys > span:nth-child(odd) { display: inline-flex; gap: 4px; justify-content: flex-end; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: var(--z-toast);
    translate: -50% 0; width: max-content; max-width: min(640px, calc(100vw - 32px));
    display: flex; align-items: center; gap: var(--s3); min-height: 40px; padding: 6px 6px 6px 14px;
    background: var(--surface-3); color: var(--text); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); font-size: 13px;
    transition: opacity 220ms var(--ease-out-quart), transform 220ms var(--ease-out-quart);
  }
  @starting-style { #toast { opacity: 0; transform: translateY(8px); } }
  #toast[hidden] { display: none; }
  #toast.leaving { opacity: 0; transform: translateY(6px); transition-duration: 150ms; transition-timing-function: var(--ease-in-cubic); }
  #toast .acts { display: flex; align-items: center; gap: 4px; flex: none; }
  #toast:not(:has(.acts)) { padding-right: 14px; }

  /* ---------- help ---------- */
  #help {
    position: fixed; inset: 0; z-index: var(--z-help); display: grid; place-items: center; padding: var(--s4);
    background: oklch(0 0 0 / .45); transition: opacity 180ms var(--ease-out);
  }
  @starting-style { #help { opacity: 0; } }
  #help[hidden] { display: none; }
  #help .sheet {
    width: min(420px, 100%); padding: 20px var(--s5) var(--s5); border-radius: var(--r-lg); background: var(--surface-2); box-shadow: var(--shadow-pop);
    transition: transform 180ms var(--ease-out);
  }
  @starting-style { #help .sheet { transform: scale(.97); } }
  #help h2 { margin: 0 0 var(--s4); font-size: 15px; display: flex; align-items: center; }
  #help h2 .btn { margin-left: auto; }

  /* ---------- narrow ---------- */
  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .bar2 { overflow-x: auto; scrollbar-width: none; }
    .meta { display: none; }
    #detail {
      position: fixed; top: 0; right: 0; bottom: 0; height: auto; width: min(420px, 100vw); z-index: var(--z-drawer);
      box-shadow: var(--shadow-pop); border-left: 0; visibility: hidden; transform: translateX(100%);
      transition: transform 200ms var(--ease-in-cubic), visibility 0s linear 200ms;
    }
    #detail[data-open] { visibility: visible; transform: none; transition: transform 280ms var(--ease-drawer), visibility 0s; }
    .d-close { display: inline-flex; }
  }
  @media (max-width: 720px) {
    .bar1, .bar2 { padding: 0 var(--s3); }
    .brand span, .cluster > [data-k="t"] { display: none; }
    .bar2 { overflow-x: auto; scrollbar-width: none; }
    .meta { display: none; }
    #list { padding: 0 var(--s2) 96px; }
    .uslot { min-width: 0; }
    .gsub { display: none; }
    .search input, .linkform input { font-size: 16px; }
    #detail {
      top: auto; left: 0; width: 100%; height: 85dvh; border-radius: 14px 14px 0 0;
      transform: translateY(100%); padding-bottom: calc(64px + env(safe-area-inset-bottom));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-property: color, background-color, border-color, box-shadow !important; animation: none !important; }
    .switch, .switch::after { transition-delay: 0ms !important; }
    .spin { display: none; }
    @starting-style { .menu, .linkform, #toast, #help, #help .sheet, .row.enter { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<header id="head">
  <div class="bar1">
    <h1 class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M19.5 7 12.5 25" stroke="var(--bg)" stroke-width="3.2" stroke-linecap="round"/></svg><span>Skill Atlas</span></h1>
    <div class="seg" id="roots" role="group" aria-label="Settings file"></div>
    <div class="search">
      <svg class="glass" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="search" id="q" placeholder="Search skills, sources, paths" aria-label="Search skills" autocomplete="off" spellcheck="false">
      <kbd class="k-slash">/</kbd><kbd class="k-esc">esc</kbd>
    </div>
    <div class="cluster" id="cluster"></div>
  </div>
  <div class="bar2">
    <div class="seg" id="view" role="group" aria-label="Show">
      <button data-v="all" aria-pressed="true">All <span class="n" data-n="all"></span></button>
      <button data-v="on" aria-pressed="false">On <span class="n" data-n="on"></span></button>
      <button data-v="off" aria-pressed="false">Off <span class="n" data-n="off"></span></button>
      <button data-v="updates" aria-pressed="false" id="viewUpdates">Updates <span class="n" data-n="updates"></span></button>
    </div>
    <div class="seg" id="groupBy" role="group" aria-label="Group your skills">
      <button data-g="source" aria-pressed="true">By source</button>
      <button data-g="type" aria-pressed="false">By scope</button>
    </div>
    <label class="check"><input type="checkbox" id="showProject"> Project skills</label>
    <label class="check"><input type="checkbox" id="showStale"> Old plugin versions</label>
    <div class="meta" id="meta"></div>
  </div>
  <div class="band" id="band" hidden>Read-only build. Run <code>./atlas</code> to change skills.</div>
  <div id="bar" aria-hidden="true"><i></i></div>
</header>

<main>
  <div id="list"></div>
  <aside id="detail" aria-label="Skill details"></aside>
</main>
<div id="toast" role="status" hidden></div>
<div id="announce" class="vh" aria-live="polite"></div>
<div id="help" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <h2 id="helpTitle">Keyboard shortcuts <button class="btn ghost icon" data-help-close aria-label="Close shortcuts"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></h2>
    <div class="keys" id="helpKeys"></div>
  </div>
</div>

<script id="data" type="application/json">__SKILL_ATLAS_DATA__</script>
<script>
let DATA = JSON.parse(document.getElementById('data').textContent);
let SKILLS = DATA.skills;
const WRITABLE = Boolean(DATA.api_token);
const ROOT_LABELS = Object.keys(DATA.config_roots);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');

const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tilde = p => String(p || '').replace(/^\/Users\/[^/]+/, '~');
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const groupMap = (list, fn) => {
  const m = new Map();
  for (const x of list) { const k = fn(x); m.has(k) ? m.get(k).push(x) : m.set(k, [x]); }
  return [...m];
};

const ui = {
  root: ROOT_LABELS[0], view: 'all', q: '', showProject: false, showStale: false, selected: null,
  groupBy: localStorage.getItem('atlas.groupBy') || 'source',
  compact: localStorage.getItem('atlas.compact') === '1',
  menu: null, confirm: null, linkOpen: null, linkErr: null, previewOpen: false, descOpen: false, restored: new Set(),
};
const NO_SOURCE = 'Local, no upstream';
const sourceOf = s => s.origin?.source || s._prefix || NO_SOURCE;
const isLocalGroup = source => source === NO_SOURCE || source.endsWith('-*');
const live = s => s.scope === 'personal' && s.config_roots.includes(ui.root);

const ICON = {
  chev: '<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  tick: '<svg class="tick" viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 6.5 2.3 2.3L9.5 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  dots: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/></svg>',
  copy: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M11 3.5V3a1 1 0 0 0-1-1H3.5a1 1 0 0 0-1 1v6.5a1 1 0 0 0 1 1H4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
  check: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  refresh: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  close: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  alert: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.8v3.6M8 10.9v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
};

// Leading boilerplate shared by most descriptions; the detail panel keeps the full text.
const BOILER = /^(when the user (wants|asks|needs)( help)?( to| with| for)?|use (this skill )?when( the user)?|use this when|this skill should be used when|use for)\s+/i;
function cleanDesc(d) {
  const t = String(d || '').replace(BOILER, '');
  return t ? t[0].toUpperCase() + t.slice(1) : '';
}

function index() {
  const personal = SKILLS.filter(s => s.scope === 'personal');
  // Untracked skills that share a name prefix (emil-animations, emil-color…) get their own group.
  const prefixOf = s => (s.name.includes('-') ? s.name.split('-')[0] : null);
  const counts = {};
  for (const s of personal) if (!s.origin?.source && prefixOf(s)) counts[prefixOf(s)] = (counts[prefixOf(s)] || 0) + 1;
  const byDesc = {};
  for (const s of personal) if (s.description) (byDesc[s.description] ||= []).push(s);

  // Label each group with the longest dash-separated prefix its members share: source-command-*.
  const labels = {};
  for (const p of Object.keys(counts).filter(p => counts[p] >= 3)) {
    const parts = personal.filter(s => !s.origin?.source && prefixOf(s) === p).map(s => s.name.split('-'));
    let n = 1;
    while (parts.every(x => x.length > n + 1 && x[n] === parts[0][n])) n++;
    labels[p] = parts[0].slice(0, n).join('-') + '-*';
  }

  SKILLS.forEach((s, i) => {
    s.id = i;
    s._prefix = s.scope === 'personal' && !s.origin?.source ? labels[prefixOf(s)] || null : null;
    s._dupes = (byDesc[s.description] || []).filter(x => x !== s).map(x => x.name);
    s._desc = cleanDesc(s.description);
    s._hay = [s.name, s.invoke, s.description, s.plugin, s.marketplace, s.project, s.path, sourceOf(s)]
      .filter(Boolean).join(' ').toLowerCase();
  });
}
index();

// Update state for GitHub-tracked skills, keyed by their lock name (the folder name).
const upd = { status: {}, errors: {}, checking: false, checkedAt: null, job: null, confirm: null };
const RUNNING = new Set(['queued', 'downloading', 'installing']);
const jobState = name => upd.job?.items[name]?.state;
const isBusy = name => RUNNING.has(jobState(name));
const lockName = s => (s.scope === 'personal' && s.origin?.skillFolderHash ? s.dir_name : null);
const updStatus = s => upd.status[lockName(s)];
const isOutdated = s => updStatus(s) === 'outdated';
const jobRunning = () => Boolean(upd.job && !upd.job.done);

// What the switch shows for one skill under the chosen settings file.
function state(s) {
  const cfg = DATA.settings[ui.root] || { skillOverrides: {}, enabledPlugins: {} };
  if (s.scope === 'personal') {
    const mode = cfg.skillOverrides[s.name] || 'on';
    return { on: mode !== 'off', mode, toggle: 'skill', key: s.name };
  }
  if (s.scope === 'plugin') {
    if (s.status === 'stale') return { on: false, mode: 'old version' };
    const v = cfg.enabledPlugins[s.plugin_ref];
    return { on: v === true, mode: v === undefined ? 'not set' : '', toggle: 'plugin', key: s.plugin_ref };
  }
  return { on: true, mode: 'project only' };
}

function inView(s) {
  if (s.scope !== 'project' && !s.config_roots.includes(ui.root)) return false;
  if (s.scope === 'project' && !ui.showProject) return false;
  if (s.status === 'stale' && !ui.showStale) return false;
  return true;
}

function visible(s) {
  if (!inView(s)) return false;
  if (ui.view === 'updates') { if (!isOutdated(s)) return false; }
  else if (ui.view !== 'all' && state(s).on !== (ui.view === 'on')) return false;
  const terms = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
  return terms.every(t => s._hay.includes(t));
}

function highlight(text) {
  let out = esc(text);
  for (const t of ui.q.split(/\s+/).filter(t => t.length > 1)) {
    out = out.replace(new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'gi'), '<mark>$1</mark>');
  }
  return out;
}

// ---------------------------------------------------------------- keyed patching
// Nodes with the same data-k survive a render, so transitions, focus, and scroll carry over.
function morph(from, to) {
  // `open` belongs to <details> and `style` to runtime motion; templates never set either.
  for (const a of [...from.attributes]) if (!to.hasAttribute(a.name) && a.name !== 'open' && a.name !== 'style') from.removeAttribute(a.name);
  for (const a of to.attributes) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  if (to.hasAttribute('data-leaf')) { if (from.innerHTML !== to.innerHTML) from.innerHTML = to.innerHTML; return; }
  patchChildren(from, to);
}

function sameKind(a, b) {
  if (a.nodeType !== b.nodeType) return false;
  if (a.nodeType !== 1) return true;
  return a.tagName === b.tagName && !a.dataset.k && !b.dataset.k;
}

function patchChildren(parent, next) {
  const oldKids = [...parent.childNodes];
  const byKey = new Map();
  for (const n of oldKids) if (n.nodeType === 1 && n.dataset.k) byKey.set(n.dataset.k, n);
  const used = new Set();
  const plan = [...next.childNodes].map((nn, i) => {
    let m = null;
    if (nn.nodeType === 1 && nn.dataset.k) {
      m = byKey.get(nn.dataset.k);
      if (m && (m.tagName !== nn.tagName || used.has(m))) m = null;
    } else if (oldKids[i] && !used.has(oldKids[i]) && sameKind(oldKids[i], nn)) {
      m = oldKids[i];
    }
    if (m) used.add(m);
    return [nn, m];
  });
  for (const n of oldKids) if (!used.has(n)) n.remove();
  plan.forEach(([nn, m], i) => {
    let node = m;
    if (m) {
      if (m.nodeType === 1) morph(m, nn);
      else if (m.data !== nn.data) m.data = nn.data;
    } else {
      node = nn;
    }
    const at = parent.childNodes[i];
    if (at !== node) parent.insertBefore(node, at || null);
  });
}

function patch(target, html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  patchChildren(target, tpl.content);
}

// ---------------------------------------------------------------- pieces
function switchHtml(on, label, attrs) {
  const disabled = !attrs || !WRITABLE;
  // aria-checked="mixed" is only valid on checkboxes, so a part-on group reports as one.
  return `<button class="switch" data-k="sw" role="${on === 'mixed' ? 'checkbox' : 'switch'}" aria-checked="${on}" aria-label="${esc(label)}"
    ${disabled ? 'aria-disabled="true"' : ''} ${attrs || ''}></button>`;
}

function tagsHtml(s, st) {
  const tags = [
    s.local_edits ? '<span class="tag edited" title="Changed after install. Updating replaces your changes.">edited</span>' : '',
    updStatus(s) === 'unknown' ? '<span class="tag gone" title="Not found in the source repo. It may have moved or been removed.">not upstream</span>' : '',
    isOutdated(s) && !WRITABLE ? '<span class="tag update">update</span>' : '',
    s.manual_only ? '<span class="tag" title="disable-model-invocation: Claude never calls it on its own">you only</span>' : '',
    st.mode && !['on', 'off', 'not set', 'project only'].includes(st.mode) ? `<span class="tag">${esc(st.mode)}</span>` : '',
    s.status === 'stale' ? `<span class="tag">v${esc(s.plugin_version)}</span>` : '',
    s._dupes?.length ? `<span class="tag" title="Same description as ${esc(s._dupes.join(', '))}">same as ${esc(s._dupes[0])}</span>` : '',
  ].filter(Boolean);
  if (!tags.length) return '';
  const extra = tags.length - 2;
  return `<span class="tags">${tags.slice(0, 2).join('')}${extra > 0 ? `<span class="tag" title="See the detail panel">+${extra}</span>` : ''}</span>`;
}

function rowState(s, st) {
  const n = lockName(s);
  const js = n && jobState(n);
  if (js && RUNNING.has(js)) return 'busy';
  if (js === 'done') return 'done';
  if (s.scope === 'project') return 'project';
  if (!st.on) return 'off';
  if (s.local_edits) return 'edited';
  if (isOutdated(s)) return 'outdated';
  return 'on';
}

function updateSlot(s, primary = false) {
  const name = lockName(s);
  if (!name || !WRITABLE) return '';
  const js = jobState(name);
  if (js && js !== 'failed') {
    const cls = js === 'queued' ? 'is-queued' : js === 'done' ? 'is-done' : 'is-busy';
    const label = js === 'queued' ? 'Queued' : js === 'done' ? 'Updated' : REDUCED.matches ? 'Updating…' : 'Updating';
    return `<span class="ustate ${cls}${upd.job.leaving ? ' is-leaving' : ''}" data-k="st"><span class="uicon"><i class="spin"></i>${ICON.tick}</span><span>${label}</span></span>`;
  }
  if (js === 'failed') return `<button class="btn danger" data-k="retry" data-update="${esc(name)}" title="${esc(upd.job.items[name].error)}">Retry</button>`;
  if (!isOutdated(s)) return '';
  if (upd.confirm === name) return `<button class="btn warn confirm" data-k="upd" data-update="${esc(name)}" data-confirmed="1">Replace my edits</button>`;
  return `<button class="btn ${primary ? 'primary' : 'accent'}" data-k="upd" data-update="${esc(name)}">Update</button>`;
}

function row(s) {
  const st = state(s);
  const ctl = s.scope === 'personal'
    ? switchHtml(st.on, `${s.name}: turn ${st.on ? 'off' : 'on'}`, `data-kind="skill" data-key="${esc(st.key)}"`)
    : '<span></span>';
  const hints = s.scope === 'personal' && WRITABLE ? `<span class="kh" aria-hidden="true"><kbd>x</kbd>${isOutdated(s) ? '<kbd>u</kbd>' : ''}</span>` : '<span></span>';
  const cls = ui.restored.has(s.path) ? 'row enter restored' : 'row';
  return `<div class="${cls}" data-k="r:${esc(s.path)}" data-st="${rowState(s, st)}"${st.on ? '' : ' data-off'} aria-current="${ui.selected === s}">
    <button class="open" data-id="${s.id}" data-leaf><span class="nm"><span class="nmt"><span class="slash">/</span>${highlight(s.invoke)}</span>${tagsHtml(s, st)}</span><span class="desc">${highlight(s._desc || 'No description')}</span></button>
    ${hints}<span class="uslot" data-k="u">${updateSlot(s)}</span>${ctl}
  </div>`;
}

const collapsed = new Set(JSON.parse(localStorage.getItem('atlas.collapsed') || '[]'));
const isOpen = id => Boolean(ui.q) || !collapsed.has(id);

function fold(id, inner, label) {
  return `<button class="fold" data-k="fold" data-fold="${esc(id)}" aria-expanded="${isOpen(id)}" aria-label="${esc(label)}">${ICON.chev}${inner}</button>`;
}

function section(id, title, count, body, groupIds = []) {
  const tools = groupIds.length > 1 && !ui.q
    ? `<span class="tools" data-k="t"><button class="linkbtn" data-fold-all="${esc(groupIds.join('\n'))}">${groupIds.every(g => collapsed.has(g)) ? 'Expand all' : 'Collapse all'}</button></span>`
    : '';
  return `<section class="sec" data-k="${esc(id)}">
    <div class="sec-head" data-k="h">${fold(id, `<span data-leaf>${title}</span> <span class="n">${count}</span>`, title)}${tools}</div>
    ${isOpen(id) ? `<div class="sec-body" data-k="b">${body}</div>` : ''}
  </section>`;
}

function group(id, headInner, body) {
  const open = isOpen(id);
  return `<div class="group${open ? '' : ' collapsed'}" data-k="${esc(id)}">
    <div class="group-head" data-k="h">${headInner}</div>${open ? body : ''}
  </div>`;
}

function groupUpdateButton(list, attrs, { label = 'Update', cls = 'btn accent', count = true } = {}) {
  const out = list.filter(isOutdated);
  if (!out.length || !WRITABLE) return '';
  if (out.some(s => isBusy(lockName(s)))) return `<button class="${cls}" data-k="gu" disabled>Updating…</button>`;
  return `<button class="${cls}" data-k="gu" ${attrs}>${label}${count ? ` <span class="tnum">${out.length}</span>` : ''}</button>`;
}

function groupMenu(source, all) {
  if (!WRITABLE) return '';
  const open = ui.menu === source;
  const confirm = ui.confirm === 'group:' + source;
  const items = [
    isLocalGroup(source) ? `<button role="menuitem" data-show-link="${esc(source)}">Link to GitHub…</button><hr>` : '',
    `<button role="menuitem" class="danger${confirm ? ' confirm' : ''}" data-delete-source="${esc(source)}">${confirm ? `Move ${all.length} to Trash` : `Delete ${plural(all.length, 'skill')}…`}</button>`,
  ].join('');
  return `<span class="menu-wrap" data-k="mw">
    <button class="btn ghost icon" data-k="mb" data-menu="${esc(source)}" aria-haspopup="menu" aria-expanded="${open}" aria-label="More actions for ${esc(source)}">${ICON.dots}</button>
    ${open ? `<div class="menu" data-k="m" role="menu" aria-label="${esc(source)} actions">${items}</div>` : ''}
  </span>`;
}

function linkForm(key, names, { cancel = false } = {}) {
  const err = ui.linkErr?.key === key ? `<div class="err" role="alert">${ICON.alert}${esc(ui.linkErr.msg)}</div>` : '';
  const id = 'lf-' + key.replace(/[^\w-]/g, '_');
  return `<form class="linkform" data-k="lf" data-key="${esc(key)}" data-names="${esc(names.join(' '))}">
    <label for="${id}">GitHub repo</label>
    <input id="${id}" name="repo" placeholder="owner/repo" autocomplete="off" spellcheck="false" required>
    <button class="btn">Link</button>${cancel ? '<button type="button" class="btn ghost" data-link-cancel>Cancel</button>' : ''}
    ${err}
  </form>`;
}

function sourceGroups(personal) {
  const groups = groupMap(personal, sourceOf);
  // Repos first, then name-prefix groups, then the rest; bigger groups first within each.
  const rank = src => (src === NO_SOURCE ? 2 : isLocalGroup(src) ? 1 : 0);
  groups.sort(([a, x], [b, y]) => rank(a) - rank(b) || y.length - x.length || a.localeCompare(b));
  return groups.map(([source, list]) => {
    const all = SKILLS.filter(s => live(s) && sourceOf(s) === source);
    const onCount = all.filter(s => state(s).on).length;
    const checked = onCount === all.length ? 'true' : onCount === 0 ? 'false' : 'mixed';
    const url = all.find(s => s.origin?.sourceUrl)?.origin.sourceUrl;
    const local = isLocalGroup(source);
    const id = 'src:' + source;
    const meta = `${local && source !== NO_SOURCE ? 'no source · ' : ''}<span class="tnum">${onCount}</span> of <span class="tnum">${all.length}</span> on${list.length < all.length ? ` · ${list.length} shown` : ''}${url ? ` · <a href="${esc(url.replace(/\.git$/, ''))}" target="_blank" rel="noreferrer">repo ↗</a>` : ''}`;
    const head = `${fold(id, `<span class="gname" data-leaf>${highlight(source)}</span>`, source)}
      <span class="gsub" data-leaf>${meta}</span>
      <span class="gctl" data-k="c">${groupUpdateButton(all, `data-update-source="${esc(source)}"`)}${groupMenu(source, all)}
      ${switchHtml(checked, `All ${all.length} skills from ${source}: turn ${checked === 'true' ? 'off' : 'on'}`, `data-kind="source" data-key="${esc(source)}"`)}</span>`;
    const form = local && ui.linkOpen === source ? linkForm('group:' + source, all.map(s => s.dir_name), { cancel: true }) : '';
    return group(id, head, form + list.map(row).join(''));
  }).join('');
}

function emptyHtml() {
  if (ui.q) {
    const hidden = SKILLS.filter(s => !inView(s) && ui.q.toLowerCase().split(/\s+/).every(t => s._hay.includes(t))).length;
    return `<div class="empty" data-k="empty"><h2>No skills match “${esc(ui.q)}”</h2>
      <p>${ui.view === 'all' ? 'Try fewer or shorter words.' : `The ${ui.view} filter is on.`}${hidden ? ` ${plural(hidden, 'hidden skill')} match.` : ''}</p>
      <span class="acts"><button class="btn" data-clear>Clear search</button>${hidden && !ui.showProject ? '<button class="btn ghost" data-show-project>Show project skills</button>' : ''}</span></div>`;
  }
  if (ui.view === 'updates') {
    const at = upd.checkedAt ? Date.parse(upd.checkedAt.replace(/([+-]\d\d)(\d\d)$/, '$1:$2')) : NaN;
    const ago = Number.isNaN(at) ? null : Math.max(0, Math.round((Date.now() - at) / 60000));
    return `<div class="empty" data-k="empty"><h2>Everything is up to date</h2>
      <p>${ago === null ? 'No check has run yet.' : ago ? `Checked ${ago}m ago.` : 'Checked just now.'}</p>
      <span class="acts"><button class="btn" data-recheck>Check again</button></span></div>`;
  }
  if (ui.view === 'off') return '<div class="empty" data-k="empty"><h2>Nothing is off</h2><p>Every skill in this view loads.</p></div>';
  return '<div class="empty" data-k="empty"><h2>No skills here</h2><p>Turn on Project skills or Old plugin versions to see more.</p></div>';
}

// ---------------------------------------------------------------- render
function render() {
  const byName = (a, b) => a.name.localeCompare(b.name);
  const inRoot = s => s.scope === 'project' || s.config_roots.includes(ui.root);
  const shown = SKILLS.filter(visible).sort(byName);
  const out = [];

  const personal = shown.filter(s => s.scope === 'personal');
  if (personal.length) {
    const total = SKILLS.filter(s => s.scope === 'personal' && inRoot(s)).length;
    const bySource = ui.groupBy === 'source';
    const body = bySource ? sourceGroups(personal) : personal.map(row).join('');
    const ids = bySource ? [...new Set(personal.map(s => 'src:' + sourceOf(s)))] : [];
    out.push(section('sec:personal', 'Your skills', personal.length === total ? total : `${personal.length} of ${total}`, body, ids));
  }

  const plugins = shown.filter(s => s.scope === 'plugin');
  if (plugins.length) {
    const refs = groupMap(plugins, s => s.plugin_ref).sort(([a], [b]) => a.localeCompare(b));
    const groups = refs.map(([ref, list]) => {
      const lv = list.find(s => s.status !== 'stale') || list[0];
      const st = state(lv);
      const ctl = lv.status === 'stale' ? '' :
        switchHtml(st.on, `Plugin ${lv.plugin}: turn ${st.on ? 'off' : 'on'}`, `data-kind="plugin" data-key="${esc(ref)}"`);
      const note = st.mode === 'not set' ? ' · not in enabledPlugins' : '';
      const head = `${fold('plg:' + ref, `<span class="gname" data-leaf>${highlight(lv.plugin)}</span>`, lv.plugin)}
        <span class="gsub" data-leaf>${esc(lv.marketplace)} · ${plural(list.length, 'skill')}${note}</span><span class="gctl" data-k="c">${ctl}</span>`;
      return group('plg:' + ref, head, list.map(row).join(''));
    });
    out.push(section('sec:plugins', 'Plugins', refs.length, groups.join(''), refs.map(([r]) => 'plg:' + r)));
  }

  const project = shown.filter(s => s.scope === 'project');
  if (project.length) {
    const byProject = groupMap(project, s => s.project).sort(([a], [b]) => a.localeCompare(b));
    const groups = byProject.map(([name, list]) => group('prj:' + name,
      `${fold('prj:' + name, `<span class="gname" data-leaf>${esc(name)}</span>`, name)}<span class="gsub" data-leaf>loads only inside this project · ${list.length}</span>`,
      list.map(row).join('')));
    out.push(section('sec:project', 'Project skills', project.length, groups.join(''), byProject.map(([n]) => 'prj:' + n)));
  }

  patch(el('list'), out.join('') || emptyHtml());
  renderChrome();
}

function renderChrome() {
  const lv = SKILLS.filter(s => s.status !== 'stale' && s.scope !== 'project' && s.config_roots.includes(ui.root));
  const on = lv.filter(s => state(s).on).length;
  const outdated = lv.filter(isOutdated);
  const counts = { all: lv.length, on, off: lv.length - on, updates: outdated.length };
  for (const n of document.querySelectorAll('[data-n]')) n.textContent = counts[n.dataset.n];
  el('viewUpdates').hidden = !WRITABLE;
  document.title = WRITABLE && outdated.length ? `(${outdated.length}) Skill Atlas` : 'Skill Atlas';

  patch(el('meta'), [
    `<span><b>${on}</b> on · <b>${lv.length - on}</b> off</span>`,
    DATA.bundled_skills_disabled ? '<span>built-ins off</span>' : '',
    `<span>writes <code>${esc(tilde(DATA.settings[ui.root]?.path))}</code></span>`,
  ].join(''));

  let cluster = '';
  if (WRITABLE) {
    const failed = Object.keys(upd.errors).length;
    const warn = failed ? `<span class="warn" data-k="w" title="${esc(Object.values(upd.errors).join('\n'))}">${plural(failed, 'source')} unchecked</span>` : '';
    const again = `<button class="btn ghost icon" data-k="re" data-recheck aria-label="Check for updates again" title="Check again">${ICON.refresh}</button>`;
    if (upd.job && !upd.job.fade) {
      const items = Object.values(upd.job.items);
      const finished = items.filter(i => !RUNNING.has(i.state)).length;
      cluster = upd.job.done
        ? `<span data-k="t">Updated <b>${items.filter(i => i.state === 'done').length}</b> of <b>${items.length}</b></span>`
        : `<span data-k="t">Updating <b>${finished}</b> of <b>${items.length}</b>…</span>`;
    } else if (upd.checking) {
      cluster = '<span data-k="t">Checking for updates…</span>';
    } else if (upd.checkedAt) {
      cluster = outdated.length
        ? `<span data-k="t"><b>${outdated.length}</b> ${outdated.length === 1 ? 'update' : 'updates'}</span>${warn}${groupUpdateButton(lv, 'data-update-all', { label: 'Update all', cls: 'btn primary', count: false })}${again}`
        : `<span data-k="t">Up to date</span>${warn}${again}`;
    }
  }
  patch(el('cluster'), cluster);
  renderBar();
}

function renderBar() {
  const items = Object.values(upd.job?.items || {});
  el('bar').classList.toggle('on', Boolean(items.length && !upd.job.fade));
  if (items.length) el('bar').firstChild.style.transform = `scaleX(${items.filter(i => !RUNNING.has(i.state)).length / items.length})`;
}

function resetBar() {
  const fill = el('bar').firstChild;
  fill.style.transition = 'none'; fill.style.transform = 'scaleX(0)';
  void fill.offsetWidth; fill.style.transition = '';
}

function field(label, value, mono) {
  if (value === undefined || value === null || value === '' || (Array.isArray(value) && !value.length)) return '';
  return `<dt>${esc(label)}</dt><dd${mono ? ' class="mono"' : ''}>${esc(Array.isArray(value) ? value.join(', ') : value)}</dd>`;
}

const KEYS = [
  [['/'], 'Search'], [['j', 'k'], 'Move between skills'], [['↵'], 'Open details'], [['x'], 'Turn on or off'],
  [['u'], 'Update'], [['c'], 'Compact rows'], [['esc'], 'Close or clear'], [['⌘', 'Z'], 'Undo'], [['?'], 'All shortcuts'],
];
const keysHtml = () => KEYS.map(([ks, label]) => `<span>${ks.map(k => `<kbd>${k}</kbd>`).join('')}</span><span>${label}</span>`).join('');

function inventoryHtml() {
  const lv = SKILLS.filter(s => s.status !== 'stale' && s.scope !== 'project' && s.config_roots.includes(ui.root));
  const personal = lv.filter(s => s.scope === 'personal');
  const stat = (n, label) => `<div class="stat"><b>${n}</b><span>${label}</span></div>`;
  return `<div class="inv" data-k="inv" data-leaf>
    <h3>Inventory</h3>
    <div class="stats">
      ${stat(lv.filter(s => state(s).on).length, 'on')}${stat(lv.filter(s => !state(s).on).length, 'off')}
      ${stat(WRITABLE ? lv.filter(isOutdated).length : '–', 'updates')}${stat(personal.filter(s => !lockName(s)).length, 'untracked')}
      ${stat(personal.filter(s => s._dupes.length).length, 'duplicates')}${stat(personal.filter(s => s.local_edits).length, 'edited')}
    </div>
    <div class="d-sec"><h3>Keyboard</h3><div class="keys">${keysHtml()}</div></div>
  </div>`;
}

function detailHtml(s) {
  const st = state(s);
  const o = s.origin || {};
  const ms = s.marketplace_source || {};
  const cards = [];
  if (s.scope === 'personal') {
    cards.push(`<div class="card" data-k="c-sw">${switchHtml(st.on, `${s.name}: turn ${st.on ? 'off' : 'on'}`, `data-kind="skill" data-key="${esc(st.key)}"`)}
      <div data-k="t" data-leaf><strong>${st.on ? 'On' : 'Off'}</strong><code>skillOverrides.${esc(s.name)}${st.mode === 'on' ? '' : ` = "${esc(st.mode)}"`}</code></div></div>`);
    const name = lockName(s);
    if (!name && WRITABLE) {
      cards.push(`<div class="card" data-k="c-link"><div><strong>Not linked to a repo</strong>Link it to get update checks.
        ${linkForm('skill:' + s.dir_name, [s.dir_name])}</div></div>`);
    } else if (name && (isOutdated(s) || jobState(name))) {
      cards.push(`<div class="card accent" data-k="c-upd"><div data-leaf><strong>Update available</strong>A newer version is on ${esc(o.source)}.
        ${s.local_edits ? '<p class="note warn">You changed this skill after install. Updating replaces your changes.</p>' : ''}</div>
        <span class="uslot" data-k="u">${updateSlot(s, true)}</span></div>`);
    } else if (s.local_edits) {
      cards.push('<p class="note warn" data-k="c-ed">You changed this skill after install.</p>');
    }
  } else if (s.scope === 'plugin' && s.status !== 'stale') {
    const n = SKILLS.filter(x => x.plugin_ref === s.plugin_ref && x.status !== 'stale').length;
    cards.push(`<div class="card" data-k="c-sw">${switchHtml(st.on, `Plugin ${s.plugin}: turn ${st.on ? 'off' : 'on'}`, `data-kind="plugin" data-key="${esc(st.key)}"`)}
      <div data-k="t" data-leaf><strong>Plugin ${st.on ? 'on' : 'off'}</strong>Turns all ${plural(n, 'skill')} in ${esc(s.plugin)} on or off together.</div></div>`);
  } else if (s.status === 'stale') {
    cards.push('<div class="card" data-k="c-st"><div><strong>Old version</strong>Claude Code no longer loads this copy.</div></div>');
  } else {
    cards.push(`<div class="card" data-k="c-pr"><div><strong>Project skill</strong>Loads only when you work inside ${esc(s.project)}.</div></div>`);
  }
  const src = ms.url || ms.repo || o.sourceUrl || o.source;
  const srcShort = o.source || String(src || '').replace(/^https:\/\/github\.com\//, '').replace(/\.git$/, '');
  const long = (s.description || '').length > 420;
  const confirm = ui.confirm === 'skill:' + s.dir_name;
  const sub = s.scope === 'plugin' ? s.plugin_ref : s.scope === 'project' ? `${s.project} · project` : sourceOf(s);
  return `
    <div class="d-top" data-k="top">
      <h2 class="d-title" data-leaf><span class="slash">/</span>${esc(s.invoke)}</h2>
      <button class="btn ghost icon" data-k="cp" data-copy="/${esc(s.invoke)}" aria-label="Copy /${esc(s.invoke)}" title="Copy">${ICON.copy}</button>
      <button class="btn ghost icon d-close" data-k="x" data-close aria-label="Close details">${ICON.close}</button>
    </div>
    <p class="d-sub" data-k="sub" data-leaf>${esc(sub)}${s._dupes.length ? ` · same as ${esc(s._dupes.join(', '))}` : ''}</p>
    <p class="d-desc${long && !ui.descOpen ? ' clamp' : ''}" data-k="desc" data-leaf>${esc(s.description || 'No description')}</p>
    ${long ? `<button class="linkbtn d-more" data-k="more" data-more aria-expanded="${ui.descOpen}">${ui.descOpen ? 'Show less' : 'Show more'}</button>` : ''}
    <div class="d-sec" data-k="cards">${cards.join('')}</div>
    <div class="d-sec" data-k="facts"><dl data-leaf>
      ${field('Who calls it', s.manual_only ? 'Only you, by name' : 'You or Claude')}
      ${field('Source', srcShort, true)}
      ${field('Version', s.plugin_version || s.version, true)}
      ${field('Updated', (s.last_updated || o.updatedAt || s.modified || '').slice(0, 10))}
      ${field('Tools', s.allowed_tools, true)}
      ${field('Arguments', s.argument_hint, true)}
      ${field('Size', `${s.words.toLocaleString()} words · ${plural(s.file_count, 'file')}`)}
      ${field('Path', tilde(s.path), true)}
    </dl></div>
    <div class="d-sec" data-k="pv"><details data-k="det"${ui.previewOpen ? ' open' : ''}><summary>Preview SKILL.md</summary><pre class="body" data-leaf>${esc(s.body_preview)}</pre></details></div>
    <div class="d-sec danger-zone" data-k="dz">
      ${src && /^https?:/.test(src) ? `<a class="btn ghost" data-k="repo" href="${esc(String(src).replace(/\.git$/, ''))}" target="_blank" rel="noreferrer">Open repo ↗</a>` : ''}
      ${WRITABLE ? `<button class="btn ghost" data-k="rv" data-reveal="${esc(s.path)}">Reveal in Finder</button>` : ''}
      ${WRITABLE && s.scope === 'personal' ? `<button class="btn danger${confirm ? ' confirm' : ''}" data-k="del" data-delete="${esc(s.dir_name)}">${confirm ? 'Move to Trash' : 'Delete…'}</button>
      <p class="note" data-k="dn">Delete moves the folder to the Trash and removes its lock entry. You can undo it.</p>` : ''}
    </div>`;
}

let detailFor;
function renderDetail() {
  const d = el('detail');
  const s = ui.selected;
  const key = s ? s.path : null;
  const html = s ? detailHtml(s) : inventoryHtml();
  if (key !== detailFor) {
    d.innerHTML = html; d.scrollTop = 0; detailFor = key;
  } else {
    patch(d, html);
  }
  if (s) d.setAttribute('data-open', ''); else d.removeAttribute('data-open');
}

function rerender() { render(); renderDetail(); }

// ---------------------------------------------------------------- toast
let toastTimer, toastGone, toastUndo = null;
function toast(html, undo) {
  const t = el('toast');
  clearTimeout(toastTimer); clearTimeout(toastGone);
  t.classList.remove('leaving');
  toastUndo = undo || null;
  const acts = undo ? '<span class="acts"><button class="btn accent" data-undo>Undo</button><kbd>⌘</kbd><kbd>Z</kbd></span>' : '';
  t.innerHTML = `<span>${html}</span>${acts}`;
  t.hidden = false;
  const words = t.textContent.split(/\s+/).length;
  const arm = ms => { clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms); };
  arm(Math.max(undo ? 8000 : 4000, words * 300));
  t.onmouseenter = () => clearTimeout(toastTimer);
  t.onmouseleave = () => arm(2500);
}
function hideToast() {
  const t = el('toast');
  clearTimeout(toastTimer);
  t.classList.add('leaving');
  toastUndo = null;
  toastGone = setTimeout(() => { t.hidden = true; t.classList.remove('leaving'); }, 150);
}
function runUndo() {
  const fn = toastUndo;
  if (!fn) return false;
  hideToast(); fn();
  return true;
}

// ---------------------------------------------------------------- server calls
async function api(path, body) {
  const res = await fetch(path, body === undefined
    ? { headers: { 'X-Atlas-Token': DATA.api_token } }
    : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Atlas-Token': DATA.api_token }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { data });
  return data;
}

async function post(kind, names, on) {
  DATA.settings[ui.root] = await api('/api/toggle', { root: ui.root, kind, names, on });
  rerender();
}

// Flip each visible switch in order so a bulk change reads top to bottom; the patch keeps these nodes.
function cascade(switches, on) {
  const step = Math.min(18, 140 / Math.max(switches.length, 1));
  switches.forEach((sw, i) => {
    if (!REDUCED.matches) sw.style.setProperty('--d', `${Math.round(i * step)}ms`);
    sw.setAttribute('aria-checked', on);
  });
  setTimeout(() => switches.forEach(sw => sw.style.removeProperty('--d')), 450);
}

function rowSwitches(names) {
  const set = new Set(names);
  return [...el('list').querySelectorAll('.row [data-kind="skill"]')].filter(sw => set.has(sw.dataset.key));
}

async function setSource(source, on) {
  const all = SKILLS.filter(s => live(s) && sourceOf(s) === source);
  // Only the skills that change, so Undo restores each one to where it was.
  const changed = all.filter(s => state(s).on !== on).map(s => s.name);
  cascade(rowSwitches(changed), on);
  await post('skill', changed, on);
  toast(`Turned <b>${plural(changed.length, 'skill')}</b> from <b>${esc(source)}</b> ${on ? 'on' : 'off'}. Restart Claude Code sessions to pick it up.`,
    async () => { cascade(rowSwitches(changed), !on); await post('skill', changed, !on); });
}

async function setSetting(kind, key, on, { quiet = false } = {}) {
  await post(kind, [key], on);
  if (!quiet) {
    const what = kind === 'plugin' ? `plugin ${key.split('@')[0]}` : key;
    toast(`Turned <b>${esc(what)}</b> ${on ? 'on' : 'off'}. Restart Claude Code sessions to pick it up.`,
      () => setSetting(kind, key, !on, { quiet: true }));
  }
}

async function checkUpdates(refresh = false) {
  upd.checking = true; renderChrome();
  try {
    const data = await api('/api/updates' + (refresh ? '?refresh=1' : ''));
    Object.assign(upd, { status: data.skills, errors: data.errors, checkedAt: data.checked_at });
  } catch (err) {
    toast(`Could not check for updates: ${esc(err.message)}`);
  } finally {
    upd.checking = false; rerender();
  }
}

async function reloadData() {
  const token = DATA.api_token;
  const path = ui.selected?.path;
  DATA = { ...(await api('/api/data')), api_token: token };
  SKILLS = DATA.skills; index();
  ui.selected = SKILLS.find(s => s.path === path) || null;
}

const announce = msg => { el('announce').textContent = msg; };

// Skills you edited are left out of batch updates; they need their own confirmed click.
async function runUpdate(skills, note = '') {
  const names = skills.map(lockName);
  if (!names.length) return;
  upd.confirm = null;
  if (upd.job?.done) upd.job = null;
  try {
    upd.job = await api('/api/update', { names });
  } catch (err) {
    return toast(`Could not start the update: ${esc(err.message)}`);
  }
  announce(`Updating ${plural(names.length, 'skill')}.`);
  resetBar(); rerender();

  while (!upd.job.done) {
    await sleep(300);
    const prev = JSON.stringify(upd.job.items);
    upd.job = await api('/api/jobs/' + upd.job.id).catch(() => upd.job);
    if (prev !== JSON.stringify(upd.job.items) || upd.job.done) rerender();
  }

  const items = Object.entries(upd.job.items);
  const failed = items.filter(([, i]) => i.state === 'failed');
  const ok = items.length - failed.length;
  await reloadData();
  await checkUpdates();
  const msg = failed.length
    ? `Updated ${ok}, <b>${failed.length} failed</b>: ${esc(failed[0][1].error)}. Use Retry on the row.`
    : `Updated <b>${ok === 1 ? esc(names[0]) : plural(ok, 'skill')}</b> in ${upd.job.seconds}s.${note} Restart Claude Code sessions to pick it up.`;
  toast(msg);
  announce(msg.replace(/<[^>]+>/g, ''));

  // Hold the full bar for a beat, fade it, then let the ✓ labels leave.
  const job = upd.job;
  await sleep(900); if (upd.job !== job) return;
  job.fade = true; renderChrome();
  await sleep(1100); if (upd.job !== job) return;
  job.leaving = true; rerender();
  await sleep(160); if (upd.job !== job) return;
  if (failed.length) {
    for (const [n, i] of items) if (i.state !== 'failed') delete job.items[n];
    job.leaving = false;
  } else {
    upd.job = null;
  }
  rerender();
}

function updateBatch(list) {
  if (jobRunning()) return toast('An update is already running.');
  const out = list.filter(isOutdated);
  const safe = out.filter(s => !s.local_edits);
  const skipped = out.length - safe.length;
  const note = skipped ? ` Skipped <b>${skipped}</b> you edited; update those one at a time.` : '';
  if (!safe.length) return toast(`All ${skipped} have your edits. Update them one at a time.`);
  runUpdate(safe, note);
}

function updateOne(name, confirmed) {
  if (jobRunning()) return toast('An update is already running.');
  const s = SKILLS.find(x => lockName(x) === name);
  if (!s) return;
  if (s.local_edits && !confirmed) {
    upd.confirm = name; rerender();
    setTimeout(() => { if (upd.confirm === name) { upd.confirm = null; rerender(); } }, 4000);
    return;
  }
  runUpdate([s]);
}

// Row positions before a change, so rows that stay can slide into place afterwards.
function measure() {
  const top = new Map();
  for (const r of el('list').querySelectorAll('.row')) {
    const b = r.getBoundingClientRect();
    if (b.bottom > 0 && b.top < innerHeight) top.set(r, b.top);
  }
  return top;
}
function flip(before) {
  if (REDUCED.matches) return;
  for (const [r, y] of before) {
    if (!r.isConnected) continue;
    const dy = y - r.getBoundingClientRect().top;
    if (Math.abs(dy) > 1) r.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 200, easing: 'cubic-bezier(.645,.045,.355,1)' });
  }
}

async function deleteSkills(list) {
  ui.confirm = null; ui.menu = null;
  const names = list.map(s => s.dir_name);
  try {
    await api('/api/delete', { names });
  } catch (err) {
    rerender();
    return toast(`Could not delete: ${esc(err.message)}`);
  }
  const paths = new Set(list.map(s => s.path));
  const rows = [...el('list').querySelectorAll('.row')].filter(r => paths.has(r.dataset.k.slice(2)));
  if (!REDUCED.matches && rows.length) {
    const anims = rows.slice(0, 40).map(r => r.animate([{}, { opacity: 0, transform: 'translateX(-8px)' }], { duration: 150, easing: 'cubic-bezier(.55,.055,.675,.19)', fill: 'forwards' }));
    await Promise.all(anims.map(a => a.finished.catch(() => {})));
  }
  if (names.includes(ui.selected?.dir_name)) ui.selected = null;
  await reloadData();
  const before = rows.length <= 40 ? measure() : new Map();
  rerender(); flip(before);
  toast(`Moved <b>${names.length === 1 ? esc(names[0]) : plural(names.length, 'skill')}</b> to the Trash.`, async () => {
    try {
      const r = await api('/api/undo-delete', {});
      await reloadData();
      ui.restored = new Set(SKILLS.filter(s => r.restored.includes(s.dir_name)).map(s => s.path));
      const b = measure();
      rerender(); flip(b);
      setTimeout(() => { ui.restored.clear(); rerender(); }, 1500);
      toast(`Put back ${plural(r.restored.length, 'skill')}.`);
    } catch (err) { toast(`Could not undo: ${esc(err.message)}`); }
  });
}

async function linkSkills(form) {
  const key = form.dataset.key;
  const btn = form.querySelector('button:not([type])');
  btn.disabled = true; btn.textContent = 'Linking…';
  try {
    const r = await api('/api/link', { names: form.dataset.names.split(' '), repo: form.repo.value });
    if (!r.linked.length) {
      ui.linkErr = { key, msg: `No folder in ${r.repo} has the same name as ${key.startsWith('skill:') ? 'this skill' : 'these skills'}.` };
      return;
    }
    ui.linkErr = null; ui.linkOpen = null;
    await reloadData(); await checkUpdates(true);
    toast(`Linked <b>${r.linked.length}</b> to ${esc(r.repo)}.${r.missing.length ? ` No folder for: ${esc(r.missing.join(', '))}.` : ''}`);
  } catch (err) {
    ui.linkErr = { key, msg: err.message };
  } finally {
    btn.disabled = false; btn.textContent = 'Link'; rerender();
  }
}

// ---------------------------------------------------------------- interaction
function armConfirm(key) {
  ui.confirm = key; rerender();
  setTimeout(() => { if (ui.confirm === key) { ui.confirm = null; rerender(); } }, 4000);
}

function closeMenu(focusButton = true) {
  if (!ui.menu) return;
  const src = ui.menu;
  ui.menu = null;
  if (ui.confirm?.startsWith('group:')) ui.confirm = null;
  render();
  if (focusButton) el('list').querySelector(`[data-menu="${CSS.escape(src)}"]`)?.focus();
}

function select(s) {
  ui.selected = s; ui.descOpen = false;
  rerender();
}

document.addEventListener('click', async e => {
  const t = e.target;
  if (ui.menu && !t.closest('.menu-wrap')) closeMenu(false);

  const sw = t.closest('.switch');
  if (sw) {
    if (!WRITABLE) return toast('This page is read-only. Run <b>./atlas</b> to change skills.');
    if (sw.getAttribute('aria-disabled') === 'true') return;
    const was = sw.getAttribute('aria-checked');
    const on = was !== 'true';
    sw.setAttribute('aria-checked', on);
    try {
      if (sw.dataset.kind === 'source') await setSource(sw.dataset.key, on);
      else await setSetting(sw.dataset.kind, sw.dataset.key, on);
    } catch (err) { sw.setAttribute('aria-checked', was); rerender(); toast(`Could not save: ${esc(err.message)}`); }
    return;
  }
  const u = t.closest('[data-update]');
  if (u) return updateOne(u.dataset.update, Boolean(u.dataset.confirmed));
  if (t.closest('[data-update-all]')) return updateBatch(SKILLS.filter(live));
  const us = t.closest('[data-update-source]');
  if (us) return updateBatch(SKILLS.filter(s => live(s) && sourceOf(s) === us.dataset.updateSource));
  if (t.closest('[data-recheck]')) return checkUpdates(true);

  const mb = t.closest('[data-menu]');
  if (mb) {
    if (ui.menu === mb.dataset.menu) return closeMenu();
    ui.menu = mb.dataset.menu; render();
    el('list').querySelector('.menu [role="menuitem"]')?.focus();
    return;
  }
  const f = t.closest('[data-fold]');
  if (f) {
    const id = f.dataset.fold;
    if (!ui.q) collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    localStorage.setItem('atlas.collapsed', JSON.stringify([...collapsed]));
    render(); return;
  }
  const fa = t.closest('[data-fold-all]');
  if (fa) {
    const ids = fa.dataset.foldAll.split('\n');
    const close = !ids.every(g => collapsed.has(g));
    ids.forEach(g => (close ? collapsed.add(g) : collapsed.delete(g)));
    localStorage.setItem('atlas.collapsed', JSON.stringify([...collapsed]));
    render(); return;
  }
  const sl = t.closest('[data-show-link]');
  if (sl) {
    ui.linkOpen = sl.dataset.showLink; ui.menu = null; ui.linkErr = null;
    collapsed.delete('src:' + ui.linkOpen);
    render(); el('list').querySelector('.linkform input')?.focus(); return;
  }
  if (t.closest('[data-link-cancel]')) {
    const src = ui.linkOpen;
    ui.linkOpen = null; ui.linkErr = null; render();
    el('list').querySelector(`[data-menu="${CSS.escape(src)}"]`)?.focus();
    return;
  }
  const del = t.closest('[data-delete], [data-delete-source]');
  if (del) {
    const key = del.dataset.delete ? 'skill:' + del.dataset.delete : 'group:' + del.dataset.deleteSource;
    if (ui.confirm !== key) return armConfirm(key);
    const list = del.dataset.delete
      ? SKILLS.filter(s => live(s) && s.dir_name === del.dataset.delete)
      : SKILLS.filter(s => live(s) && sourceOf(s) === del.dataset.deleteSource);
    return deleteSkills(list);
  }
  const rv = t.closest('[data-reveal]');
  if (rv) return api('/api/reveal', { path: rv.dataset.reveal }).catch(err => toast(`Could not reveal: ${esc(err.message)}`));
  const open = t.closest('.open');
  if (open) return select(SKILLS[+open.dataset.id]);
  if (t.closest('[data-close]')) { const p = ui.selected?.path; select(null); focusRow(p); return; }
  if (t.closest('[data-more]')) { ui.descOpen = !ui.descOpen; renderDetail(); return; }
  if (t.closest('[data-undo]')) return runUndo();
  const copy = t.closest('[data-copy]');
  if (copy) {
    await navigator.clipboard.writeText(copy.dataset.copy).catch(() => {});
    copy.innerHTML = ICON.check; copy.style.color = 'var(--on)';
    setTimeout(() => { copy.innerHTML = ICON.copy; copy.style.color = ''; }, 1500);
    return;
  }
  if (t.closest('[data-clear]')) return reset();
  if (t.closest('[data-show-project]')) { el('showProject').checked = true; ui.showProject = true; return render(); }
  if (t.closest('[data-help-close]') || t.id === 'help') return closeHelp();
});

document.addEventListener('toggle', e => {
  if (e.target.matches?.('#detail details')) ui.previewOpen = e.target.open;
}, true);

document.addEventListener('submit', e => {
  const form = e.target.closest('.linkform');
  if (!form) return;
  e.preventDefault();
  linkSkills(form);
});

function setSeg(container, attr, value) {
  for (const b of el(container).querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset[attr] === value);
}
el('roots').innerHTML = ROOT_LABELS.map(r => `<button data-r="${esc(r)}" aria-pressed="${r === ui.root}" title="${esc(tilde(DATA.config_roots[r]))}">${esc(r)}</button>`).join('');
el('roots').hidden = ROOT_LABELS.length < 2;
el('roots').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  ui.root = b.dataset.r; setSeg('roots', 'r', ui.root); rerender();
});
el('view').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  ui.view = b.dataset.v; setSeg('view', 'v', ui.view); render();
});
el('q').addEventListener('input', () => { ui.q = el('q').value.trim(); render(); });
el('showProject').addEventListener('change', e => { ui.showProject = e.target.checked; render(); });
el('showStale').addEventListener('change', e => { ui.showStale = e.target.checked; render(); });
setSeg('groupBy', 'g', ui.groupBy);
el('groupBy').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  ui.groupBy = b.dataset.g; localStorage.setItem('atlas.groupBy', ui.groupBy);
  setSeg('groupBy', 'g', ui.groupBy); render();
});

function reset() {
  el('q').value = ''; ui.q = ''; ui.view = 'all'; setSeg('view', 'v', 'all');
  ui.showProject = ui.showStale = false; el('showProject').checked = el('showStale').checked = false;
  render();
}

function setCompact(on) {
  ui.compact = on; document.body.classList.toggle('compact', on);
  localStorage.setItem('atlas.compact', on ? '1' : '0');
}

let helpReturn;
function openHelp() {
  helpReturn = document.activeElement;
  el('helpKeys').innerHTML = keysHtml();
  el('help').hidden = false;
  el('help').querySelector('[data-help-close]').focus();
}
function closeHelp() {
  if (el('help').hidden) return false;
  el('help').hidden = true; helpReturn?.focus?.();
  return true;
}

function focusRow(path) {
  const r = path && el('list').querySelector(`.row[data-k="r:${CSS.escape(path)}"] .open`);
  if (!r) return false;
  r.focus({ preventScroll: true }); r.closest('.row').scrollIntoView({ block: 'nearest' });
  return true;
}
function moveCursor(dir) {
  const all = [...el('list').querySelectorAll('.open')];
  if (!all.length) return;
  const i = all.indexOf(document.activeElement);
  const next = all[i < 0 ? (dir > 0 ? 0 : all.length - 1) : Math.max(0, Math.min(all.length - 1, i + dir))];
  next.focus({ preventScroll: true });
  next.closest('.row').scrollIntoView({ block: 'nearest' });
}

function menuKeys(e) {
  const items = [...el('list').querySelectorAll('.menu [role="menuitem"]')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus();
    return true;
  }
  if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); items[e.key === 'Home' ? 0 : items.length - 1]?.focus(); return true; }
  if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); return true; }
  if (e.key === 'Tab') { closeMenu(false); return true; }
  return false;
}

document.addEventListener('keydown', e => {
  const t = e.target;
  const typing = t.matches('input[type="search"], input[type="text"], input:not([type]), textarea');
  const mod = e.metaKey || e.ctrlKey;

  if (!el('help').hidden) {
    if (e.key === 'Escape' || e.key === '?') { e.preventDefault(); closeHelp(); }
    if (e.key === 'Tab') e.preventDefault();
    return;
  }
  if (ui.menu && t.closest?.('.menu-wrap') && menuKeys(e)) return;

  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); el('q').focus(); el('q').select(); return; }
  if (mod && e.key.toLowerCase() === 'z' && !typing && !e.shiftKey) { if (runUndo()) e.preventDefault(); return; }
  if (mod || e.altKey) return;

  if (e.key === 'Escape') {
    if (t === el('q')) {
      if (el('q').value) { el('q').value = ''; ui.q = ''; render(); }
      else { el('q').blur(); if (!focusRow(ui.selected?.path)) moveCursor(1); }
      return;
    }
    if (typing && t.closest('.linkform')) { ui.linkOpen = null; ui.linkErr = null; render(); return; }
    if (ui.menu) return closeMenu();
    if (ui.confirm || upd.confirm) { ui.confirm = null; upd.confirm = null; rerender(); return; }
    if (ui.selected) { const p = ui.selected.path; select(null); focusRow(p); }
    return;
  }
  if (typing) return;

  if (e.key === '/') { e.preventDefault(); el('q').focus(); el('q').select(); return; }
  if (e.key === '?') { e.preventDefault(); openHelp(); return; }
  if (e.key === 'c') { setCompact(!ui.compact); return; }
  if (e.key === 'j' || e.key === 'k') { e.preventDefault(); moveCursor(e.key === 'j' ? 1 : -1); return; }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && (t.matches('.open') || t === document.body)) {
    e.preventDefault(); moveCursor(e.key === 'ArrowDown' ? 1 : -1); return;
  }

  const rowEl = t.closest?.('.row');
  if (!rowEl || !t.matches('.open')) return;
  if (e.key === 'x' || e.key === ' ') {
    e.preventDefault();
    rowEl.querySelector('.switch[data-kind]:not([aria-disabled])')?.click();
    return;
  }
  if (e.key === 'u') {
    const b = rowEl.querySelector('[data-update]');
    if (b) updateOne(b.dataset.update, Boolean(b.dataset.confirmed));
  }
});

new ResizeObserver(() => document.documentElement.style.setProperty('--head-h', el('head').offsetHeight + 'px')).observe(el('head'));
el('band').hidden = WRITABLE;
document.body.classList.toggle('ro', !WRITABLE);
setCompact(ui.compact);
render();
renderDetail();
if (WRITABLE) checkUpdates();
</script>
</body>
