      m = oldKids[i];
    }
    if (m) used.add(m);
    return [nn, m];
  });
  for (const n of oldKids) if (!used.has(n)) n.remove();
  plan.forEach(([nn, m], i) => {
    let node = m;
    if (m) {
      if (m.nodeType === 1) morph(m, nn);
      else if (m.data !== nn.data) m.data = nn.data;
    } else {
      node = nn;
    }
    const at = parent.childNodes[i];
    if (at !== node) parent.insertBefore(node, at || null);
  });
}

function patch(target, html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  patchChildren(target, tpl.content);
}

// ---------------------------------------------------------------- pieces
// One dot per harness that loads the skill, filled when it is on there.
function harnessDots(s) {
  const ids = s.harnesses.filter(id => harness(id));
  const names = ids.map(id => `${harness(id).label}: ${state(s, id).on ? 'on' : 'off'}`).join('\n');
  return `<span class="hdots" data-k="sw" title="${esc(names)}" aria-label="${esc(names.replace(/\n/g, ', '))}">${ids.map(id => `<i${state(s, id).on ? ' data-on' : ''}></i>`).join('')}</span>`;
}

function switchHtml(on, label, attrs) {
  const disabled = !attrs || !WRITABLE;
  // aria-checked="mixed" is only valid on checkboxes, so a part-on group reports as one.
  return `<button class="switch" data-k="sw" role="${on === 'mixed' ? 'checkbox' : 'switch'}" aria-checked="${on}" aria-label="${esc(label)}"
    ${disabled ? 'aria-disabled="true"' : ''} ${attrs || ''}></button>`;
}

function tagsHtml(s, st) {
  const tags = [
    s.local_edits ? '<span class="tag edited" title="Changed after install. Updating replaces your changes.">edited</span>' : '',
    updStatus(s) === 'unknown' ? '<span class="tag gone" title="Not found in the source repo. It may have moved or been removed.">not upstream</span>' : '',
    isOutdated(s) && !WRITABLE ? '<span class="tag update">update</span>' : '',
    s.manual_only ? '<span class="tag manual" title="disable-model-invocation: the agent never calls it on its own">you only</span>' : '',
    s.claude_only ? '<span class="tag manual" title="user-invocable: false. It is not in the / menu">agent only</span>' : '',
    st.mode && !['on', 'off', 'not set', 'project only'].includes(st.mode) ? `<span class="tag">${esc(st.mode)}</span>` : '',
    s.status === 'stale' ? `<span class="tag">v${esc(s.plugin_version)}</span>` : '',
    s._dupes?.length ? `<span class="tag" title="Same description as ${esc(s._dupes.join(', '))}">same as ${esc(s._dupes[0])}</span>` : '',
  ].filter(Boolean);
  if (!tags.length) return '';
  const extra = tags.length - 2;
  return `<span class="tags">${tags.slice(0, 2).join('')}${extra > 0 ? `<span class="tag" title="See the detail panel">+${extra}</span>` : ''}</span>`;
}

function rowState(s, st) {
  const n = lockName(s);
  const js = n && jobState(n);
  if (js && RUNNING.has(js)) return 'busy';
  if (js === 'done') return 'done';
  if (s.scope === 'project') return 'project';
  if (!st.on) return 'off';
  if (s.local_edits) return 'edited';
  if (isOutdated(s)) return 'outdated';
  return 'on';
}

const VERBS = { install: ['Installing', 'Installed'], update: ['Updating', 'Updated'] };
const jobVerbs = () => VERBS[upd.job?.kind === 'install' ? 'install' : 'update'];

function jobBadge(js, [ing, ed], leaving = false) {
  const cls = js === 'queued' ? 'is-queued' : js === 'done' ? 'is-done' : 'is-busy';
  const label = js === 'queued' ? 'Queued' : js === 'done' ? ed : REDUCED.matches ? ing + '…' : ing;
  return `<span class="ustate ${cls}${leaving ? ' is-leaving' : ''}" data-k="st"><span class="uicon"><i class="spin"></i>${ICON.tick}</span><span>${label}</span></span>`;
}

function updateSlot(s, primary = false) {
  const name = lockName(s);
  if (!name || !WRITABLE) return '';
  const js = jobState(name);
  if (js && js !== 'failed') return jobBadge(js, jobVerbs(), upd.job.leaving);
  if (js === 'failed') return `<button class="btn danger" data-k="retry" data-update="${esc(name)}" title="${esc(upd.job.items[name].error)}">Retry</button>`;
  if (!isOutdated(s)) return '';
  if (upd.confirm === name) return `<button class="btn warn confirm" data-k="upd" data-update="${esc(name)}" data-confirmed="1">Replace my edits</button>`;
  return `<button class="btn ${primary ? 'primary' : 'accent'}" data-k="upd" data-update="${esc(name)}">Update</button>`;
}

// Cards show a picture only when the skill's own folder has one; otherwise a slim bar in the source's hue.
function thumbHtml(s, name) {
  if (ui.layout !== 'cards') return '';
  const b = skillBanner(s);
  if (!b?.own) return '<span class="thumb strip" aria-hidden="true"></span>';
  return `<span class="thumb" aria-hidden="true">${esc(monogram(name))}<img src="${esc(b.url)}" alt="" loading="lazy" decoding="async" onerror="this.remove()"></span>`;
}

function row(s) {
  const st = state(s);
  const ctl = s.scope !== 'personal' ? '<span></span>'
    : ui.root === 'all' ? harnessDots(s)
    : switchHtml(st.on, `${s.name}: turn ${st.on ? 'off' : 'on'}`, st.toggle ? `data-kind="skill" data-key="${esc(st.key)}"` : '');
  const hints = `<span class="kh" aria-hidden="true">${s.scope === 'personal' && WRITABLE ? `<kbd>x</kbd>${isOutdated(s) ? '<kbd>u</kbd>' : ''}` : ''}</span>`;
  const cls = ui.restored.has(s.path) ? 'row enter restored' : 'row';
  return `<div class="${cls}" data-k="r:${esc(s.path)}" data-st="${rowState(s, st)}"${st.on ? '' : ' data-off'}${isMarked(s) ? ' data-marked' : ''} aria-current="${ui.selected === s}">
    ${WRITABLE ? markHtml(s) : ''}<button class="open" data-id="${s.id}" data-leaf>${thumbHtml(s, s.name)}<span class="nm"><span class="nmt"><span class="slash">/</span>${highlight(s.invoke)}</span>${tagsHtml(s, st)}</span><span class="desc">${highlight(s._desc || 'No description')}</span></button>
    ${useCell(s)}${hints}<span class="uslot" data-k="u">${updateSlot(s)}</span>${ctl}
  </div>`;
}

// ---------------------------------------------------------------- marking for bulk actions
const MARK_ICONS = '<svg class="ck" viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 6.2 2.3 2.3L9.5 3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  + '<svg class="mx" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 6h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const markKey = s => 'r:' + s.path;
const isMarked = s => ui.marked.has(markKey(s));
const markedSkills = () => SKILLS.filter(isMarked);
function markHtml(s) {
  return `<button class="mark" data-k="mk" data-mark="${esc(markKey(s))}" role="checkbox" aria-checked="${isMarked(s)}" aria-label="Select /${esc(s.invoke)}">${MARK_ICONS}</button>`;
}
function markGroupHtml(id, list) {
  if (!list.length) return '';
  const n = list.filter(isMarked).length;
  const checked = n === 0 ? 'false' : n === list.length ? 'true' : 'mixed';
  return `<button class="mark" data-k="mg" data-mark-group="${esc(list.map(markKey).join('\n'))}" role="checkbox" aria-checked="${checked}" aria-label="Select all ${list.length} in ${esc(id.slice(4))}">${MARK_ICONS}</button>`;
}
// One box for every skill the filters show, collapsed groups included.
function allMarkHtml() {
  if (!WRITABLE) return '';
  const list = SKILLS.filter(s => visible(s) && s.kind !== 'avail');
  if (!list.length) return '';
  const n = list.filter(isMarked).length;
  const checked = n === 0 ? 'false' : n === list.length ? 'true' : 'mixed';
  const label = checked === 'true' ? `Clear all ${list.length}` : `Select all ${list.length} shown`;
  return `<button class="mark all" data-k="ma" data-mark-group="${esc(list.map(markKey).join('\n'))}" role="checkbox" aria-checked="${checked}" aria-label="${label}" title="${label}">${MARK_ICONS}</button>`;
}
function setMarks(keys, on) {
  for (const k of keys) on ? ui.marked.add(k) : ui.marked.delete(k);
  if (!ui.marked.size) { ui.bulkLink = false; ui.bulkErr = null; }
  render();
}
// Shift-click marks every visible row between the last mark and this one.
function markRange(key) {
  const keys = [...el('list').querySelectorAll('.row > .mark')].map(m => m.dataset.mark);
  const a = keys.indexOf(ui.lastMark), b = keys.indexOf(key);
  if (a < 0 || b < 0) return false;
  setMarks(keys.slice(Math.min(a, b), Math.max(a, b) + 1), true);
  return true;
}

const collapsed = new Set(JSON.parse(localStorage.getItem('atlas.collapsed') || '[]'));
const saveCollapsed = () => localStorage.setItem('atlas.collapsed', JSON.stringify([...collapsed]));
const isOpen = id => Boolean(ui.q) || !collapsed.has(id);

// The group name opens its detail; the chevron beside it folds the group.
function groupTitle(id, label, repo, nameHtml, open, list = []) {
  return `${WRITABLE ? markGroupHtml(id, list) : ''}${fold(id, '', `Show or hide ${label}`, open)}<button class="gopen" data-k="go" data-group="${esc(id)}" aria-label="Details for ${esc(label)}">${avatar(label, repo)}<span class="gname" data-leaf>${nameHtml}</span></button>`;
}

function fold(id, inner, label, open = isOpen(id)) {
  return `<button class="fold" data-k="fold" data-fold="${esc(id)}" aria-expanded="${open}" aria-label="${esc(label)}">${ICON.chev}${inner}</button>`;
}

function section(id, title, count, body, groupIds = [], extraTools = '') {
  const foldAll = groupIds.length > 1 && !ui.q
    ? `<button class="linkbtn" data-fold-all="${esc(groupIds.join('\n'))}">${groupIds.every(g => collapsed.has(g)) ? 'Expand all' : 'Collapse all'}</button>`
    : '';
  const tools = foldAll || extraTools
    ? `<span class="tools" data-k="t">${extraTools}${foldAll}</span>` : '';
  return `<section class="sec" data-k="${esc(id)}">
    <div class="sec-head" data-k="h">${fold(id, `<span data-leaf>${title}</span> <span class="n">${count}</span>`, title)}${tools}</div>
    ${isOpen(id) ? `<div class="sec-body" data-k="b">${body}</div>` : ''}
  </section>`;
}

function group(id, headInner, body, open = isOpen(id), h = hue(id)) {
  return `<div class="group${open ? '' : ' collapsed'}" data-k="${esc(id)}" style="--h: ${h}">
    <div class="group-head" data-k="h" aria-current="${selKey(ui.selected) === 'g:' + id}">${headInner}</div>${open ? body : ''}
  </div>`;
}

function groupUpdateButton(list, attrs, { label = 'Update', cls = 'btn accent', count = true } = {}) {
  const out = list.filter(isOutdated);
  if (!out.length || !WRITABLE) return '';
  if (out.some(s => isBusy(lockName(s)))) return `<button class="${cls}" data-k="gu" disabled>Updating…</button>`;
  return `<button class="${cls}" data-k="gu" ${attrs}>${label}${count ? ` <span class="tnum">${out.length}</span>` : ''}</button>`;
}

function groupMenu(source, all) {
  if (!WRITABLE) return '';
  const open = ui.menu === source;
  const watching = upd.watched.includes(source);
  const items = [
    watching ? `<button role="menuitem" data-unwatch="${esc(source)}">Stop watching</button>` : '',
    isLocalGroup(source) ? `<button role="menuitem" data-show-link="${esc(source)}">Link to GitHub…</button>` : '',
    all.some(s => s.store) ? `<button role="menuitem" class="danger" data-delete-source="${esc(source)}">Delete ${plural(all.filter(s => s.store).length, 'skill')}…</button>` : '',
  ].filter(Boolean);
  if (!items.length) return '';
  if (all.length && items.length > 1) items.splice(items.length - 1, 0, '<hr>');
  return `<span class="menu-wrap" data-k="mw">
    <button class="btn ghost icon" data-k="mb" data-menu="${esc(source)}" aria-haspopup="menu" aria-expanded="${open}" aria-label="More actions for ${esc(source)}">${ICON.dots}</button>
    ${open ? `<div class="menu" data-k="m" role="menu" aria-label="${esc(source)} actions">${items.join('')}</div>` : ''}
  </span>`;
}

function linkForm(key, names, { cancel = false } = {}) {
  const err = ui.linkErr?.key === key ? `<div class="err" role="alert">${ICON.alert}${esc(ui.linkErr.msg)}</div>` : '';
  const id = 'lf-' + key.replace(/[^\w-]/g, '_');
  return `<form class="linkform" data-k="lf" data-key="${esc(key)}" data-names="${esc(names.join(' '))}">
    <label for="${id}">GitHub repo</label>
    <input id="${id}" name="repo" placeholder="owner/repo" autocomplete="off" spellcheck="false" required>
    <button class="btn">Link</button>${cancel ? '<button type="button" class="btn ghost" data-link-cancel>Cancel</button>' : ''}
    ${err}
  </form>`;
}

function watchForm() {
  const msg = ui.linkErr?.key === 'watch' ? ui.linkErr.msg : '';
  const err = msg ? `<div class="err" role="alert">${ICON.alert}${esc(msg[0].toUpperCase() + msg.slice(1))}.</div>` : '';
  return `<form class="linkform" data-k="wf" data-watch>
    <label for="watch-repo">Watch a GitHub repo for new skills</label>
    <input id="watch-repo" name="repo" placeholder="owner/repo or URL" autocomplete="off" spellcheck="false" required>
    <button class="btn">Watch</button><button type="button" class="btn ghost" data-watch-cancel>Cancel</button>
    ${err}
  </form>`;
}

function availRow(repo, a) {
  const key = availKey(repo, a);
  const d = upd.descs[repo];
  const info = d?.skills?.[a.path];
  const desc = info ? highlight(cleanDesc(info.description) || 'No description')
    : d?.error ? `<span class="aerr">Description unavailable: ${esc(d.error)}</span>` : '<span class="skel" aria-label="Loading description"></span>';
  const js = upd.job?.kind === 'install' ? jobState(a.name) : null;
  let slot = '';
  if (js && js !== 'failed') {
    slot = jobBadge(js, VERBS.install);
  } else if (a.taken) {
    slot = a.taken === 'moved'
      ? '<span class="ustate" data-k="tk" title="This repo moved the folder of a skill you have. Update or relink it.">installed under an old path</span>'
      : `<span class="ustate" data-k="tk" title="A skill named ${esc(a.name)} is already installed">name in use</span>`;
  } else if (WRITABLE) {
    slot = `<button class="btn ${js === 'failed' ? 'danger' : 'accent'}" data-k="ins" data-install-one="${esc(repo)}" data-path="${esc(a.path)}"${js === 'failed' ? ` title="${esc(upd.job.items[a.name].error)}"` : ''}>${js === 'failed' ? 'Retry' : 'Install'}</button>`;
  }
  const hints = `<span class="kh" aria-hidden="true">${!a.taken && WRITABLE ? '<kbd>i</kbd>' : ''}</span>`;
  const tag = a.new ? '<span class="tags"><span class="tag update">new</span></span>' : '';
  return `<div class="row avail" data-k="${esc(key)}" data-st="${js === 'done' ? 'done' : RUNNING.has(js) ? 'busy' : a.new ? 'outdated' : 'avail'}" aria-current="${selKey(ui.selected) === key}">
    <button class="open" data-avail="${esc(repo)}" data-path="${esc(a.path)}" data-leaf>${thumbHtml({ kind: 'avail', repo, path: a.path }, a.name)}<span class="nm"><span class="nmt"><span class="slash">/</span>${highlight(a.name)}</span>${tag}</span><span class="desc">${desc}</span></button>
    <span class="use" data-k="use"></span>${hints}<span class="uslot" data-k="u">${slot}</span><span></span>
  </div>`;
}

const needDescs = new Set();

function availBlock(repo, shown, installed) {
  const all = upd.available[repo] || [];
  if (!all.length) return installed ? '' : '<p class="avail-note" data-k="an">You have every skill from this repo. New ones will show here.</p>';
  if (!shown.length) return '';
  const id = 'av:' + repo;
  const open = availOpen(repo, installed);
  if (open && !upd.descs[repo]) needDescs.add(repo);
  const installable = all.filter(a => !a.taken);
  const fresh = installable.filter(a => a.new);
  const busy = upd.job?.kind === 'install' && !upd.job.done && all.some(a => upd.job.items[a.name]);
  let acts = '';
  if (WRITABLE && busy) acts = '<button class="btn accent" data-k="ia" disabled>Installing…</button>';
  else if (WRITABLE && fresh.length) {
    acts = `<button class="btn accent" data-k="ia" data-install="${esc(repo)}" data-which="new">Install <span class="tnum">${fresh.length}</span> new</button>
      <button class="btn ghost" data-k="dm" data-dismiss="${esc(repo)}">Dismiss</button>`;
  } else if (WRITABLE && installable.length > 1) {
    acts = `<button class="btn ghost" data-k="ia" data-install="${esc(repo)}" data-which="all">Install all <span class="tnum">${installable.length}</span></button>`;
  }
  const count = shown.length === all.length ? all.length : `${shown.length} of ${all.length}`;
  return `<div class="avail-block" data-k="${esc(id)}">
    <div class="avail-head" data-k="ah">${fold(id, `<span data-leaf>Available from ${esc(repo)}</span> <span class="n">${count}</span>`, `Available from ${repo}`, open)}
      <span class="gctl" data-k="ac">${acts}</span></div>
    ${open ? shown.map(a => availRow(repo, a)).join('') : ''}
  </div>`;
}

// Collections follow the skill sort: by name, by total uses, or by the latest use.
function byGroup([a, x], [b, y]) {
  const name = a.localeCompare(b, undefined, { sensitivity: 'base' });
  if (ui.sort === 'uses') return y.reduce((n, s) => n + uses(s), 0) - x.reduce((n, s) => n + uses(s), 0) || name;
  if (ui.sort === 'recent') return Math.max(0, ...y.map(lastUsed)) - Math.max(0, ...x.map(lastUsed)) || name;
  return name;
}

function sourceGroups(personal) {
  const groups = groupMap(personal, sourceOf);
  // Repos with skills to offer, or watched with nothing installed, still get a group.
  const have = new Set(groups.map(([s]) => s));
  for (const repo of Object.keys(upd.available)) {
    if (have.has(repo)) continue;
    const watchedEmpty = upd.watched.includes(repo) && ui.view === 'all' && !ui.q && !SKILLS.some(s => live(s) && sourceOf(s) === repo);
    if (readsStore() && (availShown(repo).length || watchedEmpty)) groups.push([repo, []]);
  }
  // The catch-all bucket stays last whatever the sort.
  groups.sort((g, h) => (g[0] === NO_SOURCE) - (h[0] === NO_SOURCE) || byGroup(g, h));
  return groups.map(([source, list]) => {
    const all = SKILLS.filter(s => live(s) && sourceOf(s) === source);
    const onCount = all.filter(s => state(s).on).length;
    const checked = onCount === all.length ? 'true' : onCount === 0 ? 'false' : 'mixed';
    const url = all.find(s => s.origin?.sourceUrl)?.origin.sourceUrl;
    const local = isLocalGroup(source);
    const id = 'src:' + source;
    const avail = upd.available[source] || [];
    const fresh = newIn(source).length;
    const repoUrl = url ? url.replace(/\.git$/, '') : !local ? `https://github.com/${source}` : '';
    const counts = all.length
      ? `<span class="tnum">${onCount}</span> of <span class="tnum">${all.length}</span> on${list.length < all.length && ui.view !== 'new' ? ` · ${list.length} shown` : ''}`
      : 'watching';
    const meta = `${local && source !== NO_SOURCE ? 'no source · ' : ''}${counts}${avail.length ? ` · <span class="tnum">${avail.length}</span> available` : ''}${repoUrl ? ` · <a href="${esc(repoUrl)}" target="_blank" rel="noreferrer">repo ↗</a>` : ''}`;
    const head = `${groupTitle(id, source, local ? null : source, highlight(source), ui.view === 'new' || isOpen(id), list)}
      ${fresh ? `<span class="tag update gnew tnum" data-k="nw" title="${plural(fresh, 'skill')} added since you last looked">+${fresh} new</span>` : ''}
      <span class="gsub" data-leaf>${meta}</span>${groupSpark(all)}
      <span class="gctl" data-k="c">${groupUpdateButton(all, `data-update-source="${esc(source)}"`)}${groupMenu(source, all)}
      ${all.length && switchable() ? switchHtml(checked, `All ${all.length} skills from ${source}: turn ${checked === 'true' ? 'off' : 'on'}`, `data-kind="source" data-key="${esc(source)}"`) : ''}</span>`;
    const form = local && ui.linkOpen === source ? linkForm('group:' + source, all.map(s => s.dir_name), { cancel: true }) : '';
    const block = local || !readsStore() ? '' : availBlock(source, availShown(source), all.length);
    return group(id, head, form + list.map(row).join('') + block, ui.view === 'new' || isOpen(id), hue(source));
  }).join('');
}

function emptyHtml() {
  if (ui.q) {
    const hidden = SKILLS.filter(s => !inView(s) && ui.q.toLowerCase().split(/\s+/).every(t => s._hay.includes(t))).length;
    return `<div class="empty" data-k="empty"><h2>No skills match “${esc(ui.q)}”</h2>
      <p>${ui.view === 'all' ? 'Try fewer or shorter words.' : `The ${ui.view} filter is on.`}${hidden ? ` ${plural(hidden, 'hidden skill')} match.` : ''}</p>
      <span class="acts"><button class="btn" data-clear>Clear search</button>${hidden && !ui.showProject ? '<button class="btn ghost" data-show-project>Show project skills</button>' : ''}</span></div>`;
  }
  if (ui.view === 'updates' || ui.view === 'new') {
    const at = checkedMs();
    const ago = Number.isNaN(at) ? null : Math.max(0, Math.round((Date.now() - at) / 60000));
    const when = ago === null ? 'No check has run yet.' : ago ? `Checked ${ago}m ago.` : 'Checked just now.';
    return `<div class="empty" data-k="empty"><h2>${ui.view === 'new' ? 'No new skills' : 'Everything is up to date'}</h2>
      <p>${when}${ui.view === 'new' ? ' Your sources have not added skills since you last looked.' : ''}</p>
      <span class="acts"><button class="btn" data-recheck>Check again</button></span></div>`;
  }
  if (ui.view === 'unused') return '<div class="empty" data-k="empty"><h2>Every skill is in use</h2><p>Each one ran in the last 90 days.</p></div>';
  if (ui.view === 'off') return '<div class="empty" data-k="empty"><h2>Nothing is off</h2><p>Every skill in this view loads.</p></div>';
  return '<div class="empty" data-k="empty"><h2>No skills here</h2><p>Turn on Project skills or Old plugin versions to see more.</p></div>';
}

// ---------------------------------------------------------------- render
function render() {
  const byName = (a, b) => a.name.localeCompare(b.name);
  const sorter = ui.sort === 'uses' ? (a, b) => uses(b) - uses(a) || byName(a, b)
    : ui.sort === 'recent' ? (a, b) => lastUsed(b) - lastUsed(a) || byName(a, b) : byName;
  const inRoot = s => s.scope === 'project' || loads(s);
  const shown = SKILLS.filter(visible).sort(sorter);
  const out = [];

  const personal = shown.filter(s => s.scope === 'personal');
  const bySource = ui.groupBy === 'source' || ui.view === 'new';
  const offered = bySource ? Object.keys(upd.available).filter(r => availShown(r).length || (ui.view === 'all' && !ui.q && upd.watched.includes(r))) : [];
  needDescs.clear();
  if (personal.length || offered.length || ui.watchOpen) {
    const total = SKILLS.filter(s => s.scope === 'personal' && inRoot(s)).length;
    const groups = bySource ? sourceGroups(personal) : personal.map(row).join('');
    const body = (ui.watchOpen ? watchForm() : '') + groups;
    const ids = bySource ? [...new Set([...personal.map(s => 'src:' + sourceOf(s)), ...offered.map(r => 'src:' + r)])] : [];
    const watchBtn = WRITABLE && ui.view !== 'new' && !ui.watchOpen ? '<button class="linkbtn" data-watch-open>Watch a source…</button>' : '';
    if (ui.view === 'new') {
      const n = offered.reduce((k, r) => k + availShown(r).length, 0);
      out.push(section('sec:new', 'New from your sources', n, body, ids));
    } else {
      out.push(section('sec:personal', 'Your skills', personal.length === total ? total : `${personal.length} of ${total}`, body, ids, watchBtn));
    }
  }

  const plugins = shown.filter(s => s.scope === 'plugin');
  if (plugins.length) {
    const refs = groupMap(plugins, s => s.plugin_ref).sort(byGroup);
    const groups = refs.map(([ref, list]) => {
      const lv = list.find(s => s.status !== 'stale') || list[0];
      const st = state(lv);
      const ctl = lv.status === 'stale' ? '' :
        switchHtml(st.on, `Plugin ${lv.plugin}: turn ${st.on ? 'off' : 'on'}`, `data-kind="plugin" data-key="${esc(ref)}"`);
      const note = st.mode === 'not set' ? ' · not in enabledPlugins' : '';
      const head = `${groupTitle('plg:' + ref, lv.plugin, repoOf(lv), highlight(lv.plugin), isOpen('plg:' + ref), list)}
        <span class="gsub" data-leaf>${esc(lv.marketplace)} · ${plural(list.length, 'skill')}${note}</span>${groupSpark(list)}<span class="gctl" data-k="c">${ctl}</span>`;
      return group('plg:' + ref, head, list.map(row).join(''));
    });
    out.push(section('sec:plugins', 'Plugins', refs.length, groups.join(''), refs.map(([r]) => 'plg:' + r)));
  }

  const project = shown.filter(s => s.scope === 'project');
  if (project.length) {
    const byProject = groupMap(project, s => s.project).sort(byGroup);
    const groups = byProject.map(([name, list]) => group('prj:' + name,
      `${groupTitle('prj:' + name, name, null, esc(name), isOpen('prj:' + name), list)}<span class="gsub" data-leaf>loads only inside this project · ${list.length}</span>`,
      list.map(row).join('')));
    out.push(section('sec:project', 'Project skills', project.length, groups.join(''), byProject.map(([n]) => 'prj:' + n)));
  }

  patch(el('list'), out.join('') || emptyHtml());
  renderChrome();
  for (const repo of needDescs) loadDescs(repo);
  loadRepos([...personal.map(repoOf), ...plugins.map(repoOf), ...offered]);
}

function renderChrome() {
  const lv = SKILLS.filter(s => s.status !== 'stale' && s.scope !== 'project' && loads(s));
  const on = lv.filter(s => state(s).on).length;
  const outdated = lv.filter(isOutdated);
  const fresh = newTotal();
  const counts = { all: lv.length, on, off: lv.length - on, updates: outdated.length, new: fresh, unused: lv.filter(isUnused).length };
  patch(el('allMark'), allMarkHtml());
  el('viewUnused').classList.toggle('wait', !USE.ready);
  el('viewUnused').hidden = !WRITABLE || USE.status === 'error';
  for (const n of document.querySelectorAll('[data-n]')) n.textContent = counts[n.dataset.n];
  el('viewUpdates').hidden = !WRITABLE;
  el('viewNew').hidden = !WRITABLE || (!fresh && ui.view !== 'new');
  const badge = [outdated.length ? `${outdated.length}↑` : '', fresh ? `${fresh} new` : ''].filter(Boolean).join(' · ');
  document.title = WRITABLE && badge ? `(${badge}) Skill Atlas` : 'Skill Atlas';

  patch(el('meta'), [
    DATA.bundled_skills_disabled && harness()?.switch === 'claude' ? '<span>built-ins off</span>' : '',
    ui.root === 'all' ? '<span>pick a harness to switch skills</span>'
      : harness()?.switch ? `<span>writes <code>${esc(tilde(DATA.settings[ui.root]?.path))}</code></span>`
      : `<span>${esc(harnessName())} has no per-skill switch</span>`,
  ].join(''));

  let cluster = '';
  if (WRITABLE) {
    const failed = Object.keys(upd.errors).length;
    const warn = failed ? `<span class="warn" data-k="w" title="${esc(Object.values(upd.errors).join('\n'))}">${plural(failed, 'source')} unchecked</span>` : '';
    const again = `<button class="btn ghost icon" data-k="re" data-recheck aria-label="Check for updates again" title="Check again">${ICON.refresh}</button>`;
    if (upd.job && !upd.job.fade) {
      const items = Object.values(upd.job.items);
      const finished = items.filter(i => !RUNNING.has(i.state)).length;
      const [ing, ed] = jobVerbs();
      cluster = upd.job.done
        ? `<span data-k="t">${ed} <b>${items.filter(i => i.state === 'done').length}</b> of <b>${items.length}</b></span>`
        : `<span data-k="t">${ing} <b>${finished}</b> of <b>${items.length}</b>…</span>`;
    } else if (upd.checking) {
      cluster = '<span data-k="t">Checking for updates…</span>';
    } else if (upd.checkedAt) {
      const chip = fresh && ui.view !== 'new' ? `<button class="chip" data-k="nw" data-view-new>${plural(fresh, 'new skill')}</button>` : '';
      cluster = chip + (outdated.length
        ? `<span data-k="t"><b>${outdated.length}</b> ${outdated.length === 1 ? 'update' : 'updates'}</span>${warn}${groupUpdateButton(lv, 'data-update-all', { label: 'Update all', cls: 'btn primary', count: false })}${again}`
        : `<span data-k="t">Up to date</span>${warn}${again}`);
    }
  }
  patch(el('cluster'), cluster);
  renderBulk();
  renderBar();
}

function renderBar() {
  const items = Object.values(upd.job?.items || {});
  el('bar').classList.toggle('on', Boolean(items.length && !upd.job.fade));
  if (items.length) el('bar').firstChild.style.transform = `scaleX(${items.filter(i => !RUNNING.has(i.state)).length / items.length})`;
}

function resetBar() {
  const fill = el('bar').firstChild;
  fill.style.transition = 'none'; fill.style.transform = 'scaleX(0)';
  void fill.offsetWidth; fill.style.transition = '';
}

function field(label, value, mono) {
  if (value === undefined || value === null || value === '' || (Array.isArray(value) && !value.length)) return '';
  const text = esc(Array.isArray(value) ? value.join(', ') : value);
  return `<dt>${esc(label)}</dt><dd${mono ? ' class="mono"' : ''}>${mono ? text.replace(/\//g, '/<wbr>') : text}</dd>`;
}

const groupKeyOf = s => (s.kind === 'avail' ? 'src:' + s.repo : s.scope === 'plugin' ? 'plg:' + s.plugin_ref : s.scope === 'project' ? 'prj:' + s.project : 'src:' + sourceOf(s));

const closeBtn = '<button class="btn ghost icon d-close" data-k="x" data-close aria-label="Close details">' + ICON.close + '</button>';

const metaHtml = parts => `<p class="d-meta" data-k="meta" data-leaf>${parts.filter(Boolean).join('<span aria-hidden="true">·</span>')}</p>`;

function availDetailHtml(s) {
  const a = (upd.available[s.repo] || []).find(x => x.path === s.path) || s.a;
  const info = upd.descs[s.repo]?.skills?.[s.path];

  } else action = '';
  const why = a.taken === 'moved' ? 'You have this skill under its old folder. Update or relink it instead.'

  const gh = `https://github.com/${s.repo}/tree/HEAD/${s.path.replace(/\/?SKILL\.md$/, '')}`;
  return `${ownBannerHtml(s)}${crumbHtml(s)}
    <div class="d-top" data-k="top"><h2 class="d-title" data-leaf><span class="slash">/</span>${esc(a.name)}</h2>${closeBtn}</div>
    ${metaHtml([a.new ? '<span class="tag update">new</span>' : '', 'Not installed'])}
    <p class="d-desc" data-k="desc" data-leaf>${info ? esc(info.description || 'No description') : upd.descs[s.repo]?.error ? 'Description unavailable.' : '<span class="skel"></span>'}</p>
    <div class="d-acts" data-k="acts"><button class="btn" data-k="vw" data-view>Read SKILL.md <kbd>v</kbd></button>

function detailHtml(s) {
  if (s.kind === 'avail') return availDetailHtml(s);
  if (s.kind === 'group') return groupDetailHtml(s);
  const st = state(s);
  const o = s.origin || {};
  const ms = s.marketplace_source || {};
  const cards = [];
  let ctl = '';
  if (s.scope === 'personal') {
    if (st.toggle) ctl = switchHtml(st.on, `${s.name}: turn ${st.on ? 'off' : 'on'}`, `data-kind="skill" data-key="${esc(st.key)}"`);
    const name = lockName(s);
    if (!s.store) {
      cards.push(`<div class="card" data-k="c-copy"><div><strong>A copy for one harness</strong>It lives in ${esc(tilde(s.source_root))}, outside ${esc(tilde(DATA.store))}/skills, so update, link, and delete do not apply.</div></div>`);
    } else if (!name && WRITABLE) {
      cards.push(`<div class="card" data-k="c-link"><div><strong>Not linked to a repo</strong>Link it to get update checks.
        ${linkForm('skill:' + s.dir_name, [s.dir_name])}</div></div>`);
    } else if (name && (isOutdated(s) || jobState(name))) {
      cards.push(`<div class="card accent" data-k="c-upd"><div data-leaf><strong>Update available</strong>A newer version is on ${esc(o.source)}.
        ${s.local_edits ? '<p class="note warn">You changed this skill after install. Updating replaces your changes.</p>' : ''}</div>
        <span class="uslot" data-k="u">${updateSlot(s, true)}</span></div>`);
    } else if (s.local_edits) {
      cards.push('<p class="note warn" data-k="c-ed">You changed this skill after install. An update would replace your changes.</p>');
    }
  } else if (s.scope === 'plugin' && s.status !== 'stale') {
    ctl = switchHtml(st.on, `Plugin ${s.plugin}: turn ${st.on ? 'off' : 'on'}`, `data-kind="plugin" data-key="${esc(st.key)}"`);
  } else if (s.status === 'stale') {
    cards.push('<div class="card" data-k="c-st"><div><strong>Old version</strong>Claude Code no longer loads this copy.</div></div>');
  } else {
    cards.push(`<div class="card" data-k="c-pr"><div><strong>Project skill</strong>Loads only when you work inside ${esc(s.project)}.</div></div>`);
  }
  const src = ms.url || ms.repo || o.sourceUrl || o.source;
  const long = (s.description || '').length > 420;
  const pluginCount = s.scope === 'plugin' ? SKILLS.filter(x => x.plugin_ref === s.plugin_ref && x.status !== 'stale').length : 0;
  const meta = [
    s.local_edits ? '<span class="tag edited">edited</span>' : '',
    isOutdated(s) ? '<span class="tag update">update</span>' : '',
    s.scope === 'plugin' && s.status !== 'stale' ? `The switch turns all ${plural(pluginCount, 'skill')} in ${esc(s.plugin)} on or off` : '',
    s._dupes.length ? `Same as ${esc(s._dupes.join(', '))}` : '',
  ];
  const gh = src && /^https?:/.test(src) ? String(src).replace(/\.git$/, '') : '';
  const sw = harness()?.switch;
  const setting = sw === 'claude' ? (s.scope === 'personal' ? `skillOverrides.${s.name}${st.mode === 'on' ? '' : ` = "${st.mode}"`}` : s.scope === 'plugin' ? `enabledPlugins["${s.plugin_ref}"]` : '')
    : sw && s.scope === 'personal' ? tilde(harness().config) : '';
  return `${ownBannerHtml(s)}${crumbHtml(s)}
    <div class="d-top" data-k="top"><h2 class="d-title" data-leaf><span class="slash">/</span>${esc(s.invoke)}</h2>${ctl}${closeBtn}</div>
    ${metaHtml(meta)}
    ${invokeHtml(s)}
    <p class="d-desc${long && !ui.descOpen ? ' clamp' : ''}" data-k="desc" data-leaf>${esc(s.description || 'No description')}</p>
    ${long ? `<button class="linkbtn d-more" data-k="more" data-more aria-expanded="${ui.descOpen}">${ui.descOpen ? 'Show less' : 'Show more'}</button>` : ''}
    <div class="d-acts" data-k="acts">
      <button class="btn" data-k="vw" data-view>Read SKILL.md <kbd>v</kbd></button>
      <button class="btn ghost icon" data-k="cp" data-copy="/${esc(s.invoke)}" aria-label="Copy /${esc(s.invoke)}" title="Copy /${esc(s.invoke)}">${ICON.copy}</button>
      ${gh ? ghLink(gh) : ''}
      ${WRITABLE ? `<button class="btn ghost" data-k="rv" data-reveal="${esc(s.path)}">Reveal</button>` : ''}
    </div>
    ${cards.length ? `<div class="d-sec" data-k="cards">${cards.join('')}</div>` : ''}
    ${s.scope === 'personal' ? loadedHtml(s) : ''}
    ${usageHtml(s)}
    <div class="d-sec" data-k="facts"><dl data-leaf>
      ${field('Version', s.plugin_version || s.version, true)}
      ${field('Updated', (s.last_updated || o.updatedAt || s.modified || '').slice(0, 10))}
      ${field('Tools', s.allowed_tools, true)}
      ${field('Arguments', s.argument_hint, true)}
      ${field('Size', `${s.words.toLocaleString()} words · ${plural(s.file_count, 'file')}`)}
      ${field('Setting', setting, true)}
      ${field('Path', tilde(s.path), true)}
    </dl></div>
    ${WRITABLE && s.scope === 'personal' && s.store ? `<div class="d-sec danger-zone" data-k="dz">
      <button class="btn danger" data-k="del" data-delete="${esc(s.dir_name)}">Delete…</button>
      <p class="note" data-k="dn">Moves the folder to the Trash and removes its lock entry. You can undo it.</p></div>` : ''}`;
}

// ---------------------------------------------------------------- collection detail
function groupFor(id) {
  const [type, key] = [id.slice(0, 3), id.slice(4)];
  if (type === 'plg') {
    const lv = SKILLS.find(x => x.plugin_ref === key && x.status !== 'stale') || SKILLS.find(x => x.plugin_ref === key);
    return { kind: 'group', type, id, key: 'g:' + id, ref: key, label: lv?.plugin || key, repo: lv ? repoOf(lv) : null, hueKey: id };
  }
  if (type === 'prj') return { kind: 'group', type, id, key: 'g:' + id, project: key, label: key, repo: null, hueKey: id };
  return { kind: 'group', type: 'src', id, key: 'g:' + id, source: key, label: key, repo: isLocalGroup(key) ? null : key, hueKey: key };
}
function membersOf(g) {
  if (g.type === 'plg') return SKILLS.filter(x => x.plugin_ref === g.ref && x.status !== 'stale' && x.harnesses.includes(ui.root));
  if (g.type === 'prj') return SKILLS.filter(x => x.scope === 'project' && x.project === g.project);
  return SKILLS.filter(s => live(s) && sourceOf(s) === g.source);
}
function sumDays(list) {
  const days = {};
  for (const s of list) for (const [d, k] of Object.entries(USE.by.get(s)?.days || {})) days[d] = (days[d] || 0) + k;
  return days;
}
// Every harness that loads the skill, each with its own switch where it has one.
function loadedHtml(s) {
  const rows = s.harnesses.filter(id => harness(id)).map(id => {
    const h = harness(id), st = state(s, id);
    const ctl = h.switch && WRITABLE
      ? switchHtml(st.on, `${s.name} in ${h.label}: turn ${st.on ? 'off' : 'on'}`, `data-kind="skill" data-key="${esc(s.name)}" data-h="${esc(id)}"`)
      : '<span class="note">no switch</span>';
    return `<div class="lb${id === ui.root ? ' cur' : ''}" data-k="lb:${esc(id)}"><span data-leaf>${esc(h.label)}</span>${ctl}</div>`;
  });
  return `<div class="d-sec loaded" data-k="lb"><h3 data-leaf>Loaded by</h3>${rows.join('') || '<p class="note">No harness loads this folder.</p>'}</div>`;
}
const useSec = body => `<div class="d-sec uses" data-k="use"><h3 data-leaf>Usage</h3>${body}</div>`;
const useStats = (count, last, activeDays, play) => `<div class="use-stats${play ? ' play' : ''}" data-k="us" data-leaf>
    <div><b data-count="${count}">${count.toLocaleString()}</b><span>uses</span></div>
    <div><b>${ago(last)}</b><span>last used</span></div>
    <div><b>${activeDays}</b><span>active days</span></div>
  </div>`;
const topHtml = list => `<div class="top" data-k="top" data-leaf>${list.filter(uses).sort((a, b) => uses(b) - uses(a)).slice(0, 5)
  .map(s => `<button data-pick="${s.id}"><span class="nmt"><span class="slash">/</span>${esc(s.invoke)}</span><span class="tnum">${uses(s).toLocaleString()}</span></button>`).join('')}</div>`;

function groupUsageHtml(list, key) {
  if (!WRITABLE) return '';
  if (!USE.ready) return useSec(waitHtml());
  const total = list.reduce((n, s) => n + uses(s), 0);
  if (!total) return useSec('<p class="use-note" data-k="un" data-leaf>No recorded uses for these skills yet.</p>');
  const days = sumDays(list);
  return useSec(`${useStats(total, Math.max(...list.map(lastUsed)), Object.keys(days).length, playing(key))}
    ${heatmap(days, key)}
    ${topHtml(list)}`);
}

function groupDetailHtml(g) {
  const list = membersOf(g);
  const m = g.repo ? REPOS[g.repo] : null;
  const on = list.filter(s => state(s).on).length;
  let ctl = '', meta = [], desc = '', acts = [], facts = '', danger = '';
  if (g.type === 'src') {
    const local = isLocalGroup(g.source);
    const checked = on === list.length ? 'true' : on === 0 ? 'false' : 'mixed';
    const avail = (upd.available[g.source] || []).filter(a => !a.taken);
    const fresh = avail.filter(a => a.new);
    const watching = upd.watched.includes(g.source);
    if (list.length && switchable()) ctl = switchHtml(checked, `All ${list.length} skills from ${g.source}: turn ${checked === 'true' ? 'off' : 'on'}`, `data-kind="source" data-key="${esc(g.source)}"`);
    meta = [`${on} of ${list.length} on`, avail.length ? `${avail.length} available` : '', m?.stars ? `★ ${short(m.stars)}` : '', watching ? 'Watching' : ''];
    desc = m?.description || (g.source === NO_SOURCE ? 'Skills with no upstream repo. Link one to get update checks.'
      : local ? `Skills that share the ${esc(g.source.replace(/\*$/, ''))} name prefix. They have no linked repo yet.` : '');
    acts = [
      groupUpdateButton(list, `data-update-source="${esc(g.source)}"`, { cls: 'btn primary' }),
      WRITABLE && fresh.length ? `<button class="btn accent" data-k="ia" data-install="${esc(g.source)}" data-which="new">Install <span class="tnum">${fresh.length}</span> new</button>` : '',
      g.repo ? ghLink(`https://github.com/${g.repo}`) : '',
      WRITABLE && local ? `<button class="btn ghost" data-k="ln" data-show-link="${esc(g.source)}">Link to GitHub…</button>` : '',
      WRITABLE && watching ? `<button class="btn ghost" data-k="uw" data-unwatch="${esc(g.source)}">Stop watching</button>` : '',
    ];
    facts = `${field('Kind', local ? (g.source === NO_SOURCE ? 'Local skills' : 'Name prefix') : 'GitHub repo')}${field('Repo', g.repo, true)}
      ${field('Checked', g.repo && upd.checkedAt ? ago(checkedMs()) : '')}
      ${field('Folder', list[0] ? tilde(list[0].dir.replace(/\/[^/]+$/, '')) : '', true)}`;
    const stored = list.filter(s => s.store);
    if (WRITABLE && stored.length) danger = `<div class="d-sec danger-zone" data-k="dz">

  } else if (g.type === 'plg') {

    const version = lv?.plugin_version && lv.plugin_version !== 'unknown' ? 'v' + lv.plugin_version : '';
    meta = ['Plugin', lv?.marketplace, version, plural(list.length, 'skill')];
    desc = m?.description ? `From ${esc(lv?.marketplace)}: ${esc(m.description)}` : 'A plugin turns on or off as one unit.';
    acts = [g.repo ? ghLink(`https://github.com/${g.repo}`) : ''];
    facts = `${field('Marketplace', lv?.marketplace, true)}${field('Version', version.slice(1), true)}${field('Installed', (lv?.installed_at || '').slice(0, 10))}
      ${field('Updated', (lv?.last_updated || '').slice(0, 10))}${field('Setting', `enabledPlugins["${g.ref}"]`, true)}`;
  } else {
    meta = ['Project', plural(list.length, 'skill')];
    desc = `These skills load only when you work inside ${esc(g.project)}.`;

  }
  return `${g.type === 'prj' ? '' : `<div class="banner${g.repo ? '' : ' short'}" data-k="ban" data-leaf aria-hidden="true">${g.repo
      ? `<img class="ban-ava" src="${esc(avatarUrl(g.repo).replace(/s(ize)?=64/, 's$1=160'))}" alt="" loading="lazy" decoding="async" onerror="this.remove()"><img src="${esc(repoBanner(g.repo))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`
      : g.source === NO_SOURCE ? '' : esc(monogram(g.label))}</div>`}
    <div class="d-top" data-k="top"><h2 class="d-title" data-leaf>${esc(g.label)}</h2>${ctl}${closeBtn}</div>
    ${metaHtml(meta.map(x => (x ? esc(x) : '')))}
    ${desc ? `<p class="d-desc" data-k="desc" data-leaf>${desc}</p>` : ''}
    ${acts.some(Boolean) ? `<div class="d-acts" data-k="acts">${acts.join('')}</div>` : ''}
    <div class="d-sec" data-k="gst"><div class="stats" data-leaf>
      ${stat(on, 'on', 'on')}${stat(list.length - on, 'off')}${stat(list.filter(isOutdated).length, 'updates', 'accent')}
      ${stat(list.filter(s => s.local_edits).length, 'edited', 'warn')}${stat(list.filter(s => s.manual_only).length, 'you only')}${stat(USE.ready ? list.filter(isUnused).length : '–', 'unused')}
    </div></div>
    ${groupUsageHtml(list, g.key)}
    ${facts.trim() ? `<div class="d-sec" data-k="facts"><dl data-leaf>${facts}</dl></div>` : ''}
    ${danger}`;
}

// ---------------------------------------------------------------- skill viewer
// A small GFM subset for SKILL.md files. Raw HTML is always escaped.
function renderMarkdown(src, { link = null, img = null } = {}) {
  let text = String(src || '').replace(/\r\n?/g, '\n').replace(/\t/g, '    ');
  const front = [];
  const fm = text.match(/^---\n([\s\S]*?)\n---[ \t]*(?:\n|$)/);
  if (fm) {
    text = text.slice(fm[0].length);
    let block = false;
    for (const ln of fm[1].split('\n')) {
      const m = ln.match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
      if (m) {
        block = /^[|][-+]?$/.test(m[2]);
        front.push([m[1], /^[|>][-+]?$/.test(m[2]) ? '' : m[2].replace(/^(["'])(.*)\1$/, '$2')]);
      } else if (front.length && ln.trim()) {
        const f = front[front.length - 1];
        f[1] = f[1] ? f[1] + (block ? '\n' : ' ') + ln.trim() : ln.trim();
      }
    }
  }

  const toc = [], ids = {};
  const plain = h => h.replace(/<[^>]+>/g, '').replace(/&(amp|lt|gt|quot);/g, (_, e) => ({ amp: '&', lt: '<', gt: '>', quot: '"' }[e]));
  const slug = t => {
    const base = 'md-' + (t.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-') || 'section');
    ids[base] = (ids[base] || 0) + 1;
    return ids[base] > 1 ? `${base}-${ids[base] - 1}` : base;
  };
  // [kind, url]: abs keeps the url, rel goes through a resolver, bad drops it.
  const classify = u => /^(https?:|mailto:)/i.test(u) || u.startsWith('#') ? ['abs', u]
    : /^[a-z][\w+.-]*:/i.test(u) || u.startsWith('//') ? ['bad', null] : ['rel', u];

  function inline(s) {
    const keep = [];
    const stash = h => `\u0000${keep.push(h) - 1}\u0000`;
    s = s.replace(/\\([\\`*_{}[\]()#+\-.!|~<>])/g, (_, c) => stash(esc(c)));
    s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (_, __, c) => stash(`<code>${esc(/^ .* $/.test(c) ? c.slice(1, -1) : c)}</code>`));
    s = s.replace(/<(https?:\/\/[^\s>]+)>/g, (_, u) => stash(`<a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(u)}</a>`));
    s = s.replace(/!\[([^\]]*)\]\(\s*<?((?:[^()\s>]|\([^()\s]*\))*)>?(?:\s+"[^"]*")?\s*\)/g, (_, alt, u) => {
      const [kind, v] = classify(u);
      const out = kind === 'abs' ? v : kind === 'rel' && img ? img(v) : null;
      return stash(out && kind !== 'bad' ? `<img src="${esc(out)}" alt="${esc(alt)}" loading="lazy">` : `<em>${esc(alt)}</em>`);
    });
    s = s.replace(/\[([^\]]+)\]\(\s*<?((?:[^()\s>]|\([^()\s]*\))*)>?(?:\s+"[^"]*")?\s*\)/g, (_, t, u) => {
      const [kind, v] = classify(u);
      if (kind === 'bad') return t;
      const out = kind === 'abs' ? v : link ? link(v) : null;
      if (!out) return stash(`<span class="md-rel" title="${esc(u)}">`) + t + stash('</span>');
      const ext = /^(https?:|mailto:)/i.test(out) ? ' target="_blank" rel="noreferrer"' : '';
      return stash(`<a href="${esc(out)}"${ext}>`) + t + stash('</a>');
    });
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]*[^\s<).,;:!?'"*_])/g, (_, pre, u) => pre + stash(`<a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(u)}</a>`));
    s = esc(s)
      .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<strong>$2</strong>')
      .replace(/(^|[^\w*])\*(?=[^\s*])([^*]*?[^\s*])\*(?![\w*])/g, '$1<em>$2</em>')
      .replace(/(^|[^\w])_(?=[^\s_])([^_]*?[^\s_])_(?!\w)/g, '$1<em>$2</em>')
      .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>')
      .replace(/ {2,}\n/g, '<br>\n');
    while (/\u0000\d+\u0000/.test(s)) s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[i]);
    return s;
  }

  const FENCE = /^ {0,3}(`{3,}|~{3,})\s*([^`\s]*)/;
  const HEAD = /^ {0,3}(#{1,6})(?:\s+(.*?))?(?:\s+#+)?\s*$/;
  const HR = /^ {0,3}([-*_])(?: *\1){2,} *$/;
  const QUOTE = /^ {0,3}> ?/;
  const ITEM = /^( *)([-*+]|\d{1,9}[.)])( +|$)(.*)$/;
  const SEP = /^ {0,3}\|?\s*:?-+:?\s*(\|\s*:?-*:?\s*)*\|?\s*$/;
  const isTable = (ls, i) => ls[i].includes('|') && i + 1 < ls.length && ls[i + 1].includes('-') && SEP.test(ls[i + 1]);
  const starts = (ls, i) => FENCE.test(ls[i]) || HEAD.test(ls[i]) || HR.test(ls[i]) || QUOTE.test(ls[i]) || isTable(ls, i)
    || (ITEM.test(ls[i]) && /^ *([-*+]|1[.)]) +\S/.test(ls[i]));
  const indentOf = l => l.match(/^ */)[0].length;

  function cells(row) {
    const out = [];
    let cur = '', tick = 0;
    row = row.trim().replace(/^\|/, '').replace(/(^|[^\\])\|$/, '$1');
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (c === '\\' && row[i + 1] === '|') { cur += '\\|'; i++; continue; }
      if (c === '`') { let n = 1; while (row[i + n] === '`') n++; tick = tick === n ? 0 : tick || n; cur += '`'.repeat(n); i += n - 1; continue; }
      if (c === '|' && !tick) { out.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    out.push(cur.trim());
    return out.map(x => x.replace(/\\\|/g, '|'));
  }

  function list(ls, i) {
    const first = ls[i].match(ITEM);
    const base = first[1].length, ordered = /\d/.test(first[2]);
    const items = [];
    let loose = false;
    const sibling = l => { const m = l?.match(ITEM); return Boolean(m) && m[1].length === base && /\d/.test(m[2]) === ordered && !HR.test(l); };
    while (i < ls.length && sibling(ls[i])) {
      const m = ls[i].match(ITEM);
      const pad = m[3].length > 4 || !m[4] ? 1 : m[3].length;
      const inner = m[1].length + m[2].length + pad;
      const body = [m[4]];
      i++;
      while (i < ls.length) {
        const l = ls[i];
        if (!l.trim()) { body.push(''); i++; continue; }
        const ind = indentOf(l);
        if (ind > base) { body.push(l.slice(Math.min(ind, inner))); i++; continue; }
        if (body[body.length - 1] !== '' && ind === indentOf(l) && !starts(ls, i) && !ITEM.test(l)) { body.push(l.trim()); i++; continue; }
        break;
      }
      let end = body.length;
      while (end && body[end - 1] === '') end--;
      if (end < body.length && sibling(ls[i])) loose = true;
      const kept = body.slice(0, end);
      if (gapOutsideFence(kept)) loose = true;
      items.push({ n: first[2], body: kept });
      if (end < body.length && !sibling(ls[i])) break;
    }
    const start = ordered && parseInt(first[2], 10) !== 1 ? ` start="${parseInt(first[2], 10)}"` : '';
    const lis = items.map(({ body }) => {
      const task = body[0].match(/^\[([ xX])\]\s+(.*)$/);
      if (task) body = [task[2], ...body.slice(1)];
      const box = task ? `<input type="checkbox" disabled${task[1] === ' ' ? '' : ' checked'}> ` : '';
      return `<li${task ? ' class="task"' : ''}>${box}${blocks(body, !loose)}</li>`;
    }).join('');
    return [`<${ordered ? 'ol' : 'ul'}${start}>${lis}</${ordered ? 'ol' : 'ul'}>`, i];
  }
  // Blank lines inside a code fence do not make a list loose.
  function gapOutsideFence(body) {
    let open = false;
    for (const l of body) {
      if (FENCE.test(l)) open = !open;
      else if (l === '' && !open) return true;
    }
    return false;
  }

  function blocks(ls, tight = false) {
    let out = '', i = 0, m;
    while (i < ls.length) {
      const ln = ls[i];
      if (!ln.trim()) { i++; continue; }
      if ((m = ln.match(FENCE))) {
        const close = new RegExp(`^ {0,3}${m[1][0] === '`' ? '`' : '~'}{${m[1].length},}\\s*$`);
        const ind = indentOf(ln), body = [];
        for (i++; i < ls.length && !close.test(ls[i]); i++) body.push(ls[i].slice(Math.min(ind, indentOf(ls[i]))));
        i++;
        out += `<pre><code${m[2] ? ` data-lang="${esc(m[2])}"` : ''}>${esc(body.join('\n'))}</code></pre>`;
      } else if ((m = ln.match(HEAD))) {
        const n = m[1].length, h = inline(m[2] || ''), t = plain(h), id = slug(t);
        if (n === 2 || n === 3) toc.push({ level: n, text: t, id });
        out += `<h${n} id="${id}">${h}</h${n}>`;
        i++;
      } else if (HR.test(ln)) {
        out += '<hr>'; i++;
      } else if (QUOTE.test(ln)) {
        const body = [];
        while (i < ls.length && QUOTE.test(ls[i])) body.push(ls[i++].replace(QUOTE, ''));
        out += `<blockquote>${blocks(body)}</blockquote>`;
      } else if (isTable(ls, i)) {
        const head = cells(ls[i]);
        const align = cells(ls[i + 1]).map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : c.startsWith(':') ? 'left' : '');
        const td = (tag, c, k) => `<${tag}${align[k] ? ` style="text-align:${align[k]}"` : ''}>${inline(c || '')}</${tag}>`;
        let rows = '';
        for (i += 2; i < ls.length && ls[i].trim() && ls[i].includes('|'); i++) {
          const r = cells(ls[i]);
          rows += `<tr>${head.map((_, k) => td('td', r[k], k)).join('')}</tr>`;
        }
        out += `<div class="md-table"><table><thead><tr>${head.map((c, k) => td('th', c, k)).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
      } else if (ITEM.test(ln)) {
        const [html, next] = list(ls, i);
        out += html; i = next;
      } else {
        const para = [ln.replace(/^ +/, '')];
        for (i++; i < ls.length && ls[i].trim() && !starts(ls, i); i++) para.push(ls[i].replace(/^ +/, ''));
        const h = inline(para.join('\n').replace(/\s+$/, ''));
        out += tight ? h : `<p>${h}</p>`;
      }
    }
    return out;
  }

  return { html: blocks(text.split('\n')), toc, front };
}

const viewer = { s: null, text: '', note: '', loading: false, raw: localStorage.getItem('atlas.raw') === '1', back: null };

// Where relative links and images in a skill point: its folder on GitHub, when it has one.
function skillBase(s) {
  const repo = repoOf(s);
  if (!repo || s.scope === 'plugin') return null;
  const file = s.kind === 'avail' ? s.path : s.origin?.skillPath;
  return file ? { repo, dir: file.replace(/\/?SKILL\.md$/, '') } : null;
}
function joinPath(dir, rel) {
  const out = dir ? dir.split('/') : [];
  for (const part of rel.replace(/[?#].*$/, '').split('/')) {
    if (part === '..') out.pop(); else if (part && part !== '.') out.push(part);
  }
  return out.join('/');
}

async function openViewer(s) {
  if (!s) return;
  const dlg = el('viewer');
  viewer.back = document.activeElement;
  Object.assign(viewer, { s, text: '', note: '', loading: true });
  renderViewer();
  if (!dlg.open) dlg.showModal();
  dlg.querySelector('.v-scroll').focus({ preventScroll: true });
  try {
    if (s.kind === 'avail') {
      const res = await fetch(RAW(s.repo, s.path));
      if (!res.ok) throw new Error(`GitHub answered ${res.status}`);
      viewer.text = await res.text();
    } else if (WRITABLE) {
      viewer.text = (await api('/api/skill?path=' + encodeURIComponent(s.path))).text;
    } else {
      viewer.text = s.body_preview;
      viewer.note = 'This read-only build has only the first lines. Run ./atlas to read the whole file.';
    }
  } catch (err) {
    viewer.note = `Could not load the file: ${err.message}`;
  }
  if (viewer.s !== s) return;
  viewer.loading = false;
  renderViewer();
}

function renderViewer() {
  const { s } = viewer;
  const dlg = el('viewer');
  dlg.style.setProperty('--h', hue(groupId(s)));
  const base = skillBase(s);
  const out = viewer.loading ? null : renderMarkdown(viewer.text, base ? {
    link: href => `https://github.com/${base.repo}/blob/HEAD/${joinPath(base.dir, href)}${href.includes('#') ? href.slice(href.indexOf('#')) : ''}`,
    img: src => RAW(base.repo, joinPath(base.dir, src)),
  } : {});
  const name = s.kind === 'avail' ? s.a.name : s.invoke;
  const where = s.kind === 'avail' ? `${s.repo} · ${s.path}` : tilde(s.path);
  const repo = repoOf(s);
  const gh = base ? `https://github.com/${base.repo}/blob/HEAD/${base.dir ? base.dir + '/' : ''}SKILL.md` : '';
  const toc = !viewer.raw && out?.toc.length > 2;
  const front = out?.front.length
    ? `<dl class="md-front">${out.front.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '';
  const body = viewer.loading ? '<p class="v-load">Loading…</p>'
    : viewer.raw ? `<pre class="raw">${viewer.text.split('\n').map(l => `<span>${esc(l)}</span>`).join('')}</pre>`
    : `<article class="md">${front}${out.html}</article>`;
  dlg.innerHTML = `
    <div class="v-head">
      ${avatar(groupLabel(s), repo, true)}
      <div class="v-title"><h2 id="vTitle"><span class="slash">/</span>${esc(name)}</h2><p>${esc(where)}</p></div>
      <div class="v-acts">
        <div class="mode" role="group" aria-label="Show as"${viewer.raw ? ' data-raw' : ''}>
          <button data-mode="md" aria-pressed="${!viewer.raw}">Formatted</button><button data-mode="raw" aria-pressed="${viewer.raw}">Markdown</button>
        </div>
        <button class="btn ghost icon" data-copy-raw aria-label="Copy the Markdown" title="Copy the Markdown"${viewer.loading ? ' disabled' : ''}>${ICON.copy}</button>
        ${gh ? `<a class="btn ghost" href="${esc(gh)}" target="_blank" rel="noreferrer">GitHub ↗</a>` : ''}
        ${WRITABLE && s.kind !== 'avail' ? `<button class="btn ghost" data-reveal="${esc(s.path)}">Reveal</button>` : ''}
        <button class="btn ghost icon" data-viewer-close aria-label="Close" title="Close (esc)">${ICON.close}</button>
      </div>
    </div>
    <div class="v-body${toc ? '' : ' no-toc'}">
      ${toc ? `<nav class="v-toc" aria-label="Sections"><h3>On this page</h3>${out.toc.map(t => `<a href="#${esc(t.id)}" class="l${t.level}">${esc(t.text)}</a>`).join('')}</nav>` : ''}
      <div class="v-scroll" tabindex="-1">${viewer.note ? `<p class="v-note" role="status">${esc(viewer.note)}</p>` : ''}${body}</div>
    </div>`;
  dlg.setAttribute('aria-labelledby', 'vTitle');
}

async function copyFrom(btn, text) {
  try { await navigator.clipboard.writeText(text); }
  catch (err) { return toast(`Could not copy: ${esc(err.message)}`); }
  btn.innerHTML = ICON.check; btn.style.color = 'var(--on)';
  setTimeout(() => { btn.innerHTML = ICON.copy; btn.style.color = ''; }, 1500);
}

function setRaw(on) {
  viewer.raw = on;
  localStorage.setItem('atlas.raw', on ? '1' : '0');
  renderViewer();
  el('viewer').querySelector('.v-scroll').focus({ preventScroll: true });
}

el('viewer').addEventListener('close', () => { viewer.s = null; viewer.back?.focus?.({ preventScroll: true }); });
el('viewer').addEventListener('click', async e => {
  const t = e.target;
  if (t === el('viewer')) return el('viewer').close();
  if (t.closest('[data-viewer-close]')) return el('viewer').close();
  const m = t.closest('[data-mode]');
  if (m) return setRaw(m.dataset.mode === 'raw');
  const a = t.closest('.v-toc a');
  if (a) {
    e.preventDefault();
    el('viewer').querySelector('#' + CSS.escape(a.getAttribute('href').slice(1)))?.scrollIntoView({ block: 'start', behavior: REDUCED.matches ? 'auto' : 'smooth' });
    return;
  }
  const cp = t.closest('[data-copy-raw]');
  if (cp) copyFrom(cp, viewer.text);
});

// ---------------------------------------------------------------- theme
const THEMES = [['system', ICON.auto, 'Match the system'], ['light', ICON.sun, 'Light'], ['dark', ICON.moon, 'Dark']];
const SYSTEM_LIGHT = matchMedia('(prefers-color-scheme: light)');
let themePick = localStorage.getItem('atlas.theme') || 'system';
function applyTheme() {
  const root = document.documentElement;
  // Every element has its own transition; switching all of them at once would ripple.
  root.classList.add('theming');
  root.dataset.theme = themePick === 'system' ? (SYSTEM_LIGHT.matches ? 'light' : 'dark') : themePick;
  setSeg('theme', 't', themePick);
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theming')));
}
el('theme').innerHTML = THEMES.map(([t, icon, label]) => `<button data-t="${t}" aria-pressed="false" aria-label="${label}" title="${label}">${icon}</button>`).join('');
el('theme').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  themePick = b.dataset.t; localStorage.setItem('atlas.theme', themePick); applyTheme();
});
SYSTEM_LIGHT.addEventListener('change', () => { if (themePick === 'system') applyTheme(); });

const PALETTES = [['atlas', 'Atlas'], ['stone', 'Stone'], ['sage', 'Sage'], ['heather', 'Heather'], ['graphite', 'Graphite']];
const TEXTURES = [['none', 'None'], ['contours', 'Contours'], ['chart', 'Chart'], ['paper', 'Paper'], ['linen', 'Linen']];
el('palette').innerHTML = PALETTES.map(([p, label]) => `<button data-palette="${p}" aria-label="${label}" title="${label}"></button>`).join('');
el('texture').innerHTML = TEXTURES.map(([t, label]) =>
  `<button data-tex="${t}" aria-label="${label} background"><i style="--t:${t === 'none' ? 'none' : `url(bg/${t}.webp)`}"></i>${label}</button>`).join('');
function setLook(key, value) {
  const root = document.documentElement;
  root.classList.add('theming');
  root.dataset[key] = value;
  try { localStorage.setItem(`atlas.${key}`, value); } catch {}
  for (const b of el('palette').children) b.setAttribute('aria-pressed', b.dataset.palette === root.dataset.palette);

el('palette').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setLook('palette', b.dataset.palette); });

// ---------------------------------------------------------------- usage
const USE = { raw: null, ready: false, status: null, progress: [0, 0], by: new Map(), played: new Map() };
// True while a key's first reveal runs, so a re-render in that window does not cut it short.
function playing(key) {
  if (REDUCED.matches) return false;
  if (!USE.played.has(key)) USE.played.set(key, performance.now() + 700);
  return performance.now() < USE.played.get(key);
}
const DAY = 864e5;
const WEEKS = 26;
const UNUSED_DAYS = 90;
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const useKeys = s => [s.invoke, s.name, s.dir_name, s.plugin && `${s.plugin}:${s.name}`].filter(Boolean);

// Usage is keyed by the name a skill was called by; map each name to one installed skill.
function indexUsage(d) {
  USE.raw = d;
  const recs = SKILLS.filter(s => s.status !== 'stale');
  const exact = new Map();
  for (const s of recs) for (const k of useKeys(s)) if (!exact.has(k)) exact.set(k, s);
  const by = new Map();
  for (const n of new Set([...Object.keys(d.counters || {}), ...Object.keys(d.skills || {})])) {
    let s = exact.get(n);
    // A skill that was renamed with a prefix: lint became acme-lint.
    if (!s) { const m = recs.filter(r => r.name.endsWith('-' + n)); if (m.length === 1) s = m[0]; }
    if (!s) continue;
    if (!by.has(s)) by.set(s, { counted: 0, seen: 0, days: {}, projects: {}, last: 0 });
    const u = by.get(s), c = d.counters?.[n], t = d.skills?.[n];
    if (c) { u.counted += c.count; u.last = Math.max(u.last, Date.parse(c.last) || 0); }
    if (t) {
      for (const [day, k] of Object.entries(t.days)) { u.days[day] = (u.days[day] || 0) + k; u.seen += k; }
      for (const [pr, k] of Object.entries(t.projects)) u.projects[pr] = (u.projects[pr] || 0) + k;
      u.last = Math.max(u.last, Date.parse(t.last) || 0);
    }
  }
  // Claude Code's counter keeps the full history; old transcripts get cleaned up. Trust the larger.
  for (const u of by.values()) u.count = Math.max(u.counted, u.seen);
  USE.by = by;
}
const uses = s => USE.by.get(s)?.count || 0;
const lastUsed = s => USE.by.get(s)?.last || 0;
const isUnused = s => USE.ready && s.scope !== 'project' && s.status !== 'stale' && Date.now() - lastUsed(s) > UNUSED_DAYS * DAY;
const short = n => (n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n));
function ago(ms) {
  const days = Math.floor((midnight() - new Date(ms).setHours(0, 0, 0, 0)) / DAY);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 14) return `${days} days ago`;
  if (days < 60) return `${Math.round(days / 7)} weeks ago`;
  return `${Math.round(days / 30)} months ago`;
}

// Weekly totals ending today, oldest first.
function weekly(days, n) {
  const out = Array(n).fill(0);
  const today = midnight();
  for (const [day, k] of Object.entries(days)) {
    const back = Math.round((today - new Date(day + 'T00:00')) / DAY);
    const w = n - 1 - Math.floor(back / 7);
    if (w >= 0 && w < n) out[w] += k;
  }
  return out;
}
function spark(values, cls = 'spark') {
  const max = Math.max(...values, 1);
  return `<span class="${cls}" aria-hidden="true">${values.map(v => `<i style="--v:${(v / max).toFixed(2)}"></i>`).join('')}</span>`;
}

function useCell(s) {
  if (!USE.ready || s.status === 'stale') return '<span class="use" data-k="use"></span>';
  const u = USE.by.get(s);
  if (!u?.count) return '<span class="use" data-k="use"></span>';
  return `<span class="use" data-k="use" data-leaf title="${plural(u.count, 'use')} · last ${ago(u.last)}">${spark(weekly(u.days, 12))}<span>${short(u.count)}</span></span>`;
}
function groupSpark(list) {
  if (!USE.ready) return '';
  const w = weekly(sumDays(list), 12);
  return w.some(Boolean) ? `<span class="gspark" data-k="gs" data-leaf title="Uses per week, last 12 weeks">${spark(w)}</span>` : '';
}

const fmtDay = day => new Date(day + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
// A 26-week calendar. Each key plays its reveal once; later renders paint it still.
function heatmap(days, key) {
  const today = midnight();
  const start = new Date(today);
  start.setDate(start.getDate() - start.getDay() - (WEEKS - 1) * 7);
  const cells = [];
  let max = 0, total = 0, active = 0;
  for (const d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const day = isoDay(d), n = days[day] || 0;
    cells.push([day, n, d.getMonth(), d.getDate()]);
    max = Math.max(max, n); total += n; if (n) active++;
  }
  const lvl = n => (n ? Math.max(1, Math.min(4, Math.ceil(4 * Math.log1p(n) / Math.log1p(max)))) : 0);
  const play = playing(key);
  const months = [];
  const grid = cells.map(([day, n, m, date], i) => {
    const w = Math.floor(i / 7), dow = i % 7;
    if (date <= 7 && dow === 0 && w > 0) months.push(`<span style="grid-column:${w + 1}">${new Date(day + 'T00:00').toLocaleDateString(undefined, { month: 'short' })}</span>`);
    const title = `${fmtDay(day)} · ${n ? plural(n, 'use') : 'no uses'}`;
    return `<i data-l="${lvl(n)}" data-t="${esc(title)}" style="grid-area:${dow + 1}/${w + 1};--d:${(w + dow) * 9}ms"${day === isoDay(today) ? ' data-today' : ''}></i>`;
  }).join('');
  const summary = `${plural(total, 'use')} on ${plural(active, 'day')} in saved sessions`;
  return `<div class="heat${play ? ' play' : ''}" data-k="heat:${esc(key)}" data-leaf>
    <div class="heat-months" aria-hidden="true">${months.join('')}</div>
    <div class="heat-grid" role="img" aria-label="${esc(summary)}">${grid}</div>
    <div class="heat-foot"><span class="heat-read" data-default="${esc(summary)}">${esc(summary)}</span>
      <span class="heat-scale" aria-hidden="true"><span>Less</span><i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i><span>More</span></span></div>
  </div>`;
}

function waitHtml() {
  if (USE.status === 'error') return '<p class="use-note" data-k="uw">This server cannot read usage. Restart ./atlas to load the new version.</p>';
  if (USE.error) return `<p class="use-note" data-k="uw">Could not read usage: ${esc(USE.error)}</p>`;
  const [done, all] = USE.progress;
  return `<div class="use-wait" data-k="uw"><span>Reading your agent sessions… <span class="tnum">${done.toLocaleString()} of ${all.toLocaleString()}</span></span>
    <span class="track"><i style="transform:scaleX(${all ? (done / all).toFixed(3) : 0})"></i></span></div>`;
}

function usageHtml(s) {
  if (!WRITABLE || s.kind === 'avail' || s.scope === 'project' || s.status === 'stale') return '';
  const u = USE.by.get(s);
  const key = selKey(s);
  let body;
  if (!USE.ready && !u) body = waitHtml();
  else if (!u?.count) {
    body = `<p class="use-note" data-k="un" data-leaf>No recorded uses yet.${s.scope === 'personal' && state(s).on ? ' Every skill that is on costs a little context in each session, so turn off the ones you never use.' : ''}</p>`;
  } else {
    const play = playing(key);
    const top = Object.entries(u.projects).sort((a, b) => b[1] - a[1]).slice(0, 4);
    const most = top[0]?.[1] || 1;
    body = `${useStats(u.count, u.last, Object.keys(u.days).length, play)}
      ${USE.ready ? heatmap(u.days, key) : waitHtml()}
      ${USE.ready && u.counted > u.seen ? `<p class="use-note" data-k="uc" data-leaf>Claude Code counted ${plural(u.counted, 'use')} in all. Old sessions get deleted, so the calendar shows fewer.</p>` : ''}
      ${top.length ? `<div class="proj${play ? ' play' : ''}" data-k="pj" data-leaf>${top.map(([name, n], i) => `<span>${esc(name)}</span><span class="tnum">${n}</span><span class="bar"><i style="--v:${(n / most).toFixed(3)};--i:${i}"></i></span>`).join('')}</div>` : ''}`;
  }
  return useSec(body);
}

function inventoryUsageHtml(lv) {
  if (!WRITABLE) return '';
  if (!USE.ready) return `<div class="d-sec uses" data-k="iu"><h3 class="sub" data-leaf>Usage</h3>${waitHtml()}</div>`;
  const unused = lv.filter(isUnused).length;
  return `<div class="d-sec uses" data-k="iu">
    <h3 class="sub" data-leaf>Usage</h3>
    ${heatmap(sumDays(lv), 'all')}
    ${topHtml(lv)}
    ${unused ? `<p class="use-note" data-k="uu" data-leaf>${plural(unused, 'skill')} not used in ${UNUSED_DAYS} days. <button class="linkbtn" data-view-unused>Show them</button></p>` : ''}
  </div>`;
}

// Counts up from zero with the reveal, so the number lands with the heatmap.
function countUp(node) {
  const end = +node.dataset.count;
  node.style.minWidth = node.getBoundingClientRect().width + 'px';
  const t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / 500);
    node.textContent = Math.round(end * (1 - (1 - k) ** 3)).toLocaleString();
    if (k < 1 && node.isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

async function loadUsage() {

// ---------------------------------------------------------------- bulk actions
// What each action would touch among the marked skills, so every button shows a real count.
function bulkPlan() {
  const list = markedSkills();
  const own = list.filter(s => s.scope === 'personal' && live(s) && (switchable() || ui.root === 'all'));
  const plugins = [...new Set(list.filter(s => s.scope === 'plugin' && s.status !== 'stale').map(s => s.plugin_ref))];
  const pluginOn = ref => DATA.settings[ui.root]?.enabledPlugins?.[ref] === true;
  return {
    list,
    on: { skills: own.filter(s => !state(s).on), plugins: plugins.filter(r => !pluginOn(r)) },
    off: { skills: own.filter(s => state(s).on), plugins: plugins.filter(pluginOn) },
    update: own.filter(s => s.store && isOutdated(s)),
    link: own.filter(s => s.store && !lockName(s)),
    del: own.filter(s => s.store),
  };
}

function renderBulk() {
  document.body.classList.toggle('marking', ui.marked.size > 0);
  if (!ui.marked.size) return patch(el('bulk'), '');
  const b = bulkPlan();
  const hidden = b.list.filter(s => !visible(s)).length;
  const n = x => x.skills.length + x.plugins.length;
  const btn = (k, label, count, attrs, cls = 'btn ghost') => `<button class="${cls}" data-k="${k}" ${attrs}${count ? '' : ' disabled'}>${label}${count ? ` <span class="tnum">${count}</span>` : ''}</button>`;
  const acts = ui.bulkLink
    ? `<form data-k="blf" data-bulk-link><input name="repo" placeholder="owner/repo" aria-label="GitHub repo to link ${plural(b.link.length, 'skill')} to" autocomplete="off" spellcheck="false" required>
        <button class="btn">Link ${b.link.length}</button><button type="button" class="btn ghost" data-bulk-link-cancel>Cancel</button>
        ${ui.bulkErr ? `<span class="err" role="alert">${esc(ui.bulkErr)}</span>` : ''}</form>`
    : [
      btn('on', 'Turn on', n(b.on), 'data-bulk="on"'),
      btn('off', 'Turn off', n(b.off), 'data-bulk="off"'),
      btn('up', 'Update', b.update.length, 'data-bulk="update"', 'btn accent'),
      btn('ln', 'Link to GitHub…', b.link.length, 'data-bulk="link"'),
      `<button class="btn ghost" data-k="cp" data-bulk="copy">${ICON.copy}Copy as prompt</button>`,
      btn('del', 'Delete…', b.del.length, 'data-bulk="delete"', 'btn danger'),
