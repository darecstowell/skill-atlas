  patch(el('bulk'), `${allMarkHtml()}<span class="count" data-k="n">${plural(b.list.length, 'skill')} selected${hidden ? ` <span>${hidden} hidden by filters</span>` : ''}</span>
    <span class="acts" data-k="a">${acts}</span>
    <span class="end" data-k="e"><button class="btn ghost" data-k="cl" data-bulk="clear">Clear <kbd>esc</kbd></button></span>`);
}

async function bulkToggle(on) {
  const plan = bulkPlan()[on ? 'on' : 'off'];
  const names = plan.skills.map(s => s.name), refs = plan.plugins;
  cascade(rowSwitches(names), on);
  if (names.length) await post('skill', names, on);
  if (refs.length) await post('plugin', refs, on);
  const what = [names.length ? plural(names.length, 'skill') : '', refs.length ? plural(refs.length, 'plugin') : ''].filter(Boolean).join(' and ');
  toast(`Turned <b>${what}</b> ${on ? 'on' : 'off'}. Restart ${esc(harnessName())} sessions to pick it up.`, async () => {
    cascade(rowSwitches(names), !on);
    if (names.length) await post('skill', names, !on);
    if (refs.length) await post('plugin', refs, !on);
  });
}

async function bulkLink(form) {
  const names = bulkPlan().link.map(s => s.dir_name);
  try {
    const r = await api('/api/link', { names, repo: form.repo.value });
    if (!r.linked.length) { ui.bulkErr = `No folder in ${r.repo} has the same name as these skills.`; return renderBulk(); }
    ui.bulkLink = false; ui.bulkErr = null;
    await reloadData(); await checkUpdates(true);
    toast(`Linked <b>${r.linked.length}</b> to ${esc(r.repo)}.${r.missing.length ? ` No folder for: ${esc(r.missing.join(', '))}.` : ''}`);
  } catch (err) {
    ui.bulkErr = err.message; renderBulk();
  }
}

async function bulk(action) {
  const b = bulkPlan();
  if (action === 'clear') return setMarks([...ui.marked], false);
  if (action === 'on' || action === 'off') return bulkToggle(action === 'on').catch(err => { rerender(); toast(`Could not save: ${esc(err.message)}`); });
  if (action === 'update') return updateBatch(b.update);
  if (action === 'link') { ui.bulkLink = true; ui.bulkErr = null; renderBulk(); el('bulk').querySelector('input')?.focus(); return; }
  if (action === 'copy') {
    const text = b.list.map(s => '/' + s.invoke).join(' ');
    return navigator.clipboard.writeText(text).then(() => toast(`Copied ${plural(b.list.length, 'skill')}: <code>${esc(text.length > 80 ? text.slice(0, 80) + '…' : text)}</code>`), () => toast('Could not copy.'));
  }
  if (action === 'delete') {
    if (!await confirmDelete(b.del)) return;
    for (const s of b.del) ui.marked.delete(markKey(s));
    return deleteSkills(b.del);
  }
}

el('bulk').addEventListener('submit', e => { e.preventDefault(); bulkLink(e.target); });

// ---------------------------------------------------------------- toast
let toastTimer, toastGone, toastUndo = null;
function toast(html, undo) {
  const t = el('toast');
  clearTimeout(toastTimer); clearTimeout(toastGone);
  t.classList.remove('leaving');
  toastUndo = undo || null;
  const acts = undo ? '<span class="acts"><button class="btn accent" data-undo>Undo</button><kbd>⌘</kbd><kbd>Z</kbd></span>' : '';
  t.innerHTML = `<span>${html}</span>${acts}`;
  t.hidden = false;
  const words = t.textContent.split(/\s+/).length;
  const arm = ms => { clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms); };
  arm(Math.max(undo ? 8000 : 4000, words * 300));
  t.onmouseenter = () => clearTimeout(toastTimer);
  t.onmouseleave = () => arm(2500);
}
function hideToast() {
  const t = el('toast');
  clearTimeout(toastTimer);
  t.classList.add('leaving');
  toastUndo = null;
  toastGone = setTimeout(() => { t.hidden = true; t.classList.remove('leaving'); }, 150);
}
function runUndo() {
  const fn = toastUndo;
  if (!fn) return false;
  hideToast(); fn();
  return true;
}

// ---------------------------------------------------------------- server calls
// Says when this page and the server no longer match: the code changed, or the server restarted.
function staleBand(kind) {
  const b = el('stale');
  b.innerHTML = kind === 'restarted'
    ? 'The server restarted, so this page is out of date. <button class="linkbtn" data-reload>Reload the page</button>'
    : 'Skill Atlas changed on disk. Stop <code>./atlas</code> (Ctrl-C) and start it again.';
  b.hidden = false;
}

async function api(path, body) {
  const res = await fetch(path, body === undefined
    ? { headers: { 'X-Atlas-Token': DATA.api_token } }
    : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Atlas-Token': DATA.api_token }, body: JSON.stringify(body) });
  const build = res.headers.get('X-Atlas-Build');
  if (build && DATA.server?.build && build !== DATA.server.build) staleBand('restarted');
  const data = await res.json().catch(() => ({}));
  if (data.server?.stale) staleBand('changed');
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { data, status: res.status });
  return data;
}

async function post(kind, names, on, root = ui.root) {
  DATA.settings[root] = await api('/api/toggle', { root, kind, names, on });
  rerender();
}

// Flip each visible switch in order so a bulk change reads top to bottom; the patch keeps these nodes.
function cascade(switches, on) {
  const step = Math.min(18, 140 / Math.max(switches.length, 1));
  switches.forEach((sw, i) => {
    if (!REDUCED.matches) sw.style.setProperty('--d', `${Math.round(i * step)}ms`);
    sw.setAttribute('aria-checked', on);
  });
  setTimeout(() => switches.forEach(sw => sw.style.removeProperty('--d')), 450);
}

function rowSwitches(names) {
  const set = new Set(names);
  return [...el('list').querySelectorAll('.row [data-kind="skill"]')].filter(sw => set.has(sw.dataset.key));
}

async function setSource(source, on) {
  const all = SKILLS.filter(s => live(s) && sourceOf(s) === source);
  // Only the skills that change, so Undo restores each one to where it was.
  const changed = all.filter(s => state(s).on !== on).map(s => s.name);
  cascade(rowSwitches(changed), on);
  await post('skill', changed, on);
  toast(`Turned <b>${plural(changed.length, 'skill')}</b> from <b>${esc(source)}</b> ${on ? 'on' : 'off'}. Restart ${esc(harnessName())} sessions to pick it up.`,
    async () => { cascade(rowSwitches(changed), !on); await post('skill', changed, !on); });
}

async function setSetting(kind, key, on, { quiet = false, root = ui.root } = {}) {
  await post(kind, [key], on, root);
  if (!quiet) {
    const what = kind === 'plugin' ? `plugin ${key.split('@')[0]}` : key;
    toast(`Turned <b>${esc(what)}</b> ${on ? 'on' : 'off'}. Restart ${esc(harness(root)?.name || harnessName())} sessions to pick it up.`,
      () => setSetting(kind, key, !on, { quiet: true, root }));
  }
}

async function checkUpdates(refresh = false) {
  upd.checking = true; renderChrome();
  try {
    const data = await api('/api/updates' + (refresh ? '?refresh=1' : ''));
    Object.assign(upd, { status: data.skills, errors: data.errors, checkedAt: data.checked_at, available: data.available || {}, watched: data.watched || [] });
    // Drop cached descriptions that miss a path the repo now offers.
    for (const [repo, d] of Object.entries(upd.descs)) {
      if (d.skills && (upd.available[repo] || []).some(a => !d.skills[a.path])) delete upd.descs[repo];
    }
  } catch (err) {
    toast(`Could not check for updates: ${esc(err.message)}`);
  } finally {
    upd.checking = false; rerender();
  }
}

async function reloadData() {
  const token = DATA.api_token;
  const prev = ui.selected;
  DATA = { ...(await api('/api/data')), api_token: token };
  SKILLS = DATA.skills; index();
  if (USE.raw) indexUsage(USE.raw);
  if (prev?.kind === 'group') { ui.selected = membersOf(prev).length || (prev.type === 'src' && upd.available[prev.source]) ? prev : null; return; }
  // An available skill that just got installed stays selected as the installed skill.
  ui.selected = prev?.kind === 'avail'
    ? SKILLS.find(s => live(s) && s.dir_name === prev.a.name && s.origin?.source === prev.repo) || prev
    : SKILLS.find(s => s.path === prev?.path) || null;
}

async function loadDescs(repo) {
  const all = upd.available[repo] || [];
  if (!all.length || upd.descs[repo]) return;
  upd.descs[repo] = { loading: true };
  try {
    const r = await api('/api/available', { repo, paths: all.map(a => a.path) });
    upd.descs[repo] = { skills: r.skills };
  } catch (err) {
    upd.descs[repo] = { error: err.message };
  }
  rerender();
}

const announce = msg => { el('announce').textContent = msg; };

function runUpdate(skills, note = '') {
  const names = skills.map(lockName);
  return runJob('update', () => api('/api/update', { names }), names, note);
}

// One job at a time: update or install. Rows show queued → working → ✓, the header bar fills.
async function runJob(kind, start, names, note = '', repo = '') {
  if (!names.length) return;
  upd.confirm = null;
  if (upd.job?.done) upd.job = null;
  const [ing, ed] = VERBS[kind];
  try {
    upd.job = { ...(await start()), kind };
  } catch (err) {
    return toast(`Could not start: ${esc(err.message)}`);
  }
  announce(`${ing} ${plural(names.length, 'skill')}.`);
  resetBar(); rerender();

  while (!upd.job.done) {
    await sleep(300);
    const prev = JSON.stringify(upd.job.items);
    upd.job = { ...(await api('/api/jobs/' + upd.job.id).catch(err => {
      if (err.status !== 404) return upd.job;
      for (const i of Object.values(upd.job.items)) if (RUNNING.has(i.state)) Object.assign(i, { state: 'failed', error: err.message });
      return { ...upd.job, done: true, seconds: 0 };
    })), kind };
    if (prev !== JSON.stringify(upd.job.items) || upd.job.done) rerender();
  }

  const items = Object.entries(upd.job.items);
  const failed = items.filter(([, i]) => i.state === 'failed');
  const ok = items.length - failed.length;
  if (kind === 'install' && upd.available[repo]) {
    // Installed skills leave the Available list now rather than after the next check.
    const done = new Set(items.filter(([, i]) => i.state === 'done').map(([n]) => n));
    upd.available[repo] = upd.available[repo].filter(a => !done.has(a.name));
  }
  await reloadData();
  await checkUpdates();
  const where = kind === 'install' && repo ? ` from ${esc(repo)}` : '';
  const msg = failed.length
    ? `${ed} ${ok}, <b>${failed.length} failed</b>: ${esc(failed[0][1].error)}. Use Retry on the row.`
    : `${ed} <b>${ok === 1 ? esc(names[0]) : plural(ok, 'skill')}</b>${where} in ${upd.job.seconds}s.${note} Restart ${esc(harnessName())} sessions to pick it up.`;
  toast(msg);
  announce(msg.replace(/<[^>]+>/g, ''));

  // Hold the full bar for a beat, fade it, then let the ✓ labels leave.
  const job = upd.job;
  await sleep(900); if (upd.job !== job) return;
  job.fade = true; renderChrome();
  await sleep(1100); if (upd.job !== job) return;
  job.leaving = true; rerender();
  await sleep(160); if (upd.job !== job) return;
  if (failed.length) {
    for (const [n, i] of items) if (i.state !== 'failed') delete job.items[n];
    job.leaving = false;
  } else {
    upd.job = null;
  }
  rerender();
}

function installFrom(repo, list) {
  if (jobRunning()) return toast('Another job is still running.');
  const ok = list.filter(a => !a.taken);
  if (!ok.length) return;
  runJob('install', () => api('/api/install', { repo, paths: ok.map(a => a.path) }), ok.map(a => a.name), '', repo);
}

async function dismissNew(repo) {
  const fresh = newIn(repo);
  if (!fresh.length) return;
  try {
    await api('/api/dismiss', { repo, paths: fresh.map(a => a.path) });
  } catch (err) { return toast(`Could not dismiss: ${esc(err.message)}`); }
  fresh.forEach(a => { a.new = false; });
  // Keep the list where the user is looking, even though it no longer has news.
  collapsed.add('+av:' + repo); collapsed.delete('av:' + repo);
  saveCollapsed();
  rerender();
  toast(`Dismissed ${plural(fresh.length, 'new skill')} from <b>${esc(repo)}</b>. They stay under Available.`);
}

async function watchSource(form) {

    const n = (upd.available[r.repo] || []).length;

async function unwatch(repo) {
  ui.menu = null;
  try {
    upd.watched = (await api('/api/watch', { repo, on: false })).watched;
  } catch (err) { return toast(`Could not stop watching: ${esc(err.message)}`); }
  const kept = upd.available[repo];
  if (!SKILLS.some(s => live(s) && sourceOf(s) === repo)) delete upd.available[repo];
  rerender();
  toast(`Stopped watching <b>${esc(repo)}</b>.`, async () => {
    upd.watched = (await api('/api/watch', { repo, on: true })).watched;
    if (kept) upd.available[repo] = kept;
    rerender();
  });
}

// Skills you edited are left out of batch updates; they need their own confirmed click.
function updateBatch(list) {
  if (jobRunning()) return toast('An update is already running.');
  const out = list.filter(isOutdated);
  const safe = out.filter(s => !s.local_edits);
  const skipped = out.length - safe.length;
  const note = skipped ? ` Skipped <b>${skipped}</b> you edited; update those one at a time.` : '';
  if (!safe.length) return toast(`All ${skipped} have your edits. Update them one at a time.`);
  runUpdate(safe, note);
}

function updateOne(name, confirmed) {
  if (jobRunning()) return toast('An update is already running.');
  const s = SKILLS.find(x => lockName(x) === name);
  if (!s) return;
  if (s.local_edits && !confirmed) {
    upd.confirm = name; rerender();
    setTimeout(() => { if (upd.confirm === name) { upd.confirm = null; rerender(); } }, 4000);
    return;
  }
  runUpdate([s]);
}

// Row positions before a change, so rows that stay can slide into place afterwards.
function measure() {
  const top = new Map();
  for (const r of el('list').querySelectorAll('.row')) {
    const b = r.getBoundingClientRect();
    if (b.bottom > 0 && b.top < innerHeight) top.set(r, b.top);
  }
  return top;
}
function flip(before) {
  if (REDUCED.matches) return;
  for (const [r, y] of before) {
    if (!r.isConnected) continue;
    const dy = y - r.getBoundingClientRect().top;
    if (Math.abs(dy) > 1) r.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 200, easing: 'cubic-bezier(.645,.045,.355,1)' });
  }
}

// Ask before a delete: what moves, from where, and which harnesses stop loading it. Resolves true to go on.
function confirmDelete(list) {
  const dlg = el('confirmDel');
  const n = list.length;
  const ids = [...new Set(list.flatMap(s => s.harnesses))].filter(id => harness(id));
  const names = ids.map(id => harness(id).label);
  const who = names.length > 3 ? `${names.slice(0, 3).join(', ')}, and ${names.length - 3} more` : names.join(names.length === 2 ? ' and ' : ', ');
  const edited = list.filter(s => s.local_edits).length;
  dlg.innerHTML = `<form method="dialog">
    <h2 id="cdTitle">Move ${n === 1 ? `<code>/${esc(list[0].invoke)}</code>` : plural(n, 'skill')} to the Trash?</h2>
    <p class="cd-lead">${who ? `${n === 1 ? 'It stops' : 'They stop'} loading in ${esc(who)}.` : ''} Lock entries and on/off settings for ${n === 1 ? 'it' : 'them'} go too.</p>
    <ul class="cd-list">${list.map(s => `<li><span class="nm">/${esc(s.invoke)}</span>${s.local_edits ? '<span class="tag edited">edited</span>' : ''}<span class="cd-path">${esc(tilde(s.dir))}</span></li>`).join('')}</ul>
    ${edited ? `<p class="note warn">${plural(edited, 'skill')} ${edited === 1 ? 'has' : 'have'} changes you made after install.</p>` : ''}
    <p class="cd-undo">You can undo this from the toast, or take the folders back out of the Trash.</p>
    <div class="cd-acts"><button class="btn" value="cancel" autofocus>Cancel</button><button class="btn danger solid" value="ok">Move ${n === 1 ? '' : `${n} `}to Trash</button></div>
  </form>`;
  dlg.returnValue = '';
  // A click on the backdrop lands on the dialog itself; the form covers the panel.
  dlg.onclick = e => { if (e.target === dlg) dlg.close('cancel'); };
  dlg.showModal();
  return new Promise(resolve => dlg.addEventListener('close', () => resolve(dlg.returnValue === 'ok'), { once: true }));
}

async function deleteSkills(list) {
  ui.menu = null;
  const names = list.map(s => s.dir_name);
  try {
    await api('/api/delete', { names });
  } catch (err) {
    rerender();
    return toast(`Could not delete: ${esc(err.message)}`);
  }
  const paths = new Set(list.map(s => s.path));
  const rows = [...el('list').querySelectorAll('.row')].filter(r => paths.has(r.dataset.k.slice(2)));
  if (!REDUCED.matches && rows.length) {
    const anims = rows.slice(0, 40).map(r => r.animate([{}, { opacity: 0, transform: 'translateX(-8px)' }], { duration: 150, easing: 'cubic-bezier(.55,.055,.675,.19)', fill: 'forwards' }));
    await Promise.all(anims.map(a => a.finished.catch(() => {})));
  }
  if (names.includes(ui.selected?.dir_name)) ui.selected = null;
  await reloadData();
  const before = rows.length <= 40 ? measure() : new Map();
  rerender(); flip(before);
  toast(`Moved <b>${names.length === 1 ? esc(names[0]) : plural(names.length, 'skill')}</b> to the Trash.`, async () => {
    try {
      const r = await api('/api/undo-delete', {});
      await reloadData();
      ui.restored = new Set(SKILLS.filter(s => r.restored.includes(s.dir_name)).map(s => s.path));
      const b = measure();
      rerender(); flip(b);
      setTimeout(() => { ui.restored.clear(); rerender(); }, 1500);
      toast(`Put back ${plural(r.restored.length, 'skill')}.`);
    } catch (err) { toast(`Could not undo: ${esc(err.message)}`); }
  });
}

async function linkSkills(form) {
  const key = form.dataset.key;
  const btn = form.querySelector('button:not([type])');
  btn.disabled = true; btn.textContent = 'Linking…';

    if (!r.linked.length) {
      ui.linkErr = { key, msg: `No folder in ${r.repo} has the same name as ${key.startsWith('skill:') ? 'this skill' : 'these skills'}.` };

    ui.linkErr = null; ui.linkOpen = null;

    toast(`Linked <b>${r.linked.length}</b> to ${esc(r.repo)}.${r.missing.length ? ` No folder for: ${esc(r.missing.join(', '))}.` : ''}`);
  } catch (err) {

document.addEventListener('click', async e => {
  const t = e.target;
  if (ui.menu && !t.closest('.menu-wrap')) closeMenu(false);

  const mk = t.closest('[data-mark]');
  if (mk) {
    const key = mk.dataset.mark;
    if (!(e.shiftKey && markRange(key))) setMarks([key], !ui.marked.has(key));
    ui.lastMark = key;
    return;
  }
  const mg = t.closest('[data-mark-group]');
  if (mg) return setMarks(mg.dataset.markGroup.split('\n'), mg.getAttribute('aria-checked') !== 'true');
  const bk = t.closest('[data-bulk]');
  if (bk) return bulk(bk.dataset.bulk);
  if (t.closest('[data-bulk-link-cancel]')) { ui.bulkLink = false; ui.bulkErr = null; return renderBulk(); }
  const sw = t.closest('.switch');
  if (sw) {
    if (!WRITABLE) return toast('This page is read-only. Run <b>./atlas</b> to change skills.');
    if (sw.getAttribute('aria-disabled') === 'true') return;
    const was = sw.getAttribute('aria-checked');
    const on = was !== 'true';
    sw.setAttribute('aria-checked', on);
    try {
      if (sw.dataset.kind === 'source') await setSource(sw.dataset.key, on);
      else await setSetting(sw.dataset.kind, sw.dataset.key, on, { root: sw.dataset.h || ui.root });
    } catch (err) { sw.setAttribute('aria-checked', was); rerender(); toast(`Could not save: ${esc(err.message)}`); }
    return;
  }
  const u = t.closest('[data-update]');
  if (u) return updateOne(u.dataset.update, Boolean(u.dataset.confirmed));
  if (t.closest('[data-update-all]')) return updateBatch(SKILLS.filter(live));
  const us = t.closest('[data-update-source]');
  if (us) return updateBatch(SKILLS.filter(s => live(s) && sourceOf(s) === us.dataset.updateSource));
  if (t.closest('[data-recheck]')) return checkUpdates(true);
  if (t.closest('[data-view-new]')) return showView('new');
  const io = t.closest('[data-install-one]');
  if (io) {
    const a = (upd.available[io.dataset.installOne] || []).find(x => x.path === io.dataset.path);
    return a && installFrom(io.dataset.installOne, [a]);
  }
  const ia = t.closest('[data-install]');
  if (ia) {
    const all = upd.available[ia.dataset.install] || [];
    return installFrom(ia.dataset.install, ia.dataset.which === 'new' ? all.filter(a => a.new) : all);
  }
  const dm = t.closest('[data-dismiss]');
  if (dm) return dismissNew(dm.dataset.dismiss);
  if (t.closest('[data-watch-open]')) {
    ui.watchOpen = true; ui.linkErr = null; collapsed.delete('sec:personal'); render();
    el('list').querySelector('#watch-repo')?.focus(); return;
  }
  if (t.closest('[data-watch-cancel]')) {
    ui.watchOpen = false; ui.linkErr = null; render();
    el('list').querySelector('[data-watch-open]')?.focus(); return;
  }
  const uw = t.closest('[data-unwatch]');
  if (uw) return unwatch(uw.dataset.unwatch);

  const mb = t.closest('[data-menu]');
  if (mb) {
    if (ui.menu === mb.dataset.menu) return closeMenu();
    ui.menu = mb.dataset.menu; render();
    el('list').querySelector('.menu [role="menuitem"]')?.focus();
    return;
  }
  const f = t.closest('[data-fold]');
  if (f) {
    const id = f.dataset.fold;
    if (id.startsWith('av:') && !ui.q && ui.view !== 'new') {
      // Available lists open by default only when they have news, so the stored flag means "not the default".
      const repo = id.slice(3);
      const installed = SKILLS.filter(s => live(s) && sourceOf(s) === repo).length;
      const flag = newIn(repo).length || !installed ? 'av:' + repo : '+av:' + repo;
      collapsed.has(flag) ? collapsed.delete(flag) : collapsed.add(flag);
    } else if (!ui.q && !(ui.view === 'new' && id.startsWith('src:'))) collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    saveCollapsed();
    render(); return;
  }
  const fa = t.closest('[data-fold-all]');
  if (fa) {
    const ids = fa.dataset.foldAll.split('\n');
    const close = !ids.every(g => collapsed.has(g));
    ids.forEach(g => (close ? collapsed.add(g) : collapsed.delete(g)));
    saveCollapsed();
    render(); return;
  }
  const sl = t.closest('[data-show-link]');
  if (sl) {
    ui.linkOpen = sl.dataset.showLink; ui.menu = null; ui.linkErr = null;
    collapsed.delete('src:' + ui.linkOpen);
    render(); el('list').querySelector('.linkform input')?.focus(); return;
  }
  if (t.closest('[data-link-cancel]')) {
    const src = ui.linkOpen;
    ui.linkOpen = null; ui.linkErr = null; render();
    el('list').querySelector(`[data-menu="${CSS.escape(src)}"]`)?.focus();
    return;
  }
  const del = t.closest('[data-delete], [data-delete-source]');
  if (del) {
    const list = (del.dataset.delete
      ? SKILLS.filter(s => live(s) && s.dir_name === del.dataset.delete)
      : SKILLS.filter(s => live(s) && sourceOf(s) === del.dataset.deleteSource)).filter(s => s.store);
    ui.menu = null;
    if (await confirmDelete(list)) return deleteSkills(list);
    return rerender();
  }
  const rv = t.closest('[data-reveal]');
  if (rv) return api('/api/reveal', { path: rv.dataset.reveal }).catch(err => toast(`Could not reveal: ${esc(err.message)}`));
  const open = t.closest('.open');
  if (open && open.dataset.avail) return selectAvail(open.dataset.avail, open.dataset.path);
  if (open) return select(SKILLS[+open.dataset.id]);
  if (t.closest('[data-close]') || t.id === 'scrim') { const k = selKey(ui.selected); select(null); focusRow(k); return; }
  if (t.closest('[data-reload]')) return location.reload();
  if (t.closest('[data-view]')) return openViewer(ui.selected);
  const go = t.closest('[data-group]');
  if (go) return selectGroup(go.dataset.group);
  const pick = t.closest('[data-pick]');
  if (pick) return select(SKILLS[+pick.dataset.pick]);
  if (t.closest('[data-view-unused]')) return showView('unused');
  if (t.closest('[data-more]')) { ui.descOpen = !ui.descOpen; renderDetail(); return; }
  if (t.closest('[data-undo]')) return runUndo();
  const copy = t.closest('[data-copy]');
  if (copy) return copyFrom(copy, copy.dataset.copy);
  if (t.closest('[data-clear]')) return reset();
  if (t.closest('[data-show-project]')) { el('showProject').checked = true; ui.showProject = true; markDisplay(); return render(); }
  if (t.closest('[data-help-close]') || t.id === 'help') return closeHelp();
});

function menuKeys(e) {
  const items = [...el('list').querySelectorAll('.menu [role="menuitem"]')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus();
    return true;
  }
  if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); items[e.key === 'Home' ? 0 : items.length - 1]?.focus(); return true; }
  if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); return true; }
  if (e.key === 'Tab') { closeMenu(false); return true; }
  return false;
}

document.addEventListener('keydown', e => {
  const t = e.target;
  const typing = t.matches('input[type="search"], input[type="text"], input:not([type]), textarea');
  const mod = e.metaKey || e.ctrlKey;

  if (el('confirmDel').open) return;
  if (el('viewer').open) {
    if (!typing && !mod && e.key === 'r') { e.preventDefault(); setRaw(!viewer.raw); }
    return;
  }
  if (!el('help').hidden) {
    if (e.key === 'Escape' || e.key === '?') { e.preventDefault(); closeHelp(); }
    if (e.key === 'Tab') e.preventDefault();
    return;
  }
  if (ui.menu && t.closest?.('.menu-wrap') && menuKeys(e)) return;

  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); el('q').focus(); el('q').select(); return; }
  if (mod && e.key.toLowerCase() === 'z' && !typing && !e.shiftKey) { if (runUndo()) e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === 'a' && !typing && WRITABLE) {
    e.preventDefault(); setMarks([...el('list').querySelectorAll('.row > .mark')].map(m => m.dataset.mark), true); return;
  }
  if (mod || e.altKey) return;

  if (e.key === 'Escape') {
    if (t === el('q')) {
      if (el('q').value) { el('q').value = ''; ui.q = ''; render(); }
      else { el('q').blur(); if (!focusRow(selKey(ui.selected))) moveCursor(1); }
      return;
    }
    if (typing && t.closest('.linkform')) { ui.linkOpen = null; ui.watchOpen = false; ui.linkErr = null; render(); return; }
    if (typing && t.closest('#bulk')) { ui.bulkLink = false; ui.bulkErr = null; renderBulk(); return; }
    if (ui.menu) return closeMenu();
    if (upd.confirm) { upd.confirm = null; rerender(); return; }
    if (ui.marked.size) return setMarks([...ui.marked], false);
    if (ui.selected) { const k = selKey(ui.selected); select(null); focusRow(k); }
    return;
  }
  if (typing) return;

  if (e.key === '/') { e.preventDefault(); el('q').focus(); el('q').select(); return; }
  if (e.key === '?') { e.preventDefault(); openHelp(); return; }
  if (e.key === 'c') { setCompact(!ui.compact); return; }
  if (e.key === ']') { setPanel(document.body.classList.contains('nopanel')); return; }
  if (e.key === 'm' && WRITABLE) {
    const k = t.closest?.('.row')?.querySelector(':scope > .mark')?.dataset.mark;
    if (k) { setMarks([k], !ui.marked.has(k)); ui.lastMark = k; }
    return;
  }
  if (e.key === 's') { const order = ['name', 'uses', 'recent']; setSort(order[(order.indexOf(ui.sort) + 1) % 3]); toast(`Sorted by ${{ name: 'name', uses: 'most used', recent: 'recently used' }[ui.sort]}.`); return; }
  if (e.key === 'g') { setLayout(ui.layout === 'cards' ? 'list' : 'cards'); render(); return; }
  if (e.key === 'v') {
    const o = t.matches?.('.open') ? t : null;
    const s = o ? (o.dataset.avail ? null : SKILLS[+o.dataset.id]) : ui.selected;
    if (o?.dataset.avail) { selectAvail(o.dataset.avail, o.dataset.path); return openViewer(ui.selected); }
    return openViewer(s);
  }
  if (e.key === 'j' || e.key === 'k') { e.preventDefault(); moveCursor(e.key === 'j' ? 1 : -1); return; }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && (t.matches('.open') || t === document.body)) {
    e.preventDefault(); moveCursor(e.key === 'ArrowDown' ? 1 : -1); return;
  }

  const rowEl = t.closest?.('.row');
  if (!rowEl || !t.matches('.open')) return;
  if (e.key === 'x' || e.key === ' ') {
    e.preventDefault();
    rowEl.querySelector('.switch[data-kind]:not([aria-disabled])')?.click();
    return;
  }
  if (e.key === 'u') {
    const b = rowEl.querySelector('[data-update]');
    if (b) updateOne(b.dataset.update, Boolean(b.dataset.confirmed));
  }
  if (e.key === 'i') rowEl.querySelector('[data-install-one]')?.click();
});

new ResizeObserver(() => document.documentElement.style.setProperty('--head-h', el('head').offsetHeight + 'px')).observe(el('head'));
el('band').hidden = WRITABLE;
if (WRITABLE && DATA.server?.stale) staleBand('changed');
document.body.classList.toggle('ro', !WRITABLE);
setCompact(ui.compact);
setLayout(ui.layout);
applyTheme();
render();
renderDetail();
if (WRITABLE) { checkUpdates(); loadUsage(); }
</script>
</body>
</html>
