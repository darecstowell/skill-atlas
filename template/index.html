<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skill Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.5' fill='%236CB2E8'/%3E%3Cpath d='M19.6 7.2 12.4 24.8' stroke='%230F1317' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  // Set before first paint, so a light theme never flashes dark.
  try {
    const pick = localStorage.getItem('atlas.theme') || 'system';
    document.documentElement.dataset.theme = pick === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pick;
    document.documentElement.dataset.palette = localStorage.getItem('atlas.palette') || 'atlas';
    document.documentElement.dataset.bg = localStorage.getItem('atlas.bg') || 'none';
    document.documentElement.dataset.scale = localStorage.getItem('atlas.scale') || 'default';
  } catch { document.documentElement.dataset.theme = 'dark'; }
</script>
<style>
  :root, [data-palette] {
    /* Palette: neutral hue and chroma scale, accent hue and chroma scale. */
    --nh: 250; --nk: 1; --ah: 242; --ak: 1;
  }
  [data-palette="stone"] { --nh: 75; --nk: 1.6; --ah: 255; --ak: .9; }
  [data-palette="sage"] { --nh: 160; --nk: 1.4; --ah: 195; --ak: .85; }
  [data-palette="heather"] { --nh: 315; --nk: 1.3; --ah: 290; --ak: .9; }
  [data-palette="graphite"] { --nh: 250; --nk: 0; --ah: 250; --ak: 0; }
  :root {
    color-scheme: dark;
    --bg: oklch(.165 calc(.008 * var(--nk)) var(--nh)); --surface-1: oklch(.195 calc(.009 * var(--nk)) var(--nh)); --surface-2: oklch(.235 calc(.011 * var(--nk)) var(--nh)); --surface-3: oklch(.275 calc(.012 * var(--nk)) var(--nh));
    --border: oklch(.27 calc(.01 * var(--nk)) var(--nh)); --border-strong: oklch(.34 calc(.012 * var(--nk)) var(--nh));
    --text: oklch(.95 calc(.004 * var(--nk)) var(--nh)); --text-2: oklch(.80 calc(.01 * var(--nk)) var(--nh)); --text-3: oklch(.66 calc(.012 * var(--nk)) var(--nh)); --text-disabled: oklch(.48 calc(.01 * var(--nk)) var(--nh));
    --accent: oklch(.76 calc(.11 * var(--ak)) var(--ah)); --on-accent: oklch(.17 calc(.02 * var(--ak)) var(--ah));
    --on: oklch(.76 .15 155); --warn: oklch(.82 .12 75); --danger: oklch(.76 .14 25);
    --knob: oklch(.98 0 0);
    --focus: oklch(.95 0 0 / .85);
    --tint-accent: color-mix(in oklab, var(--accent) 14%, var(--surface-1));
    --tint-on: color-mix(in oklab, var(--on) 12%, var(--surface-1));
    --tint-warn: color-mix(in oklab, var(--warn) 12%, var(--surface-1));
    --row-hover: var(--surface-1); --row-selected: var(--surface-2);
    --shadow-pop: 0 0 0 1px var(--border-strong), 0 2px 4px oklch(0 0 0 / .3), 0 12px 32px oklch(0 0 0 / .45);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --r-sm: 4px; --r-md: 6px; --r-lg: 10px; --r-pill: 999px;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --ease-out-quart: cubic-bezier(.165, .84, .44, 1);
    --ease-in-cubic: cubic-bezier(.55, .055, .675, .19);
    --ease-swap: cubic-bezier(.25, .1, 0, 1);
    --ease-drawer: cubic-bezier(.32, .72, 0, 1);
    --z-sticky: 10; --z-header: 20; --z-drawer: 30; --z-menu: 40; --z-toast: 50; --z-help: 60;
    --head-h: 85px;
    /* Each source gets a hue (--h); these fix its lightness and chroma per theme. */
    --id-bg: .33 .07; --id-fg: .87 .1; --id-line: .68 .13; --id-tint: 7%;
    --img-edge: oklch(1 0 0 / .1);
    --tint-violet: color-mix(in oklab, oklch(.76 .11 300) 14%, var(--surface-1)); --violet: oklch(.8 .1 300);
    --hl1: .34 .055; --hl2: .47 .09; --hl3: .61 .12; --hl4: .76 .14;
    --elevation-raised: 0 0 0 1px oklch(1 0 0 / .09);
    --elevation-raised-hover: 0 0 0 1px oklch(1 0 0 / .15);
    --tex: none; --tex-size: cover;
    /* Fixed to the viewport, so sticky heads that repeat it line up with the page. */
    --page: var(--tex) center / var(--tex-size) fixed, var(--bg);
  }
  :root[data-bg="contours"] { --tex: url(bg/contours.webp); }
  :root[data-bg="chart"] { --tex: url(bg/chart.webp); }
  :root[data-bg="paper"] { --tex: url(bg/paper.webp); --tex-size: 256px; }
  :root[data-bg="linen"] { --tex: url(bg/linen.webp); --tex-size: 256px; }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: oklch(.985 calc(.003 * var(--nk)) var(--nh)); --surface-1: oklch(1 0 0); --surface-2: oklch(.955 calc(.005 * var(--nk)) var(--nh)); --surface-3: oklch(.925 calc(.006 * var(--nk)) var(--nh));
    --border: oklch(0 0 0 / .09); --border-strong: oklch(0 0 0 / .16);
    --text: oklch(.23 calc(.012 * var(--nk)) var(--nh)); --text-2: oklch(.43 calc(.014 * var(--nk)) var(--nh)); --text-3: oklch(.52 calc(.014 * var(--nk)) var(--nh)); --text-disabled: oklch(.68 calc(.01 * var(--nk)) var(--nh));
    --accent: oklch(.50 calc(.115 * var(--ak)) var(--ah)); --on-accent: oklch(1 0 0);
    --on: oklch(.50 .115 155); --warn: oklch(.52 .11 65); --danger: oklch(.52 .17 25);
    --focus: oklch(.25 0 0 / .8);
    --shadow-pop: 0 0 0 1px var(--border), 0 2px 4px oklch(0 0 0 / .06), 0 12px 32px oklch(0 0 0 / .12);
    --id-bg: .93 .045; --id-fg: .44 .12; --id-line: .6 .14; --id-tint: 6%;
    --img-edge: oklch(0 0 0 / .1);
    --tint-violet: oklch(.95 .03 300); --violet: oklch(.47 .14 300);
    --hl1: .91 .045; --hl2: .8 .09; --hl3: .67 .13; --hl4: .53 .15;
    --elevation-raised: 0 0 0 1px oklch(0 0 0 / .05), 0 1px 3px oklch(0 0 0 / .05), 0 4px 10px -4px oklch(0 0 0 / .05);
    --elevation-raised-hover: 0 0 0 1px oklch(0 0 0 / .07), 0 1px 3px oklch(0 0 0 / .07), 0 4px 10px -4px oklch(0 0 0 / .08);
  }
  /* The whole page scales together, spacing and all, so nothing has to change size on its own. */
  :root { zoom: 1.08; }
  :root[data-scale="small"] { zoom: 1; }
  :root[data-scale="large"] { zoom: 1.16; }
  .theming, .theming *, .theming *::before, .theming *::after { transition: none !important; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text);
    font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  mark { background: color-mix(in oklab, var(--accent) 28%, transparent); color: inherit; border-radius: 2px; }
  a { color: var(--text-2); text-decoration-color: var(--border-strong); text-underline-offset: 2px; }
  a:hover { color: var(--text); }
  kbd {
    display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
    font: 500 11px/1 var(--mono); color: var(--text-3);
    border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: var(--r-sm);
  }
  .tnum { font-variant-numeric: tabular-nums; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- buttons ---------- */
  .btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 28px; padding: 0 10px; border-radius: var(--r-md); border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: 500; white-space: nowrap; text-decoration: none; cursor: pointer;
    transition: color 120ms ease, background-color 120ms ease, border-color 120ms ease, scale 150ms var(--ease-out);
  }
  .btn::before { content: ""; position: absolute; inset: -6px -2px; }
  .btn:hover { color: var(--text); }
  .btn:active { scale: .96; }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .btn.primary:hover { background: color-mix(in oklab, var(--accent) 88%, var(--text)); color: var(--on-accent); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover, .btn.ghost[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }
  .btn.accent { background: transparent; border-color: transparent; color: var(--accent); }
  .btn.accent:hover { background: var(--tint-accent); }
  .btn.danger { color: var(--danger); }
  .btn.danger.confirm { background: var(--danger); border-color: transparent; color: var(--on-accent); }
  .btn.warn { color: var(--warn); }
  .btn.warn.confirm { background: var(--warn); border-color: transparent; color: oklch(.2 .02 75); }
  .btn.icon { width: 28px; padding: 0; }
  .btn[disabled] { color: var(--text-disabled); cursor: default; }
  .btn svg { width: 14px; height: 14px; flex: none; }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: var(--z-header); background: var(--page); border-bottom: 1px solid var(--border); }
  .bar1, .bar2 { max-width: 1440px; margin: 0 auto; padding: 0 var(--s5); display: flex; align-items: center; gap: var(--s3); }
  .bar1 { height: 48px; }
  .bar2 { height: 36px; gap: var(--s4); }
  .brand { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .brand svg { width: 18px; height: 18px; }
  .search { position: relative; flex: 1; max-width: 520px; }
  .search input {
    width: 100%; height: 32px; padding: 0 40px 0 32px; border-radius: var(--r-md);
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text); font-size: 13px;
    transition: border-color 120ms ease, background-color 120ms ease;
  }
  .search input::placeholder { color: var(--text-3); }
  .search input:focus-visible { outline: none; border-color: var(--border-strong); background: var(--surface-2); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .glass { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 14px; height: 14px; color: var(--text-3); pointer-events: none; }
  .search kbd { position: absolute; right: 8px; top: 50%; translate: 0 -50%; pointer-events: none; }
  .search .k-esc { display: none; }
  .search input:focus ~ .k-slash, .search input:not(:placeholder-shown) ~ .k-slash { display: none; }
  .search input:focus:not(:placeholder-shown) ~ .k-esc { display: inline-grid; }
  .cluster { margin-left: auto; display: flex; align-items: center; gap: var(--s2); font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .cluster b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .cluster .warn { color: var(--warn); }
  .meta { margin-left: auto; display: flex; gap: var(--s3); font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
  .meta b { color: var(--text-2); font-weight: 500; font-variant-numeric: tabular-nums; }
  .meta code { font: 11.5px var(--mono); color: var(--text-2); }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
  .check input { accent-color: var(--accent); margin: 0; }

  .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-md); background: var(--surface-1); border: 1px solid var(--border); }
  .seg[hidden] { display: none; }
  .seg button {
    height: 22px; padding: 0 8px; border: 0; border-radius: var(--r-sm); background: none; color: var(--text-3);
    font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: color 120ms ease, background-color 120ms ease;
  }
  .seg button[hidden] { display: none; }
  .seg button.wait { visibility: hidden; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
  .pop-wrap { position: relative; display: inline-flex; flex: none; }
  .pop-wrap .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .pop-wrap .dot[hidden] { display: none; }
  .pop {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: var(--z-menu); width: 280px; padding: var(--s3);
    display: grid; gap: var(--s3); background: var(--surface-2); border-radius: var(--r-lg); box-shadow: var(--shadow-pop);
    transform-origin: top right; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out);
  }
  .pop[hidden] { display: none; }
  @starting-style { .pop { opacity: 0; transform: scale(.97); } }
  .pop-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); font-size: 12px; color: var(--text-2); }
  .pop .seg { background: var(--surface-1); }
  .pop hr { border: 0; border-top: 1px solid var(--border); margin: 0; }
  .seg.theme button { width: 26px; padding: 0; justify-content: center; }
  .seg.theme svg { width: 14px; height: 14px; }
  .swatches { display: flex; gap: 6px; }
  .swatches button {
    position: relative; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    background: oklch(.9 calc(.03 * var(--nk)) var(--nh));
    box-shadow: inset 0 0 0 1px oklch(0 0 0 / .1); transition: box-shadow 150ms var(--ease-out);
  }
  .swatches button::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: oklch(.55 calc(.13 * var(--ak)) var(--ah)); }
  .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 3.5px var(--text-2); }
  .pop-col { display: grid; gap: var(--s2); font-size: 12px; color: var(--text-2); }
  .textures { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .textures button {
    display: grid; gap: 4px; padding: 0; border: 0; background: none; color: var(--text-3); font: 500 11px var(--sans); cursor: pointer;
  }
  /* Three layers, so a texture faint enough for the page still reads at this size. */
  .textures i {
    display: block; height: 30px; border-radius: var(--r-md); background: var(--t) center / 240px, var(--t) center / 240px, var(--t) center / 240px, var(--bg);
    box-shadow: inset 0 0 0 1px var(--border); transition: box-shadow 150ms var(--ease-out);
  }
  .textures button:hover { color: var(--text-2); }
  .textures button[aria-pressed="true"] { color: var(--text); }
  .textures button[aria-pressed="true"] i { box-shadow: 0 0 0 1.5px var(--text-2); }
  .seg .n { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"] .n { color: var(--text-2); }

  #bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; pointer-events: none; opacity: 0; transition: opacity 180ms ease-in; }
  #bar.on { opacity: 1; transition: none; }
  #bar i { display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 280ms var(--ease-out-quart); }

  .band {
    height: 28px; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--tint-warn); color: var(--warn); font-size: 12px; border-top: 1px solid var(--border);
  }
  .band[hidden] { display: none; }
  .band code { font: 11.5px var(--mono); color: var(--text); }
  .band .linkbtn { color: inherit; }

  /* ---------- layout ---------- */
  main { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 420px; align-items: start; }
  #list { min-width: 0; padding: 0 var(--s3) 96px 34px; }

  .sec { margin-top: var(--s3); }
  .sec-head {
    position: sticky; top: var(--head-h); z-index: var(--z-sticky); height: 32px; background: var(--page);
    display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2) 0 6px;
  }
  .sec-head .fold { flex: none; white-space: nowrap; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .sec-head .fold .n { font-weight: 500; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .sec-head .tools { margin-left: auto; display: flex; gap: var(--s4); }

  .fold {
    position: relative; display: inline-flex; align-items: center; gap: 6px; min-width: 0;
    background: none; border: 0; padding: 0; cursor: pointer; color: inherit; border-radius: var(--r-sm);
  }
  .fold::before { content: ""; position: absolute; inset: -10px -4px; }
  .chev { width: 12px; height: 12px; flex: none; color: var(--text-3); transition: transform 150ms var(--ease-out-quart); }
  .fold[aria-expanded="false"] .chev { transform: rotate(-90deg); }

  .group-head {
    position: sticky; top: calc(var(--head-h) + 32px); z-index: calc(var(--z-sticky) - 1);
    height: 38px; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2) 0 6px;
    background: var(--page); border-bottom: 1px solid var(--border);
  }
  .group + .group { margin-top: 4px; }
  body.big-groups .group-head { height: 52px; gap: 10px; }
  body.big-groups .group-head .ava { width: 28px; height: 28px; border-radius: var(--r-md); font-size: 13px; }
  body.big-groups .gname { font-size: 14.5px; }
  body.big-groups .gsub { font-size: 12.5px; }
  body.big-groups .group + .group { margin-top: 6px; }
  .gname { font: 600 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gsub { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .gsub .tnum { color: var(--text-2); }
  .gctl { display: flex; align-items: center; gap: var(--s2); flex: none; }
  .group.collapsed .group-head { border-bottom-color: transparent; }
  .group-head[aria-current="true"] { box-shadow: inset 0 -2px 0 oklch(var(--id-line) var(--h, var(--ah))); }
  .gopen { all: unset; position: relative; display: inline-flex; align-items: center; gap: var(--s2); min-width: 0; cursor: pointer; border-radius: var(--r-sm); }
  .gopen::before { content: ""; position: absolute; inset: -9px -4px; }
  .gopen:hover .gname { text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .gopen:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .group-head .fold { padding: 4px; margin: -4px 0 -4px -4px; }
  /* Every sticky head is its own stacking layer; lift the one whose menu is open over its neighbors. */
  .group-head:has(.menu) { z-index: calc(var(--z-sticky) + 1); }
  .group > .group-head { background: var(--tex) center / var(--tex-size) fixed, color-mix(in oklab, oklch(var(--id-line) var(--h)) var(--id-tint), var(--bg)); }

  .ava {
    position: relative; flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: var(--r-sm); overflow: hidden;
    background: oklch(var(--id-bg) var(--h, var(--ah))); color: oklch(var(--id-fg) var(--h, var(--ah))); font: 700 11px/1 var(--sans); text-transform: uppercase;
  }
  .ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; outline: 1px solid var(--img-edge); outline-offset: -1px; border-radius: inherit; }
  .ava svg { width: 12px; height: 12px; }
  .ava.lg { width: 28px; height: 28px; border-radius: var(--r-md); font-size: 14px; }

  /* ---------- rows ---------- */
  .row {
    position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto; align-items: center; gap: var(--s3);
    min-height: 44px; padding: 4px var(--s2) 4px 15px; border-radius: var(--r-md);
    scroll-margin-top: calc(var(--head-h) + 76px); scroll-margin-bottom: 24px;
  }
  .row::before {
    content: ""; position: absolute; left: 4px; top: 9px; bottom: 9px; width: 3px; border-radius: 2px;
    background: transparent; transition: background-color 200ms ease;
  }
  .row[data-st="on"]::before, .row[data-st="done"]::before { background: var(--on); }
  .row[data-st="outdated"]::before, .row[data-st="busy"]::before { background: var(--accent); }
  .row[data-st="edited"]::before { background: var(--warn); }
  .row[data-st="project"]::before { background: var(--border-strong); }
  .row[data-st="busy"]::before { animation: rail 1.2s ease-in-out infinite alternate; }
  @keyframes rail { to { opacity: .35; } }
  @media (hover: hover) and (pointer: fine) { .row:hover { background: var(--row-hover); } }
  .row[aria-current="true"] { background: var(--row-selected); }
  .row[aria-current="true"]::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px var(--border-strong);
  }
  .row:has(.open:focus-visible)::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 2px var(--focus);
  }
  .row.enter { transition: opacity 240ms var(--ease-out-quart), transform 240ms var(--ease-out-quart); }
  @starting-style { .row.enter { opacity: 0; transform: translateY(4px); } }
  .row.restored { animation: restored 700ms ease-out; }
  @keyframes restored { from { background: color-mix(in oklab, var(--accent) 14%, transparent); } }
  .open { all: unset; cursor: pointer; min-width: 0; display: grid; gap: 1px; padding: 2px 0; }
  .nm { display: flex; align-items: center; gap: var(--s2); min-width: 0; min-height: 18px; }
  .nmt { font: 500 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .slash { color: var(--text-3); }
  .desc { color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row[data-off] .nmt { color: var(--text-3); }
  .row[data-off] .desc { color: var(--text-disabled); }
  .kh { display: none; gap: 4px; }
  .row:has(.open:focus-visible) .kh { display: inline-flex; }

  body.compact .row { min-height: 30px; padding-top: 1px; padding-bottom: 1px; }
  body.compact .row::before { top: 7px; bottom: 7px; }
  body.compact .open { display: flex; align-items: center; gap: var(--s3); }
  body.compact .nm { flex: none; max-width: 48%; }
  body.compact .desc { color: var(--text-3); flex: 1; min-width: 0; }

  /* ---------- marking for bulk actions: a checkbox in the gutter left of each row ---------- */
  .mark {
    position: absolute; left: -22px; top: 50%; translate: 0 -50%; z-index: 1; width: 16px; height: 16px; padding: 0; border: 0;
    border-radius: 4px; background: var(--surface-1); box-shadow: inset 0 0 0 1.5px var(--border-strong); cursor: pointer;
    display: grid; place-items: center; color: var(--on-accent); opacity: 0; transition: opacity 120ms ease, background-color 120ms ease, box-shadow 120ms ease;
  }
  .mark::before { content: ""; position: absolute; inset: -6px; }
  .mark svg { width: 12px; height: 12px; opacity: 0; transition: opacity 120ms ease; }
  .mark[aria-checked="true"], .mark[aria-checked="mixed"] { background: var(--accent); box-shadow: none; }
  .mark[aria-checked="true"] svg.ck, .mark[aria-checked="mixed"] svg.mx { opacity: 1; }
  .mark svg.mx { position: absolute; }
  @media (hover: hover) and (pointer: fine) { .row:hover > .mark, .group-head:hover > .mark { opacity: 1; } }
  .mark:focus-visible, .mark[aria-checked="true"], .mark[aria-checked="mixed"], body.marking .mark { opacity: 1; }
  @media (hover: none) { .mark { opacity: 1; } #list { padding-left: 32px !important; } }
  body.ro .mark { display: none; }
  .mark.all { position: relative; left: auto; top: auto; translate: none; flex: none; opacity: 1; }
  .all-slot { display: inline-flex; flex: none; }
  .all-slot:empty { display: none; }
  .row[data-marked] { background: color-mix(in oklab, var(--accent) 9%, transparent); }
  @media (hover: hover) and (pointer: fine) { .row[data-marked]:hover { background: color-mix(in oklab, var(--accent) 13%, transparent); } }
  .group-head > .mark { left: -24px; }
  .sec > .group:first-of-type { margin-top: 4px; }
  /* Sticky heads reach into the gutter, so marks scrolling under them stay hidden. */
  .sec-head::before, .group-head::before { content: ""; position: absolute; top: 0; bottom: 0; right: 100%; width: 28px; background: inherit; }

  .bulk { display: none; }
  body.marking .bar2.filters { display: none; }
  body.marking .bar2.bulk { display: flex; }
  .bulk .count { display: inline-flex; align-items: center; gap: var(--s2); font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bulk .count span { font-weight: 400; color: var(--text-3); }
  .bulk .acts { display: flex; align-items: center; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .bulk .acts .tnum { color: inherit; opacity: .7; }
  .bulk .end { margin-left: auto; display: flex; align-items: center; gap: var(--s2); }
  .bulk form { display: flex; align-items: center; gap: 6px; }
  .bulk form input {
    width: 220px; height: 26px; padding: 0 8px; border-radius: var(--r-md); border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: 12.5px var(--mono);
  }
  .bulk .err { color: var(--danger); font-size: 12px; white-space: nowrap; }

  /* ---------- cards: the same .row nodes, laid out in a grid ---------- */
  .thumb { display: none; }
  body.cards .group, body.cards .avail-block, body.cards .sec-body:has(> .row) {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s3); align-items: stretch; padding-bottom: var(--s3);
  }
  body.cards .group > :not(.row), body.cards .avail-block > :not(.row), body.cards .sec-body > :not(.row) { grid-column: 1 / -1; }
  body.cards .group + .group { margin-top: 0; }
  body.cards .group-head { margin-bottom: 0; }
  body.cards .avail-block { padding-bottom: 0; }
  body.cards .row {
    grid-template-columns: minmax(0, 1fr) auto auto; grid-template-rows: 1fr auto; align-items: center; gap: 6px var(--s2);
    min-height: 0; padding: 6px 10px 10px 6px; border-radius: 10px; background: var(--surface-1);
    box-shadow: var(--elevation-raised); transition: box-shadow 150ms ease-out;
  }
  @media (hover: hover) and (pointer: fine) { body.cards .row:hover { background: var(--surface-1); box-shadow: var(--elevation-raised-hover); } }
  body.cards .row[aria-current="true"] { background: var(--surface-1); }
  body.cards .row > .kh, body.cards .row:has(.open:focus-visible) > .kh { display: none; }
  body.cards .row > .mark { left: auto; right: 8px; top: 8px; translate: none; }
  body.cards .row .use { grid-column: 1; grid-row: 2; justify-content: flex-start; padding-left: 16px; min-width: 0; }
  body.cards .row .open { grid-column: 1 / -1; grid-row: 1; align-self: start; display: grid; gap: 4px; padding: 0; }
  body.cards .row .uslot { grid-column: 2; grid-row: 2; min-width: 0; }
  body.cards .row > :last-child { grid-column: 3; grid-row: 2; }
  /* The state rail becomes a status dot in the card footer. */
  body.cards .row::before { left: 12px; top: auto; bottom: 17px; width: 8px; height: 8px; border-radius: 50%; }
  body.cards .thumb {
    position: relative; display: grid; place-items: center; aspect-ratio: 2 / 1; margin-bottom: 4px; border-radius: 4px; overflow: hidden;
    background: oklch(var(--id-bg) var(--h, var(--ah))); color: oklch(var(--id-fg) var(--h, var(--ah))); font: 700 28px/1 var(--sans); text-transform: uppercase;
  }
  body.cards .thumb.strip { aspect-ratio: auto; height: 4px; margin: 0 0 6px; border-radius: 2px; background: oklch(var(--id-line) var(--h, var(--ah))); }
  body.cards .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--surface-2); outline: 1px solid var(--img-edge); outline-offset: -1px; border-radius: inherit; }
  body.cards .nm, body.cards .desc { padding: 0 4px; }
  body.cards .nm { flex-wrap: wrap; row-gap: 4px; max-width: none; }
  body.cards .desc { white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; color: var(--text-2); }
  body.cards.compact .row .open { display: grid; }
  body.cards.compact .thumb { display: none; }
  body.cards.compact .row { padding-top: 10px; }

  /* ---------- usage ---------- */
  .use { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 64px; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .use:empty { min-width: 0; }
  .spark { display: inline-flex; align-items: flex-end; gap: 1px; height: 14px; }
  .spark i { width: 3px; height: 14px; border-radius: 1px; background: oklch(var(--id-line) var(--h, var(--ah))); transform-origin: bottom; transform: scaleY(max(.08, var(--v))); opacity: calc(.35 + var(--v) * .65); }
  .row[data-off] .spark i { background: var(--text-disabled); }
  .gspark { flex: none; margin-left: auto; }
  .gsub + .gspark { margin-left: 0; }
  body.compact .use .spark { display: none; }

  .loaded h3, .uses h3, .inv h3.sub { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .use-stats { display: flex; gap: var(--s5); }
  .use-stats div { display: grid; gap: 1px; }
  .use-stats b { font-size: 18px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .use-stats span { font-size: 12px; color: var(--text-3); }
  .use-note { margin: 0; font-size: 12px; color: var(--text-3); }
  .use-wait { display: grid; gap: 6px; font-size: 12px; color: var(--text-3); }
  .use-wait .track { height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
  .use-wait .track i { display: block; height: 100%; background: var(--accent); transform-origin: left; transition: transform 400ms var(--ease-out-quart); }

  .heat { --cell: 11px; --gap: 3px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
  .heat-months, .heat-grid { display: grid; grid-template-columns: repeat(26, minmax(0, var(--cell))); column-gap: var(--gap); }
  .heat-months { height: 14px; font-size: 10.5px; color: var(--text-3); }
  .heat-months span { white-space: nowrap; }
  .heat-grid { grid-template-rows: repeat(7, auto); row-gap: var(--gap); width: fit-content; max-width: 100%; }
  .heat i { width: 100%; max-width: var(--cell); aspect-ratio: 1; border-radius: 3px; background: var(--surface-3); }
  .heat i[data-l="1"] { background: oklch(var(--hl1) var(--h, var(--ah))); }
  .heat i[data-l="2"] { background: oklch(var(--hl2) var(--h, var(--ah))); }
  .heat i[data-l="3"] { background: oklch(var(--hl3) var(--h, var(--ah))); }
  .heat i[data-l="4"] { background: oklch(var(--hl4) var(--h, var(--ah))); }
  .heat-grid i[data-today] { box-shadow: 0 0 0 1px var(--surface-1), 0 0 0 2px var(--text-3); }
  @media (hover: hover) and (pointer: fine) { .heat-grid i:hover { box-shadow: 0 0 0 1px var(--surface-1), 0 0 0 2px var(--text); } }
  .heat-foot { display: flex; align-items: center; gap: var(--s2); font-size: 11.5px; color: var(--text-3); }
  .heat-read { flex: 1; min-width: 0; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .heat-scale { display: inline-flex; align-items: center; gap: 3px; }
  .heat-scale i { width: 9px; border-radius: 2px; }
  /* One reveal per skill: a diagonal sweep from the oldest week to today. */
  .heat.play .heat-grid i { animation: cell-in 260ms var(--ease-out) backwards; animation-delay: var(--d); }
  @keyframes cell-in { from { opacity: 0; transform: scale(.4); } }
  .proj { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px var(--s3); align-items: center; font-size: 12px; }
  .proj span { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj .bar { grid-column: 1 / -1; height: 4px; margin-top: -3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
  .proj .bar i { display: block; height: 100%; border-radius: inherit; background: oklch(var(--id-line) var(--h, var(--ah))); transform-origin: left; transform: scaleX(var(--v)); }
  .play .proj .bar i { animation: bar-in 420ms var(--ease-out) backwards; animation-delay: calc(140ms + var(--i) * 50ms); }
  @keyframes bar-in { from { transform: scaleX(0); } }
  .top { display: grid; gap: 2px; }
  .top button { all: unset; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: 5px 8px; margin: 0 -8px; border-radius: var(--r-md); cursor: pointer; font-size: 12.5px; }
  .top button:hover { background: var(--surface-2); }
  .top button:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
  .top .nmt { font-size: 12.5px; }
  .top .tnum { color: var(--text-3); font-size: 12px; }

  .tags { display: inline-flex; gap: 4px; flex: none; }
  .tag {
    display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--r-sm);
    border: 1px solid var(--border); font: 500 11px var(--sans); color: var(--text-3); white-space: nowrap;
  }
  .tag.edited { color: var(--warn); background: var(--tint-warn); border-color: transparent; }
  .tag.gone { border-style: dashed; }
  .tag.update { color: var(--accent); background: var(--tint-accent); border-color: transparent; }
  .tag.manual { color: var(--violet); background: var(--tint-violet); border-color: transparent; }

  .uslot { display: flex; justify-content: flex-end; min-width: 84px; }
  .uslot:empty { min-width: 0; }
  .ustate { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; transition: opacity 150ms var(--ease-in-cubic); }
  .ustate.is-busy { color: var(--accent); }
  .ustate.is-done { color: var(--on); }
  .ustate.is-leaving { opacity: 0; }
  .uicon { display: inline-grid; width: 12px; height: 12px; }
  .uicon > * { grid-area: 1 / 1; transition: opacity 300ms var(--ease-swap), transform 300ms var(--ease-swap), filter 300ms var(--ease-swap); }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; border-top-color: transparent; }
  .spin, .tick { opacity: 0; transform: scale(.3); filter: blur(3px); }
  .is-busy .spin { opacity: 1; transform: none; filter: none; animation: spin 700ms linear infinite; }
  .is-done .tick { opacity: 1; transform: none; filter: none; }
  .tick { width: 12px; height: 12px; }
  .is-queued .uicon { display: none; }
  @keyframes spin { to { rotate: 360deg; } }

  /* ---------- available from a source ---------- */
  .chip {
    position: relative; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border: 0;
    border-radius: var(--r-pill); background: var(--tint-accent); color: var(--accent); font: 500 12px var(--sans); white-space: nowrap; cursor: pointer;
    transition: background-color 120ms ease, scale 150ms var(--ease-out);
  }
  .chip::before { content: ""; position: absolute; inset: -8px -2px; }
  .chip:hover { background: color-mix(in oklab, var(--accent) 24%, var(--surface-1)); }
  .chip:active { scale: .96; }
  .gnew { flex: none; }
  .avail-head {
    display: flex; align-items: center; gap: var(--s2); min-height: 36px; padding: 0 var(--s2) 0 15px; margin-top: 2px;
    border-top: 1px dashed var(--border);
  }
  .avail-head .fold { font-size: 12px; color: var(--text-3); }
  .avail-head .fold .n { font-variant-numeric: tabular-nums; }
  .avail-head .gctl { margin-left: auto; }
  .avail-note { margin: 0; padding: 10px 15px 12px; font-size: 12px; color: var(--text-3); }
  .row.avail .nmt { color: var(--text-2); }
  .row.avail[data-st="outdated"] .nmt { color: var(--text); }
  .skel { display: inline-block; width: min(55%, 360px); height: 8px; border-radius: 3px; background: var(--surface-2); vertical-align: middle; }
  .aerr { color: var(--text-3); }

  /* ---------- switch ---------- */
  .switch {
    position: relative; flex: none; width: 32px; height: 18px; padding: 0; border: 0; border-radius: var(--r-pill);
    background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--border-strong); cursor: pointer;
    transition: background-color 150ms ease, box-shadow 150ms ease; transition-delay: var(--d, 0ms);
  }
  .switch::before { content: ""; position: absolute; inset: -7px -6px; }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--text-2); box-shadow: 0 1px 2px oklch(0 0 0 / .35);
    transition: transform 150ms var(--ease-out-quart), background-color 150ms ease, scale 150ms var(--ease-out); transition-delay: var(--d, 0ms);
  }
  .switch[aria-checked="true"] { background: var(--on); box-shadow: none; }
  .switch[aria-checked="true"]::after { transform: translateX(14px); background-color: var(--knob); }
  .switch[aria-checked="mixed"] { background: var(--tint-on); box-shadow: inset 0 0 0 1px var(--on); }
  .switch[aria-checked="mixed"]::after {
    transform: translateX(7px); background: var(--knob) linear-gradient(var(--on), var(--on)) center / 6px 1.5px no-repeat;
  }
  .switch:active::after { scale: .96; }
  .switch[aria-disabled="true"] { cursor: default; background: var(--surface-2); }
  body.ro .switch { display: none; }
  .switch[aria-disabled="true"]::after { background: var(--text-disabled); }

  /* ---------- menu ---------- */
  .menu-wrap { position: relative; display: inline-flex; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: var(--z-menu); min-width: 210px; padding: 4px;
    background: var(--surface-2); border-radius: var(--r-lg); box-shadow: var(--shadow-pop);
    transform-origin: top right; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out);
  }
  @starting-style { .menu { opacity: 0; transform: scale(.97); } }
  .menu [role="menuitem"] {
    display: flex; align-items: center; width: 100%; height: 30px; padding: 0 10px; border: 0; border-radius: var(--r-md);
    background: none; color: var(--text); font-size: 12.5px; text-align: left; cursor: pointer; white-space: nowrap;
  }
  .menu [role="menuitem"]:hover, .menu [role="menuitem"]:focus-visible { background: var(--surface-3); outline: none; }
  .menu [role="menuitem"].danger { color: var(--danger); }
  .menu [role="menuitem"].danger.confirm { background: var(--danger); color: var(--on-accent); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }

  /* ---------- link form ---------- */
  .linkform {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px var(--s2); align-items: end;
    padding: var(--s3); background: var(--surface-1); border-bottom: 1px solid var(--border);
    transition: opacity 180ms var(--ease-out-quart), transform 180ms var(--ease-out-quart);
  }
  @starting-style { .linkform { opacity: 0; transform: translateY(-4px); } }
  .linkform label { grid-column: 1 / -1; font-size: 11.5px; color: var(--text-3); }
  .linkform input {
    height: 28px; padding: 0 8px; border-radius: var(--r-md); border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: 12.5px var(--mono); min-width: 0;
  }
  .linkform input:focus-visible { outline-offset: 0; }
  .linkform .err { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; color: var(--danger); font-size: 12px; }
  .linkform .err svg { width: 14px; height: 14px; flex: none; }
  .card .linkform { padding: 0; background: none; border: 0; margin-top: var(--s2); grid-template-columns: minmax(0, 1fr) auto; }

  /* ---------- empty ---------- */
  .empty { padding: 72px var(--s5); text-align: center; color: var(--text-2); }
  .empty h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--text); text-wrap: balance; }
  .empty p { margin: 0 0 var(--s4); }
  .empty .acts { display: inline-flex; gap: var(--s2); }

  /* ---------- detail ---------- */
  #detail {
    position: sticky; top: var(--head-h); height: calc(100dvh - var(--head-h)); overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
    background: var(--surface-1); border-left: 1px solid var(--border); padding: 20px var(--s5) 64px;
  }
  .banner {
    position: relative; display: grid; place-items: center; margin: 0 0 var(--s4); aspect-ratio: 2 / 1; border-radius: var(--r-lg); overflow: hidden;
    background: oklch(var(--id-bg) var(--h, var(--ah))); color: oklch(var(--id-fg) var(--h, var(--ah))); font: 700 44px/1 var(--sans); letter-spacing: -.02em;
  }
  .banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--surface-2); outline: 1px solid var(--img-edge); outline-offset: -1px; border-radius: inherit; }
  .banner img.ban-ava { position: static; width: 72px; height: 72px; border-radius: 16px; background: none; }
  .banner.short { aspect-ratio: 3 / 1; font-size: 36px; }
  .crumb {
    all: unset; box-sizing: border-box; position: relative; display: flex; align-items: center; gap: var(--s2); max-width: calc(100% + 8px);
    margin: 0 0 var(--s3) -6px; padding: 4px 8px 4px 6px; border-radius: var(--r-md); cursor: pointer;
    font: 500 12px var(--mono); color: var(--text-2); transition: background-color 120ms ease, color 120ms ease;
  }
  .crumb:hover { background: var(--surface-2); color: var(--text); }
  .crumb:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
  .crumb-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumb .star { flex: none; font: 12px var(--sans); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .crumb .cr { flex: none; width: 12px; height: 12px; color: var(--text-3); }
  .d-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 6px 0 0; font-size: 12px; color: var(--text-3); }
  .d-meta .tag { height: 20px; }
  .d-meta:empty { display: none; }
  .loaded { display: grid; gap: 2px; }
  .loaded h3 { margin-bottom: 6px; }
  .lb { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 32px; padding: 0 8px; margin: 0 -8px; border-radius: var(--r-md); font-size: 13px; color: var(--text-2); }
  .lb.cur { background: var(--surface-2); color: var(--text); }
  .lb .note { margin: 0; font-size: 12px; color: var(--text-3); }
  .hdots { display: inline-flex; gap: 3px; justify-self: end; padding: 0 4px; }
  .hdots i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.25px var(--text-3); }
  .hdots i[data-on] { background: var(--on); box-shadow: none; }
  .harness { position: relative; display: inline-flex; flex: none; }
  .harness[hidden] { display: none; }
  .harness select {
    appearance: none; height: 28px; padding: 0 26px 0 10px; border-radius: var(--r-md); border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text); font: 500 12.5px var(--sans); cursor: pointer;
  }
  .harness select:hover { background: var(--surface-2); }
  .harness select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .harness::after { content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; border: solid var(--text-3); border-width: 0 1.5px 1.5px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .invoke { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: var(--s3) 0 0; }
  .who {
    display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: center; column-gap: 8px; row-gap: 1px;
    padding: 8px 10px; border-radius: var(--r-lg); color: var(--text-3); font-size: 12px;
    box-shadow: inset 0 0 0 1px var(--border); background-image: repeating-linear-gradient(-45deg, transparent 0 5px, color-mix(in oklab, var(--text) 4%, transparent) 5px 6px);
  }
  .who svg { width: 14px; height: 14px; grid-row: span 2; }
  .who b { font-weight: 600; font-size: 12.5px; text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--text-3) 60%, transparent); }
  .who span { grid-column: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who code { font: 11.5px var(--mono); color: var(--text); }
  .who[data-on] { color: var(--text-2); background: var(--surface-2); background-image: none; box-shadow: none; }
  .who[data-on] svg { color: var(--accent); }
  .who[data-on] b { color: var(--text); text-decoration: none; }
  .d-acts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-top: var(--s4); }
  .d-top { display: flex; align-items: flex-start; gap: 4px; }
  .d-top > .switch { margin: 5px 0 0 var(--s2); }
  .d-title { flex: 1; min-width: 0; margin: 0; padding-top: 2px; font: 600 18px/1.3 var(--mono); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .d-title .slash { font-weight: 500; }
  .d-desc { margin: var(--s4) 0 0; color: var(--text-2); max-width: 65ch; }
  .d-desc.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .d-more { margin-top: 6px; }
  .linkbtn { position: relative; white-space: nowrap; background: none; border: 0; padding: 0; color: var(--text-2); font-size: 12px; cursor: pointer; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 2px; }
  .linkbtn::before { content: ""; position: absolute; inset: -12px -6px; }
  .linkbtn:hover { color: var(--text); }
  .d-sec { margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--border); display: grid; gap: var(--s3); }
  .d-sec > .btn { justify-self: start; }
  .card { display: flex; align-items: center; gap: var(--s3); padding: var(--s3); border-radius: var(--r-lg); background: var(--surface-2); }
  .card.accent { background: var(--tint-accent); }
  .card > div { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text-2); }
  .card strong { display: block; color: var(--text); font-weight: 600; font-size: 13px; }
  .card .uslot { min-width: 0; }
  .note { font-size: 12px; color: var(--text-3); margin: 4px 0 0; }
  .note.warn { color: var(--warn); }
  dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px var(--s3); margin: 0; font-size: 12.5px; }
  dt { color: var(--text-3); }
  dd { margin: 0; color: var(--text-2); overflow-wrap: anywhere; }
  dd.mono { font: 12px var(--mono); }
  .danger-zone { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
  .danger-zone .note { flex-basis: 100%; }
  .danger-zone .btn.danger { margin-left: auto; }
  .d-close { display: none; }
  #scrim { display: none; }

  .inv h3 { margin: 0 0 var(--s3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
  .stat { padding: 10px var(--s3); border-radius: var(--r-lg); background: var(--surface-2); }
  .stat[data-tone="on"] { background: var(--tint-on); } .stat[data-tone="on"] b { color: var(--on); }
  .stat[data-tone="accent"] { background: var(--tint-accent); } .stat[data-tone="accent"] b { color: var(--accent); }
  .stat[data-tone="warn"] { background: var(--tint-warn); } .stat[data-tone="warn"] b { color: var(--warn); }
  .stat b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .stat span { font-size: 12px; color: var(--text-3); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px var(--s3); align-items: center; font-size: 12.5px; color: var(--text-2); }
  .keys > span:nth-child(odd) { display: inline-flex; gap: 4px; justify-content: flex-end; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: var(--z-toast);
    translate: -50% 0; width: max-content; max-width: min(640px, calc(100vw - 32px));
    display: flex; align-items: center; gap: var(--s3); min-height: 40px; padding: 6px 6px 6px 14px;
    background: var(--surface-3); color: var(--text); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); font-size: 13px;
    transition: opacity 220ms var(--ease-out-quart), transform 220ms var(--ease-out-quart);
  }
  @starting-style { #toast { opacity: 0; transform: translateY(8px); } }
  #toast[hidden] { display: none; }
  #toast.leaving { opacity: 0; transform: translateY(6px); transition-duration: 150ms; transition-timing-function: var(--ease-in-cubic); }
  #toast .acts { display: flex; align-items: center; gap: 4px; flex: none; }
  #toast:not(:has(.acts)) { padding-right: 14px; }

  /* ---------- help ---------- */
  #help {
    position: fixed; inset: 0; z-index: var(--z-help); display: grid; place-items: center; padding: var(--s4);
    background: oklch(0 0 0 / .45); transition: opacity 180ms var(--ease-out);
  }
  @starting-style { #help { opacity: 0; } }
  #help[hidden] { display: none; }
  #help .sheet {
    width: min(420px, 100%); padding: 20px var(--s5) var(--s5); border-radius: var(--r-lg); background: var(--surface-2); box-shadow: var(--shadow-pop);
    transition: transform 180ms var(--ease-out);
  }
  @starting-style { #help .sheet { transform: scale(.97); } }
  #help h2 { margin: 0 0 var(--s4); font-size: 15px; display: flex; align-items: center; }
  #help h2 .btn { margin-left: auto; }

  /* ---------- skill viewer ---------- */
  #confirmDel {
    width: min(460px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: 14px;
    background: var(--surface-1); color: var(--text); box-shadow: var(--shadow-pop);
    opacity: 1; transform: none; transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
  }
  @starting-style { #confirmDel[open] { opacity: 0; transform: scale(.97); } }
  #confirmDel::backdrop { background: oklch(0 0 0 / .45); transition: opacity 180ms var(--ease-out); }
  @starting-style { #confirmDel[open]::backdrop { opacity: 0; } }
  #confirmDel form { padding: 20px var(--s5) var(--s4); }
  #confirmDel h2 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }
  #confirmDel h2 code { font: 600 14px var(--mono); }
  .cd-lead { margin: 6px 0 var(--s3); font-size: 13px; color: var(--text-2); text-wrap: pretty; }
  .cd-list { margin: 0; padding: 4px; list-style: none; max-height: 220px; overflow: auto; border-radius: var(--r-lg); background: var(--surface-2); }
  .cd-list li { display: grid; grid-template-columns: auto auto 1fr; align-items: baseline; column-gap: 8px; padding: 5px 8px; font-size: 12.5px; }
  .cd-list .nm { font: 500 12.5px var(--mono); color: var(--text); }
  .cd-list .tag { align-self: center; }
  .cd-path { grid-column: 1 / -1; font: 11.5px var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #confirmDel .note { margin: var(--s3) 0 0; }
  .cd-undo { margin: var(--s3) 0 0; font-size: 12px; color: var(--text-3); }
  .cd-acts { display: flex; justify-content: flex-end; gap: var(--s2); margin-top: var(--s4); }
  .btn.danger.solid { background: var(--danger); border-color: transparent; color: var(--on-accent); }
  @media (hover: hover) and (pointer: fine) { .btn.danger.solid:hover { background: color-mix(in oklab, var(--danger) 88%, var(--text)); color: var(--on-accent); } }

  #viewer {
    width: min(1120px, calc(100vw - 32px)); height: min(900px, calc(100dvh - 32px)); max-width: none; max-height: none; padding: 0; border: 0;
    border-radius: 14px; background: var(--surface-1); color: var(--text); box-shadow: var(--shadow-pop); overflow: hidden;
    opacity: 1; transform: none; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
  }
  #viewer[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
  @starting-style { #viewer[open] { opacity: 0; transform: scale(.97); } }
  #viewer::backdrop { background: oklch(0 0 0 / .5); transition: opacity 200ms var(--ease-out); }
  @starting-style { #viewer[open]::backdrop { opacity: 0; } }
  .v-head {
    display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: 10px var(--s3) 10px var(--s4);
    border-bottom: 1px solid var(--border); background: color-mix(in oklab, oklch(var(--id-line) var(--h, var(--ah))) var(--id-tint), var(--surface-1));
  }
  .v-title { flex: 1; min-width: 0; display: grid; gap: 1px; }
  .v-title h2 { margin: 0; font: 600 15px/1.3 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v-title p { margin: 0; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v-acts { display: flex; align-items: center; gap: 4px; flex: none; }

  .mode { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: var(--r-md); background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); margin-right: var(--s2); }
  .mode::before {
    content: ""; position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); border-radius: var(--r-sm);
    background: var(--surface-3); box-shadow: 0 1px 2px oklch(0 0 0 / .2); transition: transform 200ms var(--ease-out);
  }
  .mode[data-raw]::before { transform: translateX(100%); }
  .mode button { position: relative; height: 24px; padding: 0 12px; border: 0; background: none; color: var(--text-3); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: color 150ms ease; }
  .mode button:hover, .mode button[aria-pressed="true"] { color: var(--text); }

  .v-body { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0; }
  .v-body.no-toc { grid-template-columns: minmax(0, 1fr); }
  .v-toc { overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: var(--s4) var(--s3) var(--s5); border-right: 1px solid var(--border); font-size: 12.5px; }
  .v-toc h3 { margin: 0 0 var(--s2); padding: 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .v-toc a { display: block; padding: 4px 8px; border-radius: var(--r-sm); color: var(--text-2); text-decoration: none; line-height: 1.35; }
  .v-toc a.l3 { padding-left: 20px; color: var(--text-3); }
  .v-toc a:hover { background: var(--surface-2); color: var(--text); }
  .v-toc[hidden] { display: none; }
  .v-scroll { overflow: auto; overscroll-behavior: contain; min-height: 0; }
  .v-scroll:focus-visible { outline: none; }
  .v-note { margin: 0; padding: 8px var(--s5); font-size: 12px; color: var(--warn); background: var(--tint-warn); }
  .v-load { padding: var(--s6); color: var(--text-3); }

  .md { max-width: 76ch; margin: 0 auto; padding: var(--s5) var(--s6) 80px; font-size: 14px; line-height: 1.65; color: var(--text-2); }
  .md > :first-child { margin-top: 0; }
  .md h1, .md h2, .md h3, .md h4 { color: var(--text); line-height: 1.3; text-wrap: balance; scroll-margin-top: var(--s4); }
  .md h1 { margin: 0 0 var(--s4); font-size: 24px; letter-spacing: -.015em; }
  .md h2 { margin: 36px 0 var(--s3); padding-bottom: 6px; font-size: 18px; border-bottom: 1px solid var(--border); }
  .md h3 { margin: 28px 0 var(--s2); font-size: 15px; }
  .md h4 { margin: 20px 0 6px; font-size: 14px; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md .md-table { margin: 0 0 var(--s4); }
  .md ul, .md ol { padding-left: 22px; }
  .md li { margin: 4px 0; }
  .md li > ul, .md li > ol { margin: 4px 0 0; }
  .md li::marker { color: var(--text-3); }
  .md strong { color: var(--text); font-weight: 600; }
  .md a { color: var(--accent); text-decoration-color: color-mix(in oklab, var(--accent) 40%, transparent); }
  .md .md-rel { color: var(--text); border-bottom: 1px dotted var(--border-strong); }
  .md code { padding: 1px 5px; border-radius: var(--r-sm); background: var(--surface-2); font: 12.5px var(--mono); color: var(--text); }
  .md pre { padding: var(--s3) var(--s4); overflow: auto; border-radius: var(--r-md); background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); }
  .md pre code { padding: 0; background: none; font-size: 12.5px; line-height: 1.6; color: var(--text-2); }
  .md blockquote { padding: 2px 0 2px var(--s4); border-left: 3px solid oklch(var(--id-line) var(--h, var(--ah))); color: var(--text-2); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: var(--s5) 0; }
  .md img { max-width: 100%; border-radius: var(--r-md); outline: 1px solid var(--img-edge); outline-offset: -1px; }
  .md .md-table { overflow-x: auto; }
  .md table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .md th, .md td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  .md th { color: var(--text); font-weight: 600; background: var(--surface-2); }
  .md input[type="checkbox"] { margin: 0 6px 0 0; accent-color: var(--accent); }
  .md-front { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px var(--s4); margin: 0 0 var(--s5); padding: var(--s3) var(--s4); border-radius: var(--r-lg); background: var(--surface-2); font-size: 12.5px; }
  .md-front dt { color: var(--text-3); font-family: var(--mono); }
  .md-front dd { margin: 0; color: var(--text-2); overflow-wrap: anywhere; white-space: pre-line; }

  .raw { margin: 0; padding: var(--s4) 0 80px; font: 12.5px/1.65 var(--mono); color: var(--text-2); counter-reset: ln; }
  .raw span { display: block; padding: 0 var(--s5) 0 64px; white-space: pre-wrap; overflow-wrap: anywhere; position: relative; min-height: 1.65em; }
  .raw span::before {
    counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 44px; text-align: right;
    color: var(--text-disabled); font-variant-numeric: tabular-nums; user-select: none;
  }

  /* ---------- narrow ---------- */
  @property --fade-l { syntax: '<length>'; inherits: false; initial-value: 0px; }
  @property --fade-r { syntax: '<length>'; inherits: false; initial-value: 0px; }
  @keyframes edges { from { --fade-l: 0px; --fade-r: 24px; } to { --fade-l: 24px; --fade-r: 0px; } }
  #panelBtn .pane { opacity: 0; transition: opacity 150ms var(--ease-out); }
  #panelBtn[aria-pressed="true"] .pane { opacity: 1; }
  @media (min-width: 1101px) {
    body.nopanel main { grid-template-columns: minmax(0, 1fr); }
    body.nopanel #detail { display: none; }
  }
  @media (max-width: 1100px) {
    #panelBtn { display: none; }
    main { grid-template-columns: minmax(0, 1fr); }
    .bar2 { overflow-x: auto; scrollbar-width: none; }
    /* Fade an edge only while more tabs sit past it. */
    @supports (animation-timeline: scroll()) {
      .bar2 {
        mask-image: linear-gradient(to right, transparent, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent);
        animation: edges linear both; animation-timeline: scroll(self inline);
      }
    }
    .meta { display: none; }
    #detail {
      position: fixed; top: 0; right: 0; bottom: 0; height: auto; width: min(420px, 100vw); z-index: var(--z-drawer);
      box-shadow: var(--shadow-pop); border-left: 0; visibility: hidden; transform: translateX(100%);
      transition: transform 200ms var(--ease-in-cubic), visibility 0s linear 200ms;
    }
    #detail[data-open] { visibility: visible; transform: none; transition: transform 280ms var(--ease-drawer), visibility 0s; }
    .d-close { display: inline-flex; }
  }
  @media (max-width: 720px) {
    .bar1, .bar2 { padding: 0 var(--s3); }
    #scrim {
      display: block; position: fixed; inset: 0; z-index: calc(var(--z-drawer) - 1); background: oklch(0 0 0 / .45);
      opacity: 0; visibility: hidden; transition: opacity 200ms var(--ease-in-cubic), visibility 0s linear 200ms;
    }
    #detail[data-open] + #scrim { opacity: 1; visibility: visible; transition: opacity 280ms var(--ease-out), visibility 0s; }
    .brand span, .cluster > [data-k="t"], #displayBtn .lbl, .search kbd { display: none !important; }
    .search { min-width: 0; }
    #displayBtn { width: 28px; padding: 0; }
    #displayBtn .dot { position: absolute; top: 4px; right: 4px; }
    .sec-head .tools { gap: var(--s3); }
    #list { padding: 0 var(--s2) 96px; }
    .uslot { min-width: 0; }
    .gsub { display: none; }
    .heat-scale span { display: none; }
    .search input, .linkform input { font-size: 16px; }
    .v-head { flex-wrap: wrap; row-gap: var(--s2); }
    .v-title { flex-basis: calc(100% - 40px); }
    .v-acts { width: 100%; }
    .v-acts .mode { margin-right: auto; }
    .v-body { grid-template-columns: minmax(0, 1fr); }
    .v-toc { display: none; }
    .md { padding: var(--s4) var(--s4) 64px; }
    .raw span { padding: 0 var(--s4) 0 48px; }
    .raw span::before { width: 32px; }
    #detail {
      top: auto; left: 0; width: 100%; height: 85dvh; border-radius: 14px 14px 0 0;
      transform: translateY(100%); padding-bottom: calc(64px + env(safe-area-inset-bottom));
    }
  }

  @media (max-width: 480px) {
    .bar1 { height: auto; flex-wrap: wrap; row-gap: var(--s2); padding-block: var(--s2); }
    .search { order: 1; flex-basis: 100%; max-width: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-property: color, background-color, border-color, box-shadow !important; animation: none !important; }
    .switch, .switch::after { transition-delay: 0ms !important; }
    .spin { display: none; }
    @starting-style { .menu, .linkform, #toast, #help, #help .sheet, .row.enter { opacity: 1; transform: none; } }
    @supports (animation-timeline: scroll()) { @media (max-width: 1100px) { .bar2 { animation: edges linear both !important; animation-timeline: scroll(self inline) !important; } } }
  }
</style>
</head>
<body>
<header id="head">
  <div class="bar1">
    <h1 class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7.5" fill="var(--accent)"/><path d="M19.6 7.2 12.4 24.8" stroke="var(--bg)" stroke-width="3.4" stroke-linecap="round"/></svg><span>Skill Atlas</span></h1>
    <label class="harness"><span class="vh">Harness</span><select id="harness"></select></label>
    <div class="search">
      <svg class="glass" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="search" id="q" placeholder="Search skills, sources, paths" aria-label="Search skills" autocomplete="off" spellcheck="false">
      <kbd class="k-slash">/</kbd><kbd class="k-esc">esc</kbd>
    </div>
    <div class="cluster" id="cluster"></div>
    <div class="pop-wrap" id="displayWrap">
      <button class="btn ghost" id="displayBtn" aria-label="Display" aria-haspopup="dialog" aria-expanded="false" aria-controls="display">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="4.5" r="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="11.5" r="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="lbl">Display</span><i class="dot" id="displayDot" hidden></i>
      </button>
      <div class="pop" id="display" role="dialog" aria-label="Display options" hidden>
        <div class="pop-row"><span>Layout</span>
          <div class="seg" id="layout" role="group" aria-label="Layout">
            <button data-l="list" aria-pressed="true"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>List</button>
